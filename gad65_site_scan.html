<!DOCTYPE html>
<html><body style="margin:0;background:#000;color:#ddd;font-family:monospace">
<pre id="log">GAD65 crystal-derived active site — building…</pre>
<script>
// iso=67 loads the GAD67 site instead of GAD65's. Same 23 fixed atoms, same index map, same box --
// so the two differ in GEOMETRY at FIXED COMPOSITION, which is the construction this framework
// supports. Written before the page's own script so SITE_* are defined when it runs.
document.write('<scr' + 'ipt src="gad' +
  (/[?&]iso=67/.test(location.search) ? '67' : '65') + '_site_atoms.js"></scr' + 'ipt>');
</script>
<script>
// surface failures instead of sitting at "relaxing..." forever
window.onerror = function(m,u,l){
  var el=document.getElementById('log'); if(el) el.textContent += '\nERROR: '+m+' (line '+l+')';
};
window.addEventListener('unhandledrejection', function(e){
  var el=document.getElementById('log'); if(el) el.textContent += '\nGPU REJECTED: '+(e.reason&&e.reason.message||e.reason);
});
// ===========================================================================
//  GAD65 ACTIVE SITE FROM THE CRYSTAL STRUCTURE (PDB 2OKK, Fenalti et al.)
//
//  The gas-phase scan (gad65_decarb_scan.html) contains no enzyme at all: it
//  measures the COFACTOR's effect and cannot distinguish GAD65 from any other
//  PLP decarboxylase. This page adds the enzyme, one residue at a time.
//
//    model=A   PLP core + substrate, on crystal geometry     (no enzyme)
//    model=B   the same + Asp364                             (enzyme)
//
//  Asp364's carboxylate sits 2.46 A from the pyridine N1 in the crystal — it
//  is what holds the ring nitrogen protonated, and therefore what keeps the
//  sink electron-poor. B minus A is that residue's contribution, with ring,
//  imine, substrate and Dunathan alignment held identical.
//
//  GEOMETRY. Ring, O3, C2', C4' and the imine N are crystal coordinates. The
//  substrate is grafted at the positions the lysine vacates on forming the
//  external aldimine: imine N at the crystal NZ, Ca at the crystal CE. The
//  breaking Ca-COO bond is placed along the MEASURED ring normal, so the
//  Dunathan alignment comes out of the structure rather than being imposed
//  (checked: 0.0 deg). Hydrogens are added — X-ray sees none.
//
//  CHARGE. Both models are neutral: pyridinium(+) balances the substrate
//  carboxylate(-). Asp364 is therefore built as the NEUTRAL acid with its
//  proton on OD1, pointing away from N1, so OD2 stays the acceptor. In the
//  enzyme it is very likely ionised; that is an approximation, stated.
//
//  NOT INCLUDED: 5'-phosphate, Lys396 (displaced), the rest of the protein,
//  water. Nuclei clamped; only the electrons relax.
// ===========================================================================
var _t0 = Date.now();
var q = location.search;
var MODEL = (q.match(/[?&]model=([AB])/) || [])[1] || 'A';
var R     = parseFloat((q.match(/[?&]R=([\d.]+)/) || [])[1] || '1.53');   // Ca-CO2 distance, A
var STEPS = parseInt((q.match(/[?&]steps=(\d+)/) || [])[1] || '2000', 10);
// PROTON PROBE. The branch is decided by where a proton lands -- Ca regenerates the enzyme,
// C4' destroys its cofactor -- so the quantity that matters is the force on the INCOMING PROTON,
// not on the carbon nuclei (a nucleus in a symmetric cloud feels no force however much charge
// surrounds it). A bare nucleus, Z=0 with Z_nuc=1, IS a proton: HAS_BARE_NUCLEI supports it.
// Both probe positions give the same atoms, same charge, same grid -- only the probe moves --
// so this is a difference within ONE system, the construction where errors cancel.
//   probe=ca   : on the face Ca presents after CO2 leaves (+up; its H is on -up)
//   probe=c4p  : on the face C4' presents opposite its own H (-up)
var PROBE = (q.match(/[?&]probe=(ca|c4p)/) || [])[1] || '';
// relax=1 : let the proton find its OWN place instead of being clamped where I put it.
// A clamped probe reports a point on the approach curve; the quantity that ranks basic sites is
// the BOUND state. The off-axis force (38-59% of the total) is the calculation saying the proton
// would rather be somewhere else. So: dynamics on, every nucleus frozen except the probe.
var RELAX = /[?&]relax=1/.test(q);
// tdt=, tsteps= : frozen-field TRAJECTORY. Release the probe from rest and integrate it in the
// stored potential (velocity-Verlet, proton mass 1836.15). A single force vector says the probe is
// pushed; a trajectory says where it goes, which is the chemical question. It also avoids the
// gradP ball: Vp/force here are POINTWISE central differences, while window._nucForceTotal is
// averaged over FORCE_RADIUS = max(5, round(3/h)) cells = 1.57 A at this mesh, a sphere that
// swallows every bonded neighbour. Conservation of KE+V is the integrator's own check.
var TRAJ_DT    = parseFloat((q.match(/[?&]tdt=([\d.]+)/)    || [])[1] || '2.0');
var TRAJ_STEPS = parseInt(  (q.match(/[?&]tsteps=(\d+)/)    || [])[1] || '20000', 10);
// psrc=<m> : force the probe's electron potential to come from P_directBuf[m] instead of the
// automatic "furthest electron" choice. P_directBuf[m] omits electron m, so two runs with
// different distant m bound the error that omission costs. Same number from both = controlled.
var PSRC_M = parseInt((q.match(/[?&]psrc=(\d+)/) || [])[1] || '-1', 10);
// aspd=<A> : slide the whole Asp364 block along its OD2->N1 axis so that d(OD2,N1) takes the
// requested value. The crystal difference between the isoforms -- GAD65 2.46 A, GAD67 2.76 -- is
// 0.30 A against a combined coordinate error of 0.26 A and B-factors of 40 on the GAD65 side, so
// it is NOT established and a calculation resting on it would rest on refinement noise. Scanning
// the distance instead asks the question the structures cannot: how much does the branch depend
// on this bond at all? Insensitive over 2.4-2.8 A kills the sink-tuning hypothesis regardless of
// the true distances; strongly sensitive makes better structures worth having.
var ASPD = parseFloat((q.match(/[?&]aspd=([\d.]+)/) || [])[1] || '0');   // 0 = crystal position
var DP    = parseFloat((q.match(/[?&]dp=([\d.]+)/) || [])[1] || '2.0');   // probe stand-off, A
var A2AU  = 1.8897;

function buildAtoms(model, R) {
  var c = SITE_FIXED_A.map(function(a){ return a.slice(); });
  // carboxylate: C along the Dunathan axis at distance R, then two O at 124 deg
  var cx = SITE_UP[0]*R, cy = SITE_UP[1]*R, cz = SITE_UP[2]*R;
  c.push(['C', cx, cy, cz]);
  var ca = Math.cos(62*Math.PI/180), sa = Math.sin(62*Math.PI/180);
  for (var s = 1; s >= -1; s -= 2) {
    var dx = SITE_UP[0]*ca + s*SITE_E1[0]*sa,
        dy = SITE_UP[1]*ca + s*SITE_E1[1]*sa,
        dz = SITE_UP[2]*ca + s*SITE_E1[2]*sa;
    var n = Math.sqrt(dx*dx+dy*dy+dz*dz);
    c.push(['O', cx + 1.25*dx/n, cy + 1.25*dy/n, cz + 1.25*dz/n]);
  }
  if (model === 'B') {
    var asp = SITE_ASP_B.map(function(a){ return a.slice(); });
    if (ASPD > 0) {
      // unit vector from OD2 toward N1, and the current separation
      var od2 = null;
      for (var k = 0; k < SITE_ASP_B.length; k++) if (k === SITE_ASP_OD2) od2 = SITE_ASP_B[k];
      var n1 = SITE_FIXED_A[SITE_IDX.N1];
      var vx = n1[1]-od2[1], vy = n1[2]-od2[2], vz = n1[3]-od2[3];
      var cur = Math.sqrt(vx*vx+vy*vy+vz*vz);
      var shift = cur - ASPD;                       // >0 moves Asp toward N1
      var ux = vx/cur, uy = vy/cur, uz = vz/cur;
      for (var k = 0; k < asp.length; k++) {        // translate the WHOLE group, rigidly
        asp[k][1] += ux*shift; asp[k][2] += uy*shift; asp[k][3] += uz*shift;
      }
    }
    c = c.concat(asp);
  }
  return c;
}

// index of the probe in the final list, or -1
var PROBE_IDX = -1;
function addProbe(c, which, dp) {
  if (!which) return c;
  var host = (which === 'ca') ? SITE_FIXED_A[SITE_IDX.CA] : SITE_FIXED_A[SITE_IDX.C4P];
  var sgn  = (which === 'ca') ? +1 : -1;     // Ca's free face is +up, C4's is -up
  PROBE_IDX = c.length;
  c.push(['H', host[1] + SITE_UP[0]*dp*sgn,
               host[2] + SITE_UP[1]*dp*sgn,
               host[3] + SITE_UP[2]*dp*sgn]);
  return c;
}

var coords = addProbe(buildAtoms(MODEL, R), PROBE, DP);
// FIXED box, sized once for the largest R in the series -- it must NOT depend on R, or the
// mesh h = scr/gridN would change with the reaction coordinate and energies at different R
// would be computed on different grids and not be comparable. Same reason the step count is
// fixed: every point in a series must be relaxed the same way on the same mesh.
// R_MAX and gridN are set by MEMORY, not by taste. The direct per-electron path allocates two
// full-grid buffers per electron: 2 * N * gridN^3 * 4 bytes. At 192^3 with 26 electrons that is
// ~1.5 GB of storage buffers and the device silently fails to start -- the page sits at
// "relaxing..." with the GPU at 0%. The gas-phase model that works is ~0.79 GB. Keep under that.
// The box is CENTRED ON THE SITE CENTROID, not on Ca. Centring on Ca made Asp364's capped
// methyl (10.6 A away, chemically irrelevant) size the box and coarsen the mesh for everything;
// about the centroid the extent is 6.5 A. SITE_BOX is a fixed constant so that A and B -- and
// every R -- sit on exactly the same grid.
var scr = SITE_BOX;
// grid 128. NOTE: an earlier comment here claimed a measured memory ceiling (0.79 GB runs,
// 1.11 GB stalls). That was wrong -- all three "stalls" were this page failing to load p5, so
// nothing ever ran at any size. The direct path does allocate 2 full-grid buffers per domain
// (0.57 GB for model B here), so size remains worth watching, but no limit has been measured.
// h = 0.270 against the gas-phase model's 0.2375; 2h = 0.54 sets the kernel clamp.
var gridN = 128, h = scr/gridN, gN2 = Math.round(gridN/2);
var Zof = { H:1, C:4, N:3, O:2 }, RCof = { H:0, C:0.3, N:0.3, O:0.8 };
var atoms = [], zList = [], rcList = [], zNucList = [];
for (var n = 0; n < coords.length; n++) {
  var el = coords[n][0];
  var isProbe = (n === PROBE_IDX);
  // NO ROUNDING. Snapping kernels to integer cells is worth 39.5 kcal/mol in NH3 and destroys
  // any symmetry that is not axis-aligned -- and a crystal-derived active site is aligned with
  // nothing. Positions reach the GPU as f32 and are never used as array indices. Measured
  // 2026-09-17; see the same fix in nh3_pa.html.
  atoms.push({ i: gN2 + (coords[n][1]-SITE_CENTRE[0])*A2AU/h,
               j: gN2 + (coords[n][2]-SITE_CENTRE[1])*A2AU/h,
               k: gN2 + (coords[n][3]-SITE_CENTRE[2])*A2AU/h,
               Z: isProbe ? 0 : Zof[el], el: el });
  zList.push(isProbe ? 0 : Zof[el]);          // no electron of its own
  zNucList.push(isProbe ? 1 : Zof[el]);       // but a unit positive kernel -> a bare proton
  rcList.push(isProbe ? 0 : RCof[el]);
}
document.getElementById('log').textContent =
  'GAD65 site from 2OKK — model ' + MODEL + '  R=' + R.toFixed(2) + ' A  steps=' + STEPS +
  '\n' + coords.length + ' atoms, ' + zList.reduce(function(a,b){return a+b;},0) + ' electrons, grid ' +
  gridN + '^3, box ' + scr.toFixed(1) + ' a.u.\nrelaxing…';

window.USER_NN = gridN;
window.USER_ATOMS = atoms;
window.USER_SCREEN = scr;
window.USER_Z = zList;
window.USER_Z_NUC = zNucList;
window.USER_RC = rcList;
// CONVERGE FIRST, THEN RELEASE -- the protocol proton_transfer.html uses ("converge first,
// press D"), and molecule.js implements it: at 5693 it auto-enables dynamics after 10000 clamped
// steps, provided CONVERGENCE_THRESHOLD is falsy and NO_AUTO_DYNAMICS is unset. Starting dynamics
// at step 0 pushes the nuclei with forces from a half-solved density (rMax was ~2 at 2000 steps).
window.USER_DYNAMICS = false;             // always start clamped
if (RELAX) {
  if (PROBE_IDX < 0) { throw new Error('relax=1 requires probe=ca or probe=c4p'); }
  var frozen = [];
  for (var fi = 0; fi < coords.length; fi++) if (fi !== PROBE_IDX) frozen.push(fi);
  window.USER_FROZEN_ATOMS = frozen;     // when dynamics does switch on, only the proton moves
  // N_MOVE does double duty: it is the nuclear-move interval AND the force-readback interval
  // (molecule.js:3953). Forces are read back with a full GPU sync every N_MOVE steps, INCLUDING
  // through the 10000-step clamped stage where no nucleus is moving -- 500 pipeline stalls for
  // nothing, which made model B ~10x slower and timed out all four overnight runs. Keep it large
  // while converging, then drop it to 20 once dynamics is on.
  window.USER_N_MOVE = 500;
  setTimeout(function relaxTick(){
    if (window._nucStepCount > 0 || (window.__relaxArmed && window.__phaseSteps > 10000)) {
      window.USER_N_MOVE = 20;   // released: move often
    } else setTimeout(relaxTick, 5000);
  }, 5000);
  window.USER_DAMPING = 0.85;            // settle rather than ring; we want the minimum
  window.USER_NUC_MASS = 1836;           // a proton, not the default
  // moveNuclei() zeroes the force on any atom with Z === 0, ignoring Z_nuc -- so a bare proton
  // never moves under dynamics (measured: force identically [0,0,0] through 100 nuclear steps,
  // displacement 2e-5 A). The force-readback path at molecule.js:4255 uses the correct test,
  // (Z > 0 || Z_nuc > 0); the two disagreed. Opt in rather than change it globally: bare nuclei
  // are also used as fixed KERNELS elsewhere (the conduction cable's ions), where being immovable
  // may be relied upon.
  window.USER_BARE_NUCLEI_MOVE = true;
  delete window.NO_AUTO_DYNAMICS;        // let the built-in two-stage protocol run
} else {
  window.NO_AUTO_DYNAMICS = true;        // pure fixed-step runs stay clamped throughout
}
window.USER_DIRECT_POTHER = true;         // exact i != j every step (see gad65_decarb_scan.html)
// DIRECT COULOMB FORCES, not gradient-of-P. Three reasons, each measured on this page:
//  1. gradP averages <grad P> over FORCE_RADIUS = max(5, round(3/h)) cells = 11 cells = 1.57 A
//     here -- a sphere wider than any bond in the site (C-C 1.54), so it is not a local force.
//  2. its ball centre is round()ed to an integer cell, the snapping worth 39.5 kcal/mol elsewhere.
//  3. decisive: gradP reads P, and P carries a boundary monopole deficit in this box. The
//     angular average of V gives Q_enc = 2.0 / 7.0 / 13.0 / 18.9 at r = 8/10/12/14 au against a
//     required 0, GROWING with r -- the electron potential is only 70% of what neutrality needs
//     at r = 14. molecule.js:1060 documents this failure mode ("every molecule was over-bound").
// The direct Coulomb path integrates the DENSITY instead: sum rho(r)(r-R)/|r-R|^3 at the
// FRACTIONAL nuclear position. No Poisson solve, no boundary condition, no averaging ball, so it
// is immune to all three. Eleven other pages already set this, with the comment "direct Coulomb
// for bare H atoms" -- and the probe is a bare H atom.
window.USER_GRADP_FORCE = false;
// In relax mode the run must NOT stop at STEPS: the auto-release at molecule.js:5693 needs 10000
// clamped steps first, so any STEPS below that ends the run before the nuclei are freed --
// probeStart == probeEnd, which is exactly what the first attempt returned. Follow the
// interactive proton pages: run effectively forever and let the poller close it, counting
// NUCLEAR moves, which only accumulate once dynamics is actually on.
window.USER_STEPS = RELAX ? 1000000 : STEPS;                // fixed-step protocol — no energy-plateau test
window.CONVERGENCE_THRESHOLD = 0;         // must stay falsy or the auto-release at 5693 is skipped
window.USER_BOND_PAIRS = [[SITE_IDX.CA, SITE_FIXED_A.length, 'Ca-CO2:']];
// Ring and label the atoms the chemistry turns on. The probe NEEDS a marker: molecule.js colours
// by electron count, and a bare nucleus (Z=0 -> [255,80,80]) is the same red as oxygen
// (Z=2 -> [255,50,50]). Only the dot size differs (5 vs 10), which is not enough to find it among
// three or five oxygens.
window.USER_MARK_ATOMS = [
  { i: SITE_IDX.CA,  label: 'C\u03B1',  col: [255,220,0] },
  { i: SITE_IDX.C4P, label: "C4'", col: [90,200,255] }
];
if (PROBE_IDX >= 0) {
  window.USER_MARK_ATOMS.push({
    i: PROBE_IDX,
    label: 'H\u207A probe  (' + PROBE + ', ' + DP.toFixed(1) + ' \u00C5)',
    col: [255,0,255]                       // magenta: used by nothing else in the palette
  });
}

// molecule.js only calls onSweepDone when dynamics is OFF -- BOTH call sites are gated on
// !dynamicsEnabled (5699, 5722). So a relax run computes happily and never reports. With the
// nuclei moving we have to close the run ourselves: poll the nuclear step counter and fire the
// same record once it reaches the target. window._E and window._nucStepCount are exposed.
if (RELAX) {
  var targetNucSteps = Math.floor(STEPS / 20);
  document.getElementById('log').textContent += '\nrelax: 10000 clamped steps, then ' + targetNucSteps + ' nuclear moves';
  // PUBLISH PROGRESS TO THE DOM. AppleScript runs in an isolated world and cannot read window.*,
  // so a driver polling window._nucStepCount always sees undefined -- indistinguishable from a
  // run that has not started. The page can see its own globals; write them where the driver can
  // read them. Without this a stalled run and a slow run look identical from outside.
  var _p0 = document.createElement('pre'); _p0.id = 'progress'; _p0.style.color = '#8f8';
  document.body.appendChild(_p0);
  setInterval(function(){
    _p0.textContent = 'phase=' + (window._phaseSteps === undefined ? '?' : window._phaseSteps) +
      '  nucSteps=' + (window._nucStepCount === undefined ? 'undef' : window._nucStepCount) +
      '/' + targetNucSteps +
      '  E=' + (window._E === undefined ? 'undef' : window._E.toFixed(4)) +
      '  dyn=' + (window._dynOn ? 'ON' : 'off') +
      '  t=' + Math.round((Date.now() - _t0)/1000) + 's';
  }, 3000);        // nuclear moves AFTER the 10000-step clamped stage
  var fired = false;
  setInterval(function(){
    if (fired) return;
    if ((window._nucStepCount || 0) >= targetNucSteps && window._E !== undefined) {
      fired = true; window.onSweepDone(window._E);
    }
  }, 2000);
}

// FROZEN-FIELD PROBE. Converge the electrons once, freeze them, then integrate a proton in the
// stored field. A released-proton run costs ~500 GPU steps per nuclear move -- 4 days for a full
// trajectory. This costs one readback and then pure arithmetic, so complete trajectories from many
// starting points become minutes. It neglects the electrons' response to the moving proton, which
// is real and large; the relaxed run is the reference that says how large.
async function frozenFieldProbe() {
  // Read the electron potential from a buffer that is actually FILLED. This page sets
  // USER_DIRECT_POTHER, and on that path P_buf[0] is all zeros -- the probe then saw bare kernels
  // and reported a field force identical to its kernel-only force, which is how this was caught.
  // farFrom picks the omitted electron to be the one furthest from the probe; PSRC_M overrides it
  // so the same run can be repeated with a different omission and the two compared.
  // readPotTotal sums P_directBuf over all domains and divides by (NELEC-1), recovering the exact
  // total electron potential. Verified on water: the angular average of V gives Q_enc = -0.05
  // against a required 0, i.e. the field carries the right number of electrons to ~1%.
  // readPot({m}) is short by one electron and is kept only for the psrc= comparison.
  const np = window._nucPos;
  let P = (PSRC_M >= 0) ? await window.readPot({ m: PSRC_M }) : await window.readPotTotal();
  const PSRC = window._PdataSrc;
  const S = window._PdataS;
  const at = window.USER_ATOMS, zn = window.USER_Z_NUC || [];
  const hh = h;                                   // grid spacing, a.u. per cell
  // potential seen by a UNIT POSITIVE charge at grid position (x,y,z), probe's own kernel excluded
  function Vp(x, y, z) {
    let v = 0;
    for (let a = 0; a < at.length; a++) {
      if (a === PROBE_IDX) continue;
      const Za = (zn[a] !== undefined ? zn[a] : at[a].Z) || 0;
      if (!Za) continue;
      const dx = (x - np[a][0]) * hh, dy = (y - np[a][1]) * hh, dz = (z - np[a][2]) * hh;
      // MIRROR THE SOLVER'S CLAMPING. molecule.js clamps a bare kernel at R_SING = 2h and a
      // pseudopotential kernel at its own r_c. A flat 0.05 made every kernel far deeper than the
      // solver's near its centre, which is the leading suspect for the field force coming out
      // 1.42x too large while pointing in exactly the right direction (cos 0.9999).
      const rcA = (rcList && rcList[a] > 0) ? rcList[a] : (2 * hh);
      v += Za / Math.max(Math.sqrt(dx*dx + dy*dy + dz*dz), rcA);
    }
    // trilinear sample of the electron potential; the factor 2 matches the electron Hamiltonian's
    // +2P term and is CHECKED below against the solver's own force, not assumed.
    const i0 = Math.floor(x), j0 = Math.floor(y), k0 = Math.floor(z);
    let pe = 0;
    if (i0 >= 0 && j0 >= 0 && k0 >= 0 && i0 < S-1 && j0 < S-1 && k0 < S-1) {
      const fx = x-i0, fy = y-j0, fz = z-k0;
      for (let di = 0; di < 2; di++) for (let dj = 0; dj < 2; dj++) for (let dk = 0; dk < 2; dk++) {
        const w = (di?fx:1-fx)*(dj?fy:1-fy)*(dk?fz:1-fz);
        pe += w * P[(i0+di)*S*S + (j0+dj)*S + (k0+dk)];
      }
    }
    return v - 2 * pe;
  }
  // F = -grad V, taken ANALYTICALLY rather than by differencing Vp.
  // Central-differencing the trilinear sample with a half-cell step straddles cell boundaries,
  // where a trilinear field is only C0 and its gradient jumps. The resulting F was not the
  // gradient of anything, and the trajectory's KE+V drifted 4.38 Ha. The exact gradient of the
  // SAME interpolant is conservative by construction, so KE+V is now a real check rather than a
  // measure of the differencing error.
  //   kernel term: V = sum Z_a/max(r_a,rc_a)  ->  F = sum Z_a (r-R_a)/r_a^3, zero inside the clamp
  //   electron term: V = -2P                  ->  F = +2 grad P
  function force(x, y, z) {
    let fx = 0, fy = 0, fz = 0;
    for (let a = 0; a < at.length; a++) {
      if (a === PROBE_IDX) continue;
      const Za = (zn[a] !== undefined ? zn[a] : at[a].Z) || 0;
      if (!Za) continue;
      const dx = (x - np[a][0]) * hh, dy = (y - np[a][1]) * hh, dz = (z - np[a][2]) * hh;
      const r = Math.sqrt(dx*dx + dy*dy + dz*dz);
      const rcA = (rcList && rcList[a] > 0) ? rcList[a] : (2 * hh);
      if (r <= rcA || r === 0) continue;           // clamped region is flat, so no force there
      const k = Za / (r*r*r);
      fx += k * dx; fy += k * dy; fz += k * dz;
    }
    // exact gradient of the trilinear interpolant of P
    const i0 = Math.floor(x), j0 = Math.floor(y), k0 = Math.floor(z);
    if (i0 >= 0 && j0 >= 0 && k0 >= 0 && i0 < S-1 && j0 < S-1 && k0 < S-1) {
      const ax = x-i0, ay = y-j0, az = z-k0;
      let gx = 0, gy = 0, gz = 0;
      for (let di = 0; di < 2; di++) for (let dj = 0; dj < 2; dj++) for (let dk = 0; dk < 2; dk++) {
        const Pv = P[(i0+di)*S*S + (j0+dj)*S + (k0+dk)];
        const wx = di ? ax : 1-ax, wy = dj ? ay : 1-ay, wz = dk ? az : 1-az;
        gx += (di ? 1 : -1) * wy * wz * Pv;
        gy += wx * (dj ? 1 : -1) * wz * Pv;
        gz += wx * wy * (dk ? 1 : -1) * Pv;
      }
      fx += 2 * gx / hh; fy += 2 * gy / hh; fz += 2 * gz / hh;
    }
    return [fx, fy, fz];
  }
  // VERIFY against the solver's own force at the probe's position before trusting anything
  const p0 = np[PROBE_IDX];
  const fF = force(p0[0], p0[1], p0[2]);
  const fS = (window._nucForceTotal || [])[PROBE_IDX] || null;
  const mag = v => v ? Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]) : NaN;
  const cosang = (fS && mag(fF) > 0) ?
      (fF[0]*fS[0]+fF[1]*fS[1]+fF[2]*fS[2])/(mag(fF)*mag(fS)) : NaN;
  // kernel-only force, so a remaining mismatch can be attributed to kernels vs electrons
  function Vk(x,y,z){ let v=0;
    for (let a=0;a<at.length;a++){ if(a===PROBE_IDX) continue;
      const Za=(zn[a]!==undefined?zn[a]:at[a].Z)||0; if(!Za) continue;
      const dx=(x-np[a][0])*hh, dy=(y-np[a][1])*hh, dz=(z-np[a][2])*hh;
      const rcA=(rcList&&rcList[a]>0)?rcList[a]:(2*hh);
      v+=Za/Math.max(Math.sqrt(dx*dx+dy*dy+dz*dz),rcA); } return v; }
  const dd=0.5;
  const fK=[-(Vk(p0[0]+dd,p0[1],p0[2])-Vk(p0[0]-dd,p0[1],p0[2]))/(2*dd*hh),
            -(Vk(p0[0],p0[1]+dd,p0[2])-Vk(p0[0],p0[1]-dd,p0[2]))/(2*dd*hh),
            -(Vk(p0[0],p0[1],p0[2]+dd)-Vk(p0[0],p0[1],p0[2]-dd))/(2*dd*hh)];
  // TRAJECTORY. Release the proton from rest at its placement and integrate velocity-Verlet in
  // the frozen field. Positions are carried in a.u.; Vp/force take GRID coordinates, so convert
  // on every call. KE + V must be CONSERVED -- that is the integrator's own check. A drift means
  // dt is too large or the trilinear sample too coarse, not that the proton did something.
  // The field does not polarise as the proton moves (see the header): wells come out too shallow
  // and barriers too high, so this says WHERE the proton goes, not how much energy it takes.
  function trajectory(startG, opts) {
    const o = opts || {};
    const M = 1836.15;                       // proton mass, a.u.
    const dt = o.dt || 2.0;                  // a.u. of time
    const NSTEP = o.steps || 20000;
    const REC = o.rec || 250;
    const gr = q => [q[0]/hh, q[1]/hh, q[2]/hh];   // a.u. -> grid
    let r = [startG[0]*hh, startG[1]*hh, startG[2]*hh];
    let v = [0, 0, 0];
    let F = force(...gr(r));
    const V0 = Vp(...gr(r));
    const E0 = V0;                           // released from rest, so KE = 0
    const path = [];
    let stop = 'maxsteps', nstep = 0, Edrift = 0;
    // closest approach to every OTHER kernel, so "where it went" is answered by name
    const closest = at.map(() => Infinity);
    for (let s = 0; s < NSTEP; s++) {
      for (let d = 0; d < 3; d++) {
        v[d] += 0.5 * dt * F[d] / M;
        r[d] += dt * v[d];
      }
      const g = gr(r);
      // leaving the grid, or captured inside a kernel's clamp, ends the run
      if (g[0] < 2 || g[1] < 2 || g[2] < 2 || g[0] > S-3 || g[1] > S-3 || g[2] > S-3) {
        stop = 'left box'; nstep = s; break;
      }
      const Fn = force(...g);
      for (let d = 0; d < 3; d++) v[d] += 0.5 * dt * Fn[d] / M;
      F = Fn;
      let captured = -1;
      for (let a = 0; a < at.length; a++) {
        if (a === PROBE_IDX) continue;
        const Za = (zn[a] !== undefined ? zn[a] : at[a].Z) || 0; if (!Za) continue;
        const dx = (g[0]-np[a][0])*hh, dy = (g[1]-np[a][1])*hh, dz = (g[2]-np[a][2])*hh;
        const dist = Math.sqrt(dx*dx+dy*dy+dz*dz);
        if (dist < closest[a]) closest[a] = dist;
        const rcA = (rcList && rcList[a] > 0) ? rcList[a] : (2*hh);
        if (dist < rcA) captured = a;
      }
      const KE = 0.5*M*(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
      const Vv = Vp(...g);
      Edrift = Math.max(Edrift, Math.abs(KE + Vv - E0));
      if (s % REC === 0) path.push({ t: Number((s*dt).toPrecision(4)),
        r: g.map(q => Number(q.toPrecision(5))),
        dA: Number((Math.sqrt(((g[0]-startG[0])*hh)**2 + ((g[1]-startG[1])*hh)**2 +
                              ((g[2]-startG[2])*hh)**2) * 0.529177).toPrecision(4)),
        KE: Number(KE.toPrecision(4)), V: Number(Vv.toPrecision(6)) });
      nstep = s;
      if (captured >= 0) { stop = 'captured by atom ' + captured +
        (at[captured].el ? ' (' + at[captured].el + ')' : ''); break; }
    }
    const gF = gr(r);
    // report only the kernels it actually came near, in Angstrom, nearest first
    const near = closest.map((d, a) => ({ a: a, el: at[a] && at[a].el, dA: Number((d*0.529177).toPrecision(4)) }))
      .filter(x => isFinite(x.dA) && x.dA < 4.0).sort((p, q) => p.dA - q.dA).slice(0, 6);
    return { stop: stop, steps: nstep, dt: dt, tTotal: Number((nstep*dt).toPrecision(5)),
             V0: Number(V0.toPrecision(6)),
             Edrift: Number(Edrift.toPrecision(3)),
             displacementA: Number((Math.sqrt(((gF[0]-startG[0])*hh)**2 + ((gF[1]-startG[1])*hh)**2 +
                                              ((gF[2]-startG[2])*hh)**2) * 0.529177).toPrecision(4)),
             nearest: near, path: path.slice(0, 40) };
  }
  // MONOPOLE TEST, on the SITE -- the check that should have come before any trajectory.
  // The angular average of V at radius r equals Q_enclosed/r, so <V>*r must equal the site's net
  // charge (0 if neutral, probe excluded since Vp excludes it). This is the same exact test that
  // validated the water field to ~1%; it was never applied to the system it was needed for.
  // V0 = -8.15 Ha for a proton 2 A from a carbon, against -0.045 Ha at the analogous distance in
  // water, says the site field is wrong by orders of magnitude. This measures by how much.
  function monopole() {
    const ga = Math.PI * (3 - Math.sqrt(5));
    const out = [];
    for (const rAu of [8, 10, 12, 14]) {
      let sum = 0, cnt = 0;
      for (let t = 0; t < 400; t++) {
        const yy = 1 - 2*(t+0.5)/400, rr = Math.sqrt(Math.max(0, 1-yy*yy)), th = ga*t;
        const g = [gN2 + rr*Math.cos(th)*rAu/hh, gN2 + yy*rAu/hh, gN2 + rr*Math.sin(th)*rAu/hh];
        if (g[0]<1||g[1]<1||g[2]<1||g[0]>S-2||g[1]>S-2||g[2]>S-2) continue;
        sum += Vp(g[0], g[1], g[2]); cnt++;
      }
      const av = cnt ? sum/cnt : NaN;
      out.push({ r: rAu, n: cnt, Vavg: Number(av.toPrecision(4)), Qenc: Number((av*rAu).toPrecision(4)) });
    }
    // what the site's net charge SHOULD be: kernels minus electrons, probe excluded
    let zn_sum = 0, el_sum = 0;
    for (let a = 0; a < at.length; a++) {
      if (a === PROBE_IDX) continue;
      zn_sum += (zn[a] !== undefined ? zn[a] : at[a].Z) || 0;
      el_sum += at[a].Z || 0;
    }
    return { spheres: out, sumZnuc: zn_sum, sumElec: el_sum, expectedQ: zn_sum - el_sum };
  }
  let mono = null;
  try { mono = monopole(); } catch(e) { mono = { err: String(e).slice(0, 120) }; }

  // dt LADDER. Edrift stayed at 4.16 Ha after the force was made an exact gradient, so the drift
  // is not the differencing -- the proton dives to 0.14 A of a Z=4 kernel, where F ~ 55 a.u. and a
  // dt of 2.0 kicks the velocity by 0.06 in one step. Velocity-Verlet error falls as dt^2, so if
  // the timestep is the cause, halving dt must quarter the drift. If Edrift instead sits flat
  // across the ladder, the timestep is exonerated and the field itself is the suspect.
  // The solver run costs ~9 min and a trajectory costs seconds, so the whole ladder is free here.
  let traj = null, ladder = [];
  try {
    const DTS = [2.0, 1.0, 0.5, 0.25, 0.125];
    for (const dtv of DTS) {
      const r = trajectory(p0, { dt: dtv, steps: Math.round(TRAJ_STEPS * (TRAJ_DT / dtv)) });
      ladder.push({ dt: dtv, Edrift: r.Edrift, stop: r.stop, tTotal: r.tTotal,
                    disp: r.displacementA, near0: (r.nearest && r.nearest[0]) || null });
      if (dtv === TRAJ_DT) traj = r;
    }
    if (!traj) traj = trajectory(p0, { dt: TRAJ_DT, steps: TRAJ_STEPS });
  } catch(e) { traj = { err: String(e).slice(0, 120) }; }
  traj.dtLadder = ladder;

  return { traj: traj, Psrc: PSRC, monopole: mono,
           // identical fieldK and fieldF means the electron term contributed NOTHING -- the
           // signature of reading an unfilled buffer. Checked, not assumed.
           elecTermDead: (fK[0] === fF[0] && fK[1] === fF[1] && fK[2] === fF[2]),
           fieldK: fK.map(v => Number(v.toPrecision(4))),
           solverNuc: (window._nucForceNuc||[])[PROBE_IDX] ? window._nucForceNuc[PROBE_IDX].map(v=>Number(v.toPrecision(4))) : null,
           fieldF: fF.map(v => Number(v.toPrecision(4))),
           solverF: fS ? fS.map(v => Number(v.toPrecision(4))) : null,
           magField: Number(mag(fF).toPrecision(4)),
           magSolver: Number(mag(fS).toPrecision(4)),
           cos: Number(cosang.toPrecision(4)) };
}
window.frozenFieldProbe = frozenFieldProbe;

window.onSweepDone = async function(E){
  // Capture the Euler-Lagrange residual, not just the energy. Without it there is no way to tell
  // a converged run from one stopped at an arbitrary point on its trajectory -- which is exactly
  // how model A came out at -4.7 Ha at one geometry and -20.1 Ha at another.
  var res = null;
  try { res = await window.readELResidual(); } catch (e) { console.warn('residual unavailable', e); }
  var ffp = null;
  if (PROBE_IDX >= 0 && !RELAX) { try { ffp = await frozenFieldProbe(); } catch(e) { ffp = {err:String(e).slice(0,120)}; } }
  var fE = window._nucForceElec || [];
  var rec = { model: MODEL, R: R, steps: STEPS, E: E,
              rMax: res ? Number(res.rMax.toPrecision(4)) : null,
              intFrac: res ? Number(res.interiorFrac.toFixed(3)) : null,
              fCa:  fE[SITE_IDX.CA]  ? fE[SITE_IDX.CA].slice()  : null,
              fC4p: fE[SITE_IDX.C4P] ? fE[SITE_IDX.C4P].slice() : null,
              aspd: ASPD || null,
              probe: PROBE || null, dp: PROBE ? DP : null,
              // fElec ALONE is not what moves a nucleus. The total is electronic + nuclear-nuclear,
              // and a bare proton 2 A from Ca's kernel is pushed away hard by every kernel nearby.
              // Recording only the electronic part made a proton sitting at a force BALANCE
              // indistinguishable from one that could not move at all.
              fProbe:    (PROBE_IDX >= 0 && fE[PROBE_IDX]) ? fE[PROBE_IDX].slice() : null,
              fProbeInt: (PROBE_IDX >= 0 && (window._nucForce||[])[PROBE_IDX]) ? window._nucForce[PROBE_IDX].slice() : null,
              // nucForceTotal is the DISPLAY copy; molecule.js:4839 says nucForce is what the
              // integrator uses. Record whichever is exposed, and note which.
              fProbeTot: (PROBE_IDX >= 0 && (window._nucForceTotal||[])[PROBE_IDX]) ? window._nucForceTotal[PROBE_IDX].slice() : null,
              fProbeNuc: (PROBE_IDX >= 0 && (window._nucForceNuc||[])[PROBE_IDX]) ? window._nucForceNuc[PROBE_IDX].slice() : null,
              relaxed: RELAX, frozenField: ffp,
              // where the proton ENDED UP (grid coords), and how far it travelled from where it started
              probeEnd: (RELAX && window._nucPos && window._nucPos[PROBE_IDX]) ? window._nucPos[PROBE_IDX].slice() : null,
              // where it ended up relative to BOTH carbons -- the branch answering itself
              endToCa:  (RELAX && window._nucPos) ? Number((Math.sqrt(
                  Math.pow(window._nucPos[PROBE_IDX][0]-atoms[SITE_IDX.CA].i,2) +
                  Math.pow(window._nucPos[PROBE_IDX][1]-atoms[SITE_IDX.CA].j,2) +
                  Math.pow(window._nucPos[PROBE_IDX][2]-atoms[SITE_IDX.CA].k,2))*h/A2AU).toFixed(3)) : null,
              endToC4p: (RELAX && window._nucPos) ? Number((Math.sqrt(
                  Math.pow(window._nucPos[PROBE_IDX][0]-atoms[SITE_IDX.C4P].i,2) +
                  Math.pow(window._nucPos[PROBE_IDX][1]-atoms[SITE_IDX.C4P].j,2) +
                  Math.pow(window._nucPos[PROBE_IDX][2]-atoms[SITE_IDX.C4P].k,2))*h/A2AU).toFixed(3)) : null,
              travelled: (RELAX && window._nucPos) ? Number((Math.sqrt(
                  Math.pow(window._nucPos[PROBE_IDX][0]-atoms[PROBE_IDX].i,2) +
                  Math.pow(window._nucPos[PROBE_IDX][1]-atoms[PROBE_IDX].j,2) +
                  Math.pow(window._nucPos[PROBE_IDX][2]-atoms[PROBE_IDX].k,2))*h/A2AU).toFixed(4)) : null,
              probeStart: (PROBE_IDX >= 0) ? [atoms[PROBE_IDX].i, atoms[PROBE_IDX].j, atoms[PROBE_IDX].k] : null,
              hA: h/A2AU,                 // Angstrom per cell, to convert the displacement
              dip:  [window._dip_x, window._dip_y, window._dip_z],
              nAtoms: coords.length };
  rec.iso = /[?&]iso=67/.test(q) ? 67 : 65;
  // KEY CARRIES EVERY VARIED PARAMETER. A single fixed key meant each run overwrote the last,
  // so a failed or stale run was indistinguishable from a fresh result -- the same trap that cost
  // hours on nh3_pa.html. With the parameters in the key a mismatch fails loudly (timeout)
  // instead of silently returning someone else's number.
  var _K = 'gad65_site_' + MODEL + '_' + (PROBE||'none') + '_dp' + DP + '_R' + R
         + '_n' + STEPS + (RELAX?'_rx':'') + (ASPD?('_asp'+ASPD):'');
  try { localStorage.setItem(_K, JSON.stringify(rec)); } catch(e){}
  try { localStorage.setItem('gad65_site_result', JSON.stringify(rec)); } catch(e){}  // legacy
  document.title = 'GAD65 DONE ' + (PROBE||'') + ' ' + _K;
  console.log('=== SITE RESULT ===', JSON.stringify(rec));
  document.getElementById('log').textContent += '\nDONE  E=' + E.toFixed(6) + ' Ha';
};

// molecule.js defines setup() and draw(); p5 is what CALLS them. Without p5 the page loads,
// prints "relaxing..." and does nothing at all, at 0% CPU, forever -- which is exactly how the
// first three attempts at this page failed. Load p5 AFTER molecule.js, as the working scans do.
var s = document.createElement('script');
s.src = 'molecule.js?t=' + Date.now();
s.onload = function(){
  var p = document.createElement('script');
  p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
  p.onerror = function(){
    var el=document.getElementById('log'); if(el) el.textContent += '\nERROR: p5 failed to load (offline?)';
  };
  document.body.appendChild(p);
};
s.onerror = function(){
  var el=document.getElementById('log'); if(el) el.textContent += '\nERROR: molecule.js failed to load';
};
document.body.appendChild(s);
</script>
