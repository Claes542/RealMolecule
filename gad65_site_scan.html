<!DOCTYPE html>
<html><body style="margin:0;background:#000;color:#ddd;font-family:monospace">
<pre id="log">GAD65 crystal-derived active site — building…</pre>
<script src="gad65_site_atoms.js"></script>
<script>
// surface failures instead of sitting at "relaxing..." forever
window.onerror = function(m,u,l){
  var el=document.getElementById('log'); if(el) el.textContent += '\nERROR: '+m+' (line '+l+')';
};
window.addEventListener('unhandledrejection', function(e){
  var el=document.getElementById('log'); if(el) el.textContent += '\nGPU REJECTED: '+(e.reason&&e.reason.message||e.reason);
});
// ===========================================================================
//  GAD65 ACTIVE SITE FROM THE CRYSTAL STRUCTURE (PDB 2OKK, Fenalti et al.)
//
//  The gas-phase scan (gad65_decarb_scan.html) contains no enzyme at all: it
//  measures the COFACTOR's effect and cannot distinguish GAD65 from any other
//  PLP decarboxylase. This page adds the enzyme, one residue at a time.
//
//    model=A   PLP core + substrate, on crystal geometry     (no enzyme)
//    model=B   the same + Asp364                             (enzyme)
//
//  Asp364's carboxylate sits 2.46 A from the pyridine N1 in the crystal — it
//  is what holds the ring nitrogen protonated, and therefore what keeps the
//  sink electron-poor. B minus A is that residue's contribution, with ring,
//  imine, substrate and Dunathan alignment held identical.
//
//  GEOMETRY. Ring, O3, C2', C4' and the imine N are crystal coordinates. The
//  substrate is grafted at the positions the lysine vacates on forming the
//  external aldimine: imine N at the crystal NZ, Ca at the crystal CE. The
//  breaking Ca-COO bond is placed along the MEASURED ring normal, so the
//  Dunathan alignment comes out of the structure rather than being imposed
//  (checked: 0.0 deg). Hydrogens are added — X-ray sees none.
//
//  CHARGE. Both models are neutral: pyridinium(+) balances the substrate
//  carboxylate(-). Asp364 is therefore built as the NEUTRAL acid with its
//  proton on OD1, pointing away from N1, so OD2 stays the acceptor. In the
//  enzyme it is very likely ionised; that is an approximation, stated.
//
//  NOT INCLUDED: 5'-phosphate, Lys396 (displaced), the rest of the protein,
//  water. Nuclei clamped; only the electrons relax.
// ===========================================================================
var q = location.search;
var MODEL = (q.match(/[?&]model=([AB])/) || [])[1] || 'A';
var R     = parseFloat((q.match(/[?&]R=([\d.]+)/) || [])[1] || '1.53');   // Ca-CO2 distance, A
var STEPS = parseInt((q.match(/[?&]steps=(\d+)/) || [])[1] || '2000', 10);
// PROTON PROBE. The branch is decided by where a proton lands -- Ca regenerates the enzyme,
// C4' destroys its cofactor -- so the quantity that matters is the force on the INCOMING PROTON,
// not on the carbon nuclei (a nucleus in a symmetric cloud feels no force however much charge
// surrounds it). A bare nucleus, Z=0 with Z_nuc=1, IS a proton: HAS_BARE_NUCLEI supports it.
// Both probe positions give the same atoms, same charge, same grid -- only the probe moves --
// so this is a difference within ONE system, the construction where errors cancel.
//   probe=ca   : on the face Ca presents after CO2 leaves (+up; its H is on -up)
//   probe=c4p  : on the face C4' presents opposite its own H (-up)
var PROBE = (q.match(/[?&]probe=(ca|c4p)/) || [])[1] || '';
// relax=1 : let the proton find its OWN place instead of being clamped where I put it.
// A clamped probe reports a point on the approach curve; the quantity that ranks basic sites is
// the BOUND state. The off-axis force (38-59% of the total) is the calculation saying the proton
// would rather be somewhere else. So: dynamics on, every nucleus frozen except the probe.
var RELAX = /[?&]relax=1/.test(q);
var DP    = parseFloat((q.match(/[?&]dp=([\d.]+)/) || [])[1] || '2.0');   // probe stand-off, A
var A2AU  = 1.8897;

function buildAtoms(model, R) {
  var c = SITE_FIXED_A.map(function(a){ return a.slice(); });
  // carboxylate: C along the Dunathan axis at distance R, then two O at 124 deg
  var cx = SITE_UP[0]*R, cy = SITE_UP[1]*R, cz = SITE_UP[2]*R;
  c.push(['C', cx, cy, cz]);
  var ca = Math.cos(62*Math.PI/180), sa = Math.sin(62*Math.PI/180);
  for (var s = 1; s >= -1; s -= 2) {
    var dx = SITE_UP[0]*ca + s*SITE_E1[0]*sa,
        dy = SITE_UP[1]*ca + s*SITE_E1[1]*sa,
        dz = SITE_UP[2]*ca + s*SITE_E1[2]*sa;
    var n = Math.sqrt(dx*dx+dy*dy+dz*dz);
    c.push(['O', cx + 1.25*dx/n, cy + 1.25*dy/n, cz + 1.25*dz/n]);
  }
  if (model === 'B') c = c.concat(SITE_ASP_B.map(function(a){ return a.slice(); }));
  return c;
}

// index of the probe in the final list, or -1
var PROBE_IDX = -1;
function addProbe(c, which, dp) {
  if (!which) return c;
  var host = (which === 'ca') ? SITE_FIXED_A[SITE_IDX.CA] : SITE_FIXED_A[SITE_IDX.C4P];
  var sgn  = (which === 'ca') ? +1 : -1;     // Ca's free face is +up, C4's is -up
  PROBE_IDX = c.length;
  c.push(['H', host[1] + SITE_UP[0]*dp*sgn,
               host[2] + SITE_UP[1]*dp*sgn,
               host[3] + SITE_UP[2]*dp*sgn]);
  return c;
}

var coords = addProbe(buildAtoms(MODEL, R), PROBE, DP);
// FIXED box, sized once for the largest R in the series -- it must NOT depend on R, or the
// mesh h = scr/gridN would change with the reaction coordinate and energies at different R
// would be computed on different grids and not be comparable. Same reason the step count is
// fixed: every point in a series must be relaxed the same way on the same mesh.
// R_MAX and gridN are set by MEMORY, not by taste. The direct per-electron path allocates two
// full-grid buffers per electron: 2 * N * gridN^3 * 4 bytes. At 192^3 with 26 electrons that is
// ~1.5 GB of storage buffers and the device silently fails to start -- the page sits at
// "relaxing..." with the GPU at 0%. The gas-phase model that works is ~0.79 GB. Keep under that.
// The box is CENTRED ON THE SITE CENTROID, not on Ca. Centring on Ca made Asp364's capped
// methyl (10.6 A away, chemically irrelevant) size the box and coarsen the mesh for everything;
// about the centroid the extent is 6.5 A. SITE_BOX is a fixed constant so that A and B -- and
// every R -- sit on exactly the same grid.
var scr = SITE_BOX;
// grid 128. NOTE: an earlier comment here claimed a measured memory ceiling (0.79 GB runs,
// 1.11 GB stalls). That was wrong -- all three "stalls" were this page failing to load p5, so
// nothing ever ran at any size. The direct path does allocate 2 full-grid buffers per domain
// (0.57 GB for model B here), so size remains worth watching, but no limit has been measured.
// h = 0.270 against the gas-phase model's 0.2375; 2h = 0.54 sets the kernel clamp.
var gridN = 128, h = scr/gridN, gN2 = Math.round(gridN/2);
var Zof = { H:1, C:4, N:3, O:2 }, RCof = { H:0, C:0.3, N:0.3, O:0.8 };
var atoms = [], zList = [], rcList = [], zNucList = [];
for (var n = 0; n < coords.length; n++) {
  var el = coords[n][0];
  var isProbe = (n === PROBE_IDX);
  atoms.push({ i: Math.round(gN2 + (coords[n][1]-SITE_CENTRE[0])*A2AU/h),
               j: Math.round(gN2 + (coords[n][2]-SITE_CENTRE[1])*A2AU/h),
               k: Math.round(gN2 + (coords[n][3]-SITE_CENTRE[2])*A2AU/h),
               Z: isProbe ? 0 : Zof[el], el: el });
  zList.push(isProbe ? 0 : Zof[el]);          // no electron of its own
  zNucList.push(isProbe ? 1 : Zof[el]);       // but a unit positive kernel -> a bare proton
  rcList.push(isProbe ? 0 : RCof[el]);
}
document.getElementById('log').textContent =
  'GAD65 site from 2OKK — model ' + MODEL + '  R=' + R.toFixed(2) + ' A  steps=' + STEPS +
  '\n' + coords.length + ' atoms, ' + zList.reduce(function(a,b){return a+b;},0) + ' electrons, grid ' +
  gridN + '^3, box ' + scr.toFixed(1) + ' a.u.\nrelaxing…';

window.USER_NN = gridN;
window.USER_ATOMS = atoms;
window.USER_SCREEN = scr;
window.USER_Z = zList;
window.USER_Z_NUC = zNucList;
window.USER_RC = rcList;
// CONVERGE FIRST, THEN RELEASE -- the protocol proton_transfer.html uses ("converge first,
// press D"), and molecule.js implements it: at 5693 it auto-enables dynamics after 10000 clamped
// steps, provided CONVERGENCE_THRESHOLD is falsy and NO_AUTO_DYNAMICS is unset. Starting dynamics
// at step 0 pushes the nuclei with forces from a half-solved density (rMax was ~2 at 2000 steps).
window.USER_DYNAMICS = false;             // always start clamped
if (RELAX) {
  if (PROBE_IDX < 0) { throw new Error('relax=1 requires probe=ca or probe=c4p'); }
  var frozen = [];
  for (var fi = 0; fi < coords.length; fi++) if (fi !== PROBE_IDX) frozen.push(fi);
  window.USER_FROZEN_ATOMS = frozen;     // when dynamics does switch on, only the proton moves
  window.USER_N_MOVE = 20;
  window.USER_DAMPING = 0.85;            // settle rather than ring; we want the minimum
  window.USER_NUC_MASS = 1836;           // a proton, not the default
  // moveNuclei() zeroes the force on any atom with Z === 0, ignoring Z_nuc -- so a bare proton
  // never moves under dynamics (measured: force identically [0,0,0] through 100 nuclear steps,
  // displacement 2e-5 A). The force-readback path at molecule.js:4255 uses the correct test,
  // (Z > 0 || Z_nuc > 0); the two disagreed. Opt in rather than change it globally: bare nuclei
  // are also used as fixed KERNELS elsewhere (the conduction cable's ions), where being immovable
  // may be relied upon.
  window.USER_BARE_NUCLEI_MOVE = true;
  delete window.NO_AUTO_DYNAMICS;        // let the built-in two-stage protocol run
} else {
  window.NO_AUTO_DYNAMICS = true;        // pure fixed-step runs stay clamped throughout
}
window.USER_DIRECT_POTHER = true;         // exact i != j every step (see gad65_decarb_scan.html)
// In relax mode the run must NOT stop at STEPS: the auto-release at molecule.js:5693 needs 10000
// clamped steps first, so any STEPS below that ends the run before the nuclei are freed --
// probeStart == probeEnd, which is exactly what the first attempt returned. Follow the
// interactive proton pages: run effectively forever and let the poller close it, counting
// NUCLEAR moves, which only accumulate once dynamics is actually on.
window.USER_STEPS = RELAX ? 1000000 : STEPS;                // fixed-step protocol — no energy-plateau test
window.CONVERGENCE_THRESHOLD = 0;         // must stay falsy or the auto-release at 5693 is skipped
window.USER_BOND_PAIRS = [[SITE_IDX.CA, SITE_FIXED_A.length, 'Ca-CO2:']];
// Ring and label the atoms the chemistry turns on. The probe NEEDS a marker: molecule.js colours
// by electron count, and a bare nucleus (Z=0 -> [255,80,80]) is the same red as oxygen
// (Z=2 -> [255,50,50]). Only the dot size differs (5 vs 10), which is not enough to find it among
// three or five oxygens.
window.USER_MARK_ATOMS = [
  { i: SITE_IDX.CA,  label: 'C\u03B1',  col: [255,220,0] },
  { i: SITE_IDX.C4P, label: "C4'", col: [90,200,255] }
];
if (PROBE_IDX >= 0) {
  window.USER_MARK_ATOMS.push({
    i: PROBE_IDX,
    label: 'H\u207A probe  (' + PROBE + ', ' + DP.toFixed(1) + ' \u00C5)',
    col: [255,0,255]                       // magenta: used by nothing else in the palette
  });
}

// molecule.js only calls onSweepDone when dynamics is OFF -- BOTH call sites are gated on
// !dynamicsEnabled (5699, 5722). So a relax run computes happily and never reports. With the
// nuclei moving we have to close the run ourselves: poll the nuclear step counter and fire the
// same record once it reaches the target. window._E and window._nucStepCount are exposed.
if (RELAX) {
  var targetNucSteps = Math.floor(STEPS / 20);
  document.getElementById('log').textContent += '\nrelax: 10000 clamped steps, then ' + targetNucSteps + ' nuclear moves';        // nuclear moves AFTER the 10000-step clamped stage
  var fired = false;
  setInterval(function(){
    if (fired) return;
    if ((window._nucStepCount || 0) >= targetNucSteps && window._E !== undefined) {
      fired = true; window.onSweepDone(window._E);
    }
  }, 2000);
}

window.onSweepDone = async function(E){
  // Capture the Euler-Lagrange residual, not just the energy. Without it there is no way to tell
  // a converged run from one stopped at an arbitrary point on its trajectory -- which is exactly
  // how model A came out at -4.7 Ha at one geometry and -20.1 Ha at another.
  var res = null;
  try { res = await window.readELResidual(); } catch (e) { console.warn('residual unavailable', e); }
  var fE = window._nucForceElec || [];
  var rec = { model: MODEL, R: R, steps: STEPS, E: E,
              rMax: res ? Number(res.rMax.toPrecision(4)) : null,
              intFrac: res ? Number(res.interiorFrac.toFixed(3)) : null,
              fCa:  fE[SITE_IDX.CA]  ? fE[SITE_IDX.CA].slice()  : null,
              fC4p: fE[SITE_IDX.C4P] ? fE[SITE_IDX.C4P].slice() : null,
              probe: PROBE || null, dp: PROBE ? DP : null,
              // fElec ALONE is not what moves a nucleus. The total is electronic + nuclear-nuclear,
              // and a bare proton 2 A from Ca's kernel is pushed away hard by every kernel nearby.
              // Recording only the electronic part made a proton sitting at a force BALANCE
              // indistinguishable from one that could not move at all.
              fProbe:    (PROBE_IDX >= 0 && fE[PROBE_IDX]) ? fE[PROBE_IDX].slice() : null,
              fProbeTot: (PROBE_IDX >= 0 && (window._nucForceTotal||[])[PROBE_IDX]) ? window._nucForceTotal[PROBE_IDX].slice() : null,
              fProbeNuc: (PROBE_IDX >= 0 && (window._nucForceNuc||[])[PROBE_IDX]) ? window._nucForceNuc[PROBE_IDX].slice() : null,
              relaxed: RELAX,
              // where the proton ENDED UP (grid coords), and how far it travelled from where it started
              probeEnd: (RELAX && window._nucPos && window._nucPos[PROBE_IDX]) ? window._nucPos[PROBE_IDX].slice() : null,
              probeStart: (PROBE_IDX >= 0) ? [atoms[PROBE_IDX].i, atoms[PROBE_IDX].j, atoms[PROBE_IDX].k] : null,
              hA: h/A2AU,                 // Angstrom per cell, to convert the displacement
              dip:  [window._dip_x, window._dip_y, window._dip_z],
              nAtoms: coords.length };
  try { localStorage.setItem('gad65_site_result', JSON.stringify(rec)); } catch(e){}
  console.log('=== SITE RESULT ===', JSON.stringify(rec));
  document.getElementById('log').textContent += '\nDONE  E=' + E.toFixed(6) + ' Ha';
};

// molecule.js defines setup() and draw(); p5 is what CALLS them. Without p5 the page loads,
// prints "relaxing..." and does nothing at all, at 0% CPU, forever -- which is exactly how the
// first three attempts at this page failed. Load p5 AFTER molecule.js, as the working scans do.
var s = document.createElement('script');
s.src = 'molecule.js?t=' + Date.now();
s.onload = function(){
  var p = document.createElement('script');
  p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
  p.onerror = function(){
    var el=document.getElementById('log'); if(el) el.textContent += '\nERROR: p5 failed to load (offline?)';
  };
  document.body.appendChild(p);
};
s.onerror = function(){
  var el=document.getElementById('log'); if(el) el.textContent += '\nERROR: molecule.js failed to load';
};
document.body.appendChild(s);
</script>
</body></html>
