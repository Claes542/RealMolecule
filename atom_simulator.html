function genConfigCap(m, cap) {
  if (m <= 2) return [m];
  let cfg = [2], rem = m - 2;
  while (rem > 0) { let t = Math.min(cap, rem); cfg.push(t); rem -= t; }
  return cfg;
}
function genConfig(m) { return genConfigCap(m, 4); }   // default 4-cap

// Balanced cap-4: distribute each period's electrons EVENLY across its cap-4 shells
// (round-robin), reproducing 2+2+2, 2+3+2, 2+4+3, ... instead of greedy 2+4, 2+4+1.
function genConfigBalanced(m) {
  // s/p-block period structure (shell caps per period); d/f beyond P3 are placeholders
  const periods = [[2], [4, 4], [4, 4], [4, 4, 4, 4, 2], [4, 4, 4, 4, 2],
                   [4, 4, 4, 4, 4, 4, 4, 4], [4, 4, 4, 4, 4, 4, 4, 4]];
  let cfg = [], rem = m;
  for (const caps of periods) {
    if (rem <= 0) break;
    const pcap = caps.reduce((a, b) => a + b, 0);
    let take = Math.min(rem, pcap);
    let sh = new Array(caps.length).fill(0);
    for (let e = 0; e < take; e++) {
      let idx = -1, mn = Infinity;
      for (let s = 0; s < caps.length; s++)
        if (sh[s] < caps[s] && sh[s] < mn) { mn = sh[s]; idx = s; }
      if (idx < 0) break;
      sh[idx]++;
    }
    for (let s = 0; s < caps.length; s++) if (sh[s] > 0) cfg.push(sh[s]);
    rem -= take;
  }
  return cfg;
}

// Set globals from an explicit (nuclear charge, electrons-per-shell) without touching the UI.
function applyConfig(Znuc, arr) {
  Z = Znuc;
  for (let s = 0; s < MAXSHELLS; s++) Es[s] = (s < arr.length) ? arr[s] : 0;
  NSHELLS = Math.max(1, Math.min(arr.length, MAXSHELLS));
  for (let s = 0; s < MAXSHELLS; s++) Ered[s] = Es[s] > 1 ? (Es[s] - 1) / Es[s] : 0;
}

// Solve one atom/ion to convergence using the SAME numerics as interactive mode.
// opts.chkEvery / opts.tol override the convergence test, and `iters` is returned.
// WHY THIS IS NEEDED. The default test -- |dE| < 1e-4 over 20 STEPS -- is not scale
// invariant. Since dt = h^2/2, twenty steps on a grid twice as fine cover a quarter of the
// imaginary time, so dE across the window is ~4x smaller and the test passes ~4x earlier in
// the relaxation. On a mesh ladder that breaks the finer runs first and returns a LESS
// converged answer at higher N, which looks exactly like a solver that fails to converge.
// A ladder must therefore pass chkEvery proportional to (N/N_ref)^2 -- the same imaginary
// time window at every rung -- and check the realised `iters` against maxSteps.
function solveAtomPure(Znuc, arr, maxSteps, opts) {
  applyConfig(Znuc, arr);
  initArrays();
  let prev = NaN, stable = 0, iters = 0;
  const ms = maxSteps || 4000;
  // NB: tested against undefined, not falsy -- tol:0 is the meaningful "never break" value
  // and `(opts.tol) || 1e-4` would silently restore the default.
  const chk = (opts && opts.chkEvery !== undefined) ? opts.chkEvery : 20;
  const tol = (opts && opts.tol !== undefined) ? opts.tol : 1e-4;
  for (let it = 0; it < ms; it++) {
    macroStep();
    iters = it + 1;
    if (it % chk === chk - 1) {
      let et = 0; for (let s = 0; s < NSHELLS; s++) et += energy[s];
      if (!isNaN(prev) && Math.abs(et - prev) < tol) { stable++; if (stable >= 3) break; }
      else stable = 0;
      prev = et;
    }
  }
  let etot = 0; for (let s = 0; s < NSHELLS; s++) etot += energy[s];
  const val = NSHELLS - 1;
  let nCore = 0; for (let s = 0; s < val; s++) nCore += Es[s];
  const epsVal = Es[val] > 0 ? eps[val] / Es[val] : 0;        // orbital eigenvalue (2P) per electron
  const enVal  = Es[val] > 0 ? energy[val] / Es[val] : 0;     // shell energy contribution (P) per electron
  return { etot: etot, iters: iters, epsVal: epsVal, IE_eV: -epsVal * 27.2114,
           IE_energy_eV: -enVal * 27.2114,
           Zker: Znuc - nCore, rc: M[val] * h,
           ne: arr.reduce((a, b) => a + b, 0), cfg: arr.join('+') };
}

// One-click periodic-table sweep: for each Z, solve neutral + cation, write two CSVs.
async function runSweep() {
  if (batchRunning) return;
  batchRunning = true; running = false;
  const Zmax = sliderZ.value();
  let rows = ['Z,ref_E_Ha,cfg_greedy4,E_greedy4,err_greedy4_%,cfg_bal4,E_bal4,err_bal4_%,E_cap8,err_cap8_%,better4,IE_eig_eV,IE_energy_eV,NIST_IE_eV,eig_err_%,energy_err_%'];
  for (let Zz = 2; Zz <= Zmax; Zz++) {
    try {
      sweepStatus = 'Z=' + Zz + '/' + Zmax;
      await new Promise(r => setTimeout(r, 0));
      const ref = REF_ETOT[Zz];
      const errf = (e) => (ref != null && isFinite(e)) ? ((e - ref) / ref * 100) : NaN;
      let g = solveAtomPure(Zz, genConfigCap(Zz, 4));
      let b = solveAtomPure(Zz, genConfigBalanced(Zz));
      let c8cfg = genConfigCap(Zz, 8);
      let c8 = (c8cfg.length <= MAXSHELLS) ? solveAtomPure(Zz, c8cfg) : { etot: NaN };
      let eg = errf(g.etot), eb = errf(b.etot), e8 = errf(c8.etot);
      let better = (!isNaN(eg) && !isNaN(eb)) ? (Math.abs(eb) < Math.abs(eg) ? 'balanced' : 'greedy') : '';
      let row = [Zz, (ref != null ? ref.toFixed(4) : ''),
                 g.cfg, (isFinite(g.etot) ? g.etot.toFixed(4) : 'NONFIN'), (isNaN(eg) ? '' : eg.toFixed(2)),
                 b.cfg, (isFinite(b.etot) ? b.etot.toFixed(4) : 'NONFIN'), (isNaN(eb) ? '' : eb.toFixed(2)),
                 (isFinite(c8.etot) ? c8.etot.toFixed(4) : ''), (isNaN(e8) ? '' : e8.toFixed(2)),
                 better];
      let nistIE = NIST_IE1[Zz];
      let eigErr = (nistIE && isFinite(b.IE_eV)) ? ((b.IE_eV - nistIE) / nistIE * 100) : NaN;
      let enErr = (nistIE && isFinite(b.IE_energy_eV)) ? ((b.IE_energy_eV - nistIE) / nistIE * 100) : NaN;
      row.push(isFinite(b.IE_eV) ? b.IE_eV.toFixed(2) : '',
               isFinite(b.IE_energy_eV) ? b.IE_energy_eV.toFixed(2) : '',
               nistIE ? nistIE.toFixed(3) : '',
               isNaN(eigErr) ? '' : eigErr.toFixed(1),
               isNaN(enErr) ? '' : enErr.toFixed(1));
      rows.push(row.join(','));
      console.log('PT ' + row.join(','));
    } catch (e) {
      console.warn('packing sweep: Z=' + Zz + ' FAILED — ' + (e && e.message ? e.message : e));
      rows.push([Zz, 'ERROR'].join(','));
    }
  }
  saveStrings(rows, 'realqm_atoms_packing.csv');
  sweepStatus = 'done — packing CSV downloaded (' + (Zmax - 1) + ' elements)';
  batchRunning = false;
}

// Print one CSV row of the converged atom to the browser console.
// Columns: Z, config, E_total(Ha), eps_valence(Ha/electron), IE(eV), Z_kernel, r_c(au)
// IE = -eps_valence (Koopmans). VERIFY on He (~24.6 eV) and Li (~5.4 eV) before trusting the sweep.
function logRow() {
  let etot = 0;
  for (let s = 0; s < NSHELLS; s++) etot += energy[s];
  const val = NSHELLS - 1;                              // valence shell index
  let nCore = 0;
  for (let s = 0; s < val; s++) nCore += Es[s];
  const Zker = Z - nCore;                               // pseudo-kernel effective charge
  const rc = M[val] * h;                                // core radius = inner boundary of valence shell
  const epsVal = Es[val] > 0 ? eps[val] / Es[val] : 0;  // valence orbital eigenvalue, per electron
  const IE_eV = -epsVal * 27.2114;                      // ionization energy, Ha -> eV
  const cfg = Es.slice(0, NSHELLS).join('+');
  console.log('CSV, ' + [Z, cfg, etot.toFixed(4), epsVal.toFixed(4),
                         IE_eV.toFixed(2), Zker, rc.toFixed(3)].join(', '));
}

function readSliders() {
  Z = sliderZ.value();
  Es[0] = 2;  // shell 0 always 2
  for (let s = 0; s < 5; s++) {
    Es[s + 1] = sliders[s].value();
  }
  for (let s = 6; s < MAXSHELLS; s++) Es[s] = 0;
  // Count active shells
  NSHELLS = 1;
  for (let s = 1; s < MAXSHELLS; s++) {
    if (Es[s] > 0) NSHELLS = s + 1;
    else break;
  }
  // Compute Ered
  for (let s = 0; s < MAXSHELLS; s++) {
    Ered[s] = Es[s] > 1 ? (Es[s] - 1) / Es[s] : 0;
  }
}

function initArrays() {
  // (config in Z/Es/NSHELLS/Ered must be set by caller: readSliders() or applyConfig())

  // Look up known config
  let key = configKey();
  let ref = observed[key];
  // The kernel is the bare Z/r sampled on the grid. There WAS a per-element shift, Z/(i*h+fix*h)
  // with fix read from the stored table (0.1 for Li, Be, B), which is an adjusted constant worth
  // up to 0.69 Ha; removing it LOWERED the mean error over Z=2..18 from 1.82% to 1.64%, boron
  // alone going from -2.6% to +0.2%. It is gone. D is a domain size, not a constant in the
  // energy: every atom is solved to the same boundary condition at its edge.
  // TWO VARIANTS. Through argon the uniform mesh resolves everything that matters and the
  // minimal three updates are used unchanged. Past argon the innermost shell is too narrow for
  // it, so the second variant refines there and sub-cycles. Nothing else differs: same three
  // updates, same kernel, no parameter either side of the line.
  // TWO VARIANTS. Through argon the uniform mesh at N=400 resolves everything that matters and
  // ONE VARIANT IS LIVE: the uniform mesh, N=400 through argon and beyond, bare kernel, no
  // constant adjusted anywhere. A second variant for Z>18 was attempted five ways and none of
  // them worked -- see the note at relaxGraded. Both switches stay off until that is solved.
  GRADED = false;
  KCELL  = false;
  if (ref) { D = ref.D; }
  else { D = Z > 12 ? 12 : (Z > 5 ? 7 : 5); }
  if (PK_MODE) { D = PK_rc + 12; }            // valence sits outside the soft core
  cuspZ = PK_MODE ? 0 : Z;                     // no nuclear cusp in soft pseudo-kernel

  h = D / N;
  dt = 0.5 * h * h;

  // Shell boundaries: evenly spaced initially. In pseudo-kernel mode the valence starts at
  // r_c (Neumann inner boundary), so the core region r < r_c is excluded entirely.
  let m0 = PK_MODE ? Math.round(PK_rc / h) : 0;
  M = [m0];
  for (let s = 1; s < NSHELLS; s++) {
    M[s] = Math.round(m0 + s * (N - m0) / NSHELLS);
  }
  M[NSHELLS] = N;
  // Unused shells get boundary at N
  for (let s = NSHELLS + 1; s <= MAXSHELLS; s++) {
    M[s] = N;
  }

  // Init u and K
  for (let i = 0; i <= N; i++) {
    if (PK_MODE) u[i] = (i < m0) ? 0 : exp(-0.5 * (i * h - PK_rc));   // valence lives outside r_c only
    else u[i] = exp(-Z * i * h);
    P[i] = 0;
  }
  u[N] = 0;

  if (PK_MODE) {
    // soft pseudo-kernel: Z_ker/r outside r_c, capped to Z_ker/r_c inside
    for (let i = 0; i <= N; i++) Karr[i] = PK_Zker / Math.max(i * h, PK_rc);
  } else {
    Karr[0] = 0;
    // THE KERNEL ON A CELL, NOT AT A POINT.  Z/(i*h) is the value of the kernel AT the node,
    // but node i stands for a shell of finite width, and 1/r varies steeply across it near the
    // origin. The r^2 dr weighted mean over [r-h/2, r+h/2] is
    //        Kbar = Z * (3/2) * (r+^2 - r-^2) / (r+^3 - r-^3),
    // which tends to Z/r away from the nucleus and stays finite at the first node, where it is
    // 0.923*Z/h rather than Z/h. Nothing is fitted: it is the same kernel, integrated over the
    // cell the grid actually represents instead of sampled at its centre.
    // THE DOMINANT SOURCE OF IMPRECISION. The kernel is the bare Z/r, and near the nucleus the
    // grid does not resolve it: the innermost sampled value is Z/h, and the 1s it binds spans
    // about 8 cells at argon and 5 at zinc. What that costs has been measured. Argon's
    // two-electron core comes out 69 Ha too deep -- 22% -- against the He-like value, while the
    // neutral atom lands at 0.09%, so that agreement is cancellation rather than accuracy; the
    // total moves 10.7 Ha between N=400 and N=800, with the step count converged at both. In
    // the light atoms the same thing shows as first-order behaviour: doubling h doubled the
    // error, Li -0.6% to -2.9%, B -2.6% to -5.6%. Everything else -- the packing, the free
    // boundaries, the Coulomb sums -- is second order beside it. The unresolved 1/r singularity
    // is the largest single contribution to the errors in the table above.
    for (let i = 1; i <= N; i++) {
      if (KCELL) {
        const rm = (i - 0.5) * h, rp = (i + 0.5) * h;
        Karr[i] = Z * 1.5 * (rp * rp - rm * rm) / (rp * rp * rp - rm * rm * rm);
      } else {
        Karr[i] = Z / (i * h);      // bare kernel sampled at the node
      }
    }
  }

  computePoisson();
  step = 0;
  for (let s = 0; s < MAXSHELLS; s++) { energy[s] = 0; normu[s] = 0; eps[s] = 0; }
}

function computePoisson() {
  for (let i = 1; i <= N; i++) {
    P[i] = 0;
    // Find which shell this point belongs to
    let myShell = -1;
    for (let s = 0; s < NSHELLS; s++) {
      if (i > M[s] && i <= M[s + 1]) { myShell = s; break; }
    }
    if (myShell < 0) continue;

    // Sum contributions from all shells
    for (let s = 0; s < NSHELLS; s++) {
      let iStart = M[s] + (s === 0 ? 1 : 1);
      let iEnd = M[s + 1];
      // Self-interaction reduction within same shell, full coupling across shells
      let factor = (s === myShell) ? 0.5 * Ered[s] : 0.5;

      for (let j = iStart; j <= iEnd; j++) {
        let rj = GRADED ? rr[j] : j * h;
        let ri = GRADED ? rr[i] : i * h;
        let rho_j = u[j] * u[j] * rj * rj * (GRADED ? dw[j] : h);
        if (j < i) {
          P[i] += factor * rho_j / ri;
        } else {
          P[i] += factor * rho_j / rj;
        }
      }
    }
  }
}

function startSimulation() {
  readSliders();
  initArrays();
  running = true;
}

// ===========================================================================================
//  THE THREE LINES.  The whole method is three updates iterated to a joint steady state. They
//  are quoted here in their own code form, so the claim can be checked against the lines that
//  run rather than against a paraphrase of them. Each appears once, below, at the line given.
//
//  1. AMPLITUDE -- parabolic relaxation of the charge density (imaginary time stepping):
//
//       u[i] += 0.5*dt*(u[i+1] - 2*u[i] + u[i-1])/(h*h)     // kinetic, radial Laplacian
//             + 0.5*dt*du_dr/(h*i*h)                        //   ... its 2/r term
//             + dt*Karr[i]*u[i] - dt*2*P[i]*u[i];           // kernel pull, other-shell push
//
//  2. POTENTIAL -- the Coulomb field of the OTHER shells, by the shell theorem (computePoisson):
//
//       if (j < i) P[i] += factor * rho_j / ri;   // charge inside r acts as if at the centre
//       else       P[i] += factor * rho_j / rj;   // charge outside acts at its own radius
//
//     `factor` is 0.5 across shells and 0.5*Ered[s] within one, Ered = (N_s-1)/N_s -- smearing
//     N_s unit charges into one spherical density would count N_s^2 pairs where there are
//     N_s(N_s-1); the factor removes exactly the spurious self-pairs. Nothing is fitted.
//
//  3. FREE BOUNDARY -- move each interface toward continuity of u (the Bernoulli condition):
//
//       if (u[M[s]] > u[M[s]+1] + diff) M[s]++;   // amplitude wins inside  -> shell grows
//       if (u[M[s]] < u[M[s]+1] - diff) M[s]--;   // amplitude wins outside -> shell yields
//
//  No basis set, no library eigensolver, no fitted functional, no exchange or correlation
//  term, no statistics, no spin, no self-interaction correction. Inputs are Z and the electron
//  count. What the three reach together is a STEADY STATE, not a global minimum: none of them
//  searches configurations, so the equilibrium found is the one reachable from the state one
//  starts in. That distinction is ordinarily invisible and is the whole point in the Aufbau.
// ===========================================================================================

// ===========================================================================================
//  SECOND VARIANT: A REFINED INNER MESH, WITH SUB-CYCLING.  Used for Z > 18.
//
//  The three updates above are written on a uniform grid r_i = i*h, and that is all the first
//  eighteen elements need. Past argon the innermost shell contracts as r_1s ~ 4.32/Z and a
//  uniform mesh stops resolving it: 8 cells at argon, 5 at zinc, and the energies degrade.
//
//  The fix is local. Halve h inside the innermost shell only -- a region 0.24 a.u. wide in a
//  12 a.u. box -- and the point count rises from 400 to 408 while the 1s goes from 8 cells to
//  16. What that costs is the time step, since dt = h^2/2 is set by the finest cell wherever it
//  sits: 4x more steps for cells occupying 2% of the domain. SUB-CYCLING removes that. Take the
//  coarse step everywhere and four fine steps inside, and the cost falls to ~1.1x.
//
//  In one dimension this is an optimisation; refining globally costs only 8x and we can afford
//  it. In three dimensions it is the difference between possible and not: a refined BALL of
//  radius 0.24 adds some 4000 cells to a 400^3 grid, where a uniform 800^3 is 512M cells and
//  out of reach. That is the point the variant exists to make.
//
//  rr[i] is the radius of node i and dw[i] its quadrature weight; for a uniform mesh they
//  reduce to i*h and h, and the two variants then agree line for line.
// ===========================================================================================
let GRADED = false, rr = [], dw = [], Msplit = 0, hFine = 0;
let KCELL = false;   // second variant: kernel averaged over the cell rather than sampled

function buildGradedMesh() {
  // ONE extra node, at r = h/2. The error a uniform mesh makes is concentrated at the innermost
  // node, where the kernel is Z/h and largest; splitting that first cell addresses it and leaves
  // the rest of the grid alone. The spacings are then h/2, h/2, h, h, ... so i=1 is still
  // uniform (a = b = h/2), only i=2 sees unequal neighbours, and i>=3 is the ordinary stencil.
  hFine = h / 2;
  Msplit = 2;
  rr = new Array(N + 1); dw = new Array(N + 1);
  rr[0] = 0; rr[1] = hFine;
  for (let i = 2; i <= N; i++) rr[i] = (i - 1) * h;
  for (let i = 1; i < N; i++) dw[i] = (rr[i + 1] - rr[i - 1]) / 2;
  dw[0] = (rr[1] - rr[0]) / 2; dw[N] = (rr[N] - rr[N - 1]) / 2;
  dt = 0.5 * hFine * hFine;     // explicit stability is set by the finest cell
}

// The amplitude update on the graded mesh: ONE pass over every interior node, so the junction
// is treated like any other. (An earlier version split it into a fine and a coarse sweep to
// allow sub-cycling, and the node at the junction fell between them and was never updated.)
function relaxGraded(s, lo, hi, dtUse) {
  for (let i = Math.max(lo, 1); i < hi; i++) {
    const a = rr[i] - rr[i - 1], b = rr[i + 1] - rr[i];
    const lap = 2 * (b * u[i - 1] - (a + b) * u[i] + a * u[i + 1]) / (a * b * (a + b));
    // the uniform update uses a CENTRED derivative on shell 0 and a ONE-SIDED one above it;
    // match that exactly, or the two variants are different schemes and cannot be compared
    const du = (s === 0) ? (u[i + 1] - u[i - 1]) / (a + b) : (u[i + 1] - u[i]) / b;
    u[i] += 0.5 * dtUse * lap + dtUse * du / rr[i]
          + dtUse * Karr[i] * u[i] - dtUse * 2 * P[i] * u[i];
  }
}

// One macro step (free-boundary tracking + 5 Poisson sub-steps + per-shell normalization).
// Single source of truth shared by interactive draw() and the batch sweep.
function macroStep() {
  // Free boundary tracking: continuity of u at each M[s]
  for (let s = 1; s < NSHELLS; s++) {
    if (M[s] < M[s + 1] - 2 && M[s] > M[s - 1] + 2) {
      if (u[M[s]] > u[M[s] + 1] + diff) M[s]++;
      if (u[M[s]] < u[M[s] + 1] - diff) M[s]--;
    }
  }

  for (let k = 0; k < 5; k++) {
    if (!PK_MODE) u[0] = u[1] / (1 - cuspZ * h);   // nuclear cusp (none in pseudo-kernel mode)
    for (let s = 0; s < NSHELLS; s++) {
      let lo = M[s];
      let hi = M[s + 1];
      energy[s] = 0;
      eps[s] = 0;
      if (s === 0 && !PK_MODE) { u[hi] = u[hi - 1]; }   // origin-cusp shell (explicit nucleus)
      else {
        u[lo + 1] = u[lo + 2]; u[hi] = u[hi - 1];
        if (s === 0) u[lo] = u[lo + 1];                 // PK_MODE: Neumann valence edge at r_c
      }
      let iStart = (s === 0 && !PK_MODE) ? 1 : lo + 2;
      let iEnd = hi;
      // Inner-sphere correction (ported from molecule.js, R_SING = 2h): for the cusped 1s
      // shell on a bare nucleus the grid mis-resolves r < R_SING, so sum the grid only for
      // r >= R_SING (skip i=1) and add the analytic hydrogenic inner-sphere energy below.
      // VALID ONLY where R_SING is well inside the 1s cusp, i.e. a = Z*R_SING << 1. On this
      // uniform grid h grows with D, so 2h ~ 1/Z for heavy atoms -> a~1 and the analytic
      // (bare Z, no screening) over-binds catastrophically. Gate to the cusp regime a < 0.15.
      let innerCorr = (s === 0 && !PK_MODE && innerSphere && Z * 2 * h < 0.15);
      if (GRADED) relaxGraded(s, iStart, iEnd, dt);
      for (let i = iStart; i < iEnd; i++) {
        let du_dr = (s === 0) ? (u[i + 1] - u[i - 1]) : (u[i + 1] - u[i]);
        if (!GRADED)
        u[i] += 0.5 * dt * (u[i + 1] - 2 * u[i] + u[i - 1]) / (h * h)
              + 0.5 * dt * du_dr / (h * i * h)
              + dt * Karr[i] * u[i] - dt * 2 * P[i] * u[i];
        if (innerCorr && i < 2) continue;   // r < R_SING = 2h handled analytically below
        const ri_ = GRADED ? rr[i] : i * h;
        const dwi = GRADED ? dw[i] : h;
        let gr = GRADED ? (u[i + 1] - u[i - 1]) / (rr[i + 1] - rr[i - 1])
                        : (u[i + 1] - u[i - 1]) / (2 * h);
        energy[s] += (0.5 * gr * gr - Karr[i] * u[i] * u[i] + P[i] * u[i] * u[i]) * ri_ * ri_ * dwi;
        eps[s]    += (0.5 * gr * gr - Karr[i] * u[i] * u[i] + 2 * P[i] * u[i] * u[i]) * ri_ * ri_ * dwi;
      }
      if (innerCorr) {
        // Analytic inner-sphere (r < R_SING = 2h) for a hydrogenic 1s of effective charge Z:
        //   T_in = 2Z²[¼ − e^{−2a}(a²/2 + a/2 + ¼)],  V_in = −4Z²[¼ − e^{−2a}(a/2 + ¼)],  a = Z·R_SING
        let a = Z * 2 * h, e2a = Math.exp(-2 * a);
        let Tin =  2 * Z * Z * (0.25 - e2a * (a * a / 2 + a / 2 + 0.25));
        let Vin = -4 * Z * Z * (0.25 - e2a * (a / 2 + 0.25));
        energy[s] += Es[s] * (Tin + Vin);
        eps[s]    += Es[s] * (Tin + Vin);
      }
    }
    computePoisson();
  }

  // Normalization per shell
  for (let s = 0; s < NSHELLS; s++) {
    let lo = M[s];
    let hi = M[s + 1];
    let iStart = (s === 0) ? (PK_MODE ? M[0] : 0) : lo + 1;
    normu[s] = 0;
    for (let i = iStart; i <= hi; i++) {
      const ri_ = GRADED ? rr[i] : i * h, dwi = GRADED ? dw[i] : h;
      normu[s] += (u[i] * ri_) * (u[i] * ri_) * dwi;
    }
    if (normu[s] > 0) {
      let scale = sqrt(Es[s]) / sqrt(normu[s]);
      for (let i = iStart; i <= hi; i++) u[i] *= scale;
    }
  }
  step++;
}

function draw() {
  background(20);

  if (batchRunning && !batchPlot) {
    fill(255); textSize(18); textStyle(BOLD);
    text('Periodic-table sweep running…', 50, 60);
    textStyle(NORMAL); textSize(15); fill(180);
    text(sweepStatus, 50, 95);
    text('(page may pause per element; CSVs download when done)', 50, 125);
    return;
  }

  if (!running && !batchPlot) {
    drawSetupScreen();
    return;
  }

  // In batchPlot mode the state is whatever solveAtomPure just left behind: draw it, do not
  // advance it. Otherwise this is the ordinary interactive view and we step the relaxation.
  if (running) { for (let m = 0; m < 20; m++) macroStep(); }
  if (batchPlot) {
    // below every status row: the legend sits at iy=350 and the rows step 350, 368, 386, 402,
    // so anything above ~420 lands on top of them
    fill(255, 220, 0); textSize(16); textStyle(BOLD);
    text(batchCaption, 60, 470); textStyle(NORMAL);
    // the mesh jumps at Z=19 and the step count goes as (N/400)^2, so each atom from potassium
    // on takes about eight times as long. Without saying so the run looks stalled at argon.
    if (batchNote) { fill(150); textSize(11); textStyle(NORMAL); text(batchNote, 60, 492); }
    drawLiveTable(530, 30);
  }

  // --- Visualization ---
  // the scan draws a results table on the right, so the plot gives up width while it runs
  let plotX = 60, plotY = 30, plotW = batchPlot ? 440 : 660, plotH = 300;
  let rScale = plotW / N, uScale = 80;

  // Grid lines
  stroke(40);
  for (let i = 0; i <= 5; i++) {
    let x = plotX + i * plotW / 5;
    line(x, plotY, x, plotY + plotH);
  }
  let baseY = plotY + plotH * 0.6;
  stroke(60);
  line(plotX, baseY, plotX + plotW, baseY);

  // Shell boundary lines
  for (let s = 1; s < NSHELLS; s++) {
    stroke(shellCol(s)[0], shellCol(s)[1], shellCol(s)[2], 100);
    let bx = plotX + M[s] * rScale;
    line(bx, plotY, bx, plotY + plotH);
  }

  // u(r) — red
  noStroke();
  for (let i = 0; i <= N; i++) {
    fill(255, 60, 60);
    ellipse(plotX + i * rScale, baseY - u[i] * uScale, 3);
  }

  // P(r) — cyan
  for (let i = 1; i <= N; i++) {
    fill(0, 200, 200, 180);
    ellipse(plotX + i * rScale, baseY + P[i] * uScale * 0.5, 2);
  }

  // K(r) — blue
  for (let i = 1; i <= N; i++) {
    fill(80, 80, 255, 150);
    let kv = min(Karr[i], 50);
    ellipse(plotX + i * rScale, baseY + kv * uScale * 0.1, 2);
  }

  // Title
  fill(255);
  noStroke();
  textSize(14);
  textStyle(BOLD);
  let key = configKey();
  let ref = observed[key];
  let title = 'Z=' + Z + ', shells: ' + shellString();
  if (ref) title += ' (' + ref.name + ')';
  text(title, plotX, plotY - 10);
  textStyle(NORMAL);

  // Info below plot
  textSize(12);
  let iy = plotY + plotH + 20;

  // Legend
  fill(255, 60, 60); text('u(r)', plotX, iy);
  fill(0, 200, 200); text('P(r)', plotX + 40, iy);
  fill(80, 80, 255); text('K(r)', plotX + 80, iy);

  // Boundaries
  let bx = plotX + 130;
  for (let s = 1; s < NSHELLS; s++) {
    fill(shellCol(s)[0], shellCol(s)[1], shellCol(s)[2]);
    text('bdy' + s + '=' + (M[s] * h).toFixed(2), bx, iy);
    bx += 100;
  }

  // Shell energies
  iy += 18;
  fill(200);
  let ex = plotX;
  for (let s = 0; s < NSHELLS; s++) {
    text('E' + (s + 1) + '=' + energy[s].toFixed(3), ex, iy);
    ex += 110;
  }

  // Total energy
  iy += 18;
  let etot = 0;
  for (let s = 0; s < NSHELLS; s++) etot += energy[s];
  textSize(14);
  fill(255);
  text('E_total = ' + etot.toFixed(4) + ' Ha', plotX, iy);
  if (ref) {
    fill(150);
    text('(observed: ' + ref.E.toFixed(1) + ' Ha)', plotX + 220, iy);
    let err = abs(etot - ref.E);
    fill(err < 2 ? [100, 255, 100] : [255, 100, 100]);
    text('diff: ' + err.toFixed(2), plotX + 440, iy);
  }

  // Norms
  iy += 16;
  fill(120);
  textSize(11);
  let ns = 'step ' + step;
  for (let s = 0; s < NSHELLS; s++) ns += '  n' + (s + 1) + '=' + normu[s].toFixed(2);
  text(ns, plotX, iy);

  // r-axis
  fill(120);
  textSize(11);
  for (let i = 0; i <= 5; i++) {
    text((i * D / 5).toFixed(1), plotX + i * plotW / 5 - 8, baseY + 12);
  }
  text('r (au)', plotX + plotW - 30, baseY + 12);
}

// The scan takes minutes and watching one atom at a time is not how the table is read, so the
// results accumulate into a table drawn beside the densities: every element solved so far, with
// its configuration, energy, reference and difference, filling in as the run proceeds.
function drawLiveTable(tx, ty) {
  if (!fullRows.length) return;
  textStyle(BOLD); textSize(12); fill(100, 200, 255);
  text('all-electron, nothing fitted', tx, ty - 8);
  textStyle(NORMAL); textSize(9); fill(150);
  text('config from:  build-up (Z<=6)   balanced rule (<=20)   ionisation order (>20)', tx, ty + 24);
  textStyle(NORMAL); textSize(10); fill(150);
  text('el  Z  config', tx, ty + 10);
  text('E (Ha)', tx + 150, ty + 10);
  text('ref', tx + 215, ty + 10);
  text('diff', tx + 272, ty + 10);
  let sum = 0, n = 0;
  for (let i = 0; i < fullRows.length; i++) {
    const r = fullRows[i], y = ty + 38 + i * 11;
    if (y > 550) break;
    if (r.src === 'build-up') fill(230);
    else if (r.src === 'balanced rule') fill(190);
    else fill(150);
    text(r.el + '  ' + r.Z + '  ' + r.cfg, tx, y);
    fill(210); text(r.E === null ? '--' : r.E.toFixed(2), tx + 150, y);
    fill(140); text(r.ref === null ? '--' : r.ref.toFixed(1), tx + 215, y);
    if (r.err === null) { fill(120); text('--', tx + 272, y); }
    else {
      const a = Math.abs(r.err); sum += a; n++;
      if (a < 2) fill(120, 255, 120); else if (a < 5) fill(255, 220, 100); else fill(255, 140, 140);
      text((r.err >= 0 ? '+' : '') + r.err.toFixed(1) + '%', tx + 272, y);
    }
  }
  if (n) { fill(180); textSize(11);
    text('mean |diff| = ' + (sum / n).toFixed(1) + '%   over ' + n + ' elements',
         tx, ty + 38 + Math.min(fullRows.length, 40) * 11 + 12); }
}

function drawSetupScreen() {
  readSliders();

  // Shell circles. Centred at x=175, not 375: the outermost ring has diameter 60+5*50 = 310,
  // so a centre at 375 runs the ring out to x=530 and straight through the results table, which
  // begins at x=430. At 175 the picture occupies the empty left column and the two do not meet.
  const SCX = 175, SCY = 240;
  noStroke();
  for (let s = NSHELLS - 1; s >= 0; s--) {
    fill(shellCol(s)[0], shellCol(s)[1], shellCol(s)[2], 50 + s * 10);
    ellipse(SCX, SCY, 60 + s * 50);
  }
  fill(255);
  ellipse(SCX, SCY, 8);

  // Shell labels on circles
  textSize(12);
  for (let s = 0; s < NSHELLS; s++) {
    fill(shellCol(s)[0], shellCol(s)[1], shellCol(s)[2]);
    text(Es[s], SCX + 5 + s * 25, SCY + 2);
  }

  // Title
  fill(100, 200, 255);
  textSize(16);
  textStyle(BOLD);
  text('RealQM Atom Simulator', 50, 30);
  textStyle(NORMAL);
  textSize(13);
  fill(200);
  text('Up to 6 shells in spherical symmetry', 50, 50);
  text('Shell 1: 2 electrons (fixed). Shells 2-6: 0-4 electrons each.', 50, 75);
  text('Choose Z and shell occupations, press Start', 50, 100);

  // One table, not two: once a scan has run its results replace the stored ones rather than
  // being drawn on top of them.
  if (fullRows.length) drawLiveTable(430, 60);
  else drawStoredTable();
  drawSetupPanels();
}

// Stored results: total energies (balanced cap-4) vs reference, Z=2..18. Shown until a scan
// has run, after which the scan's own results take the same place.
function drawStoredTable() {
  // same renderer as the scan, so the opening screen and a completed run look alike and a
  // 36-row table still fits the canvas
  const rows = RESULTS.map(function (r) {
    return { el: r[0], Z: r[1], cfg: r[2], E: r[3], ref: r[4],
             err: (r[3] - r[4]) / r[4] * 100, N: null, src: configSource(r[1]) };
  });
  const keep = fullRows; fullRows = rows;
  drawLiveTable(430, 60);
  fullRows = keep;
}

function drawSetupPanels() {

  // Current selection
  fill(255, 200, 0);
  textSize(13);
  text('Z=' + Z, 20, 515);
  for (let s = 0; s < 5; s++) {
    text('E' + (s + 2) + '=' + Es[s + 1], 155 + s * 90, 515);
  }

  // Show config and reference
  let key = configKey();
  let ref = observed[key];
  fill(100, 255, 100);
  textSize(14);
  text('Config: ' + shellString() + ' = ' + Es.slice(0, NSHELLS).reduce((a, b) => a + b, 0) + ' electrons', 50, 130);
  if (ref) {
    text(ref.name + ' (observed: ' + ref.E + ' Ha)', 50, 150);
  }

  // WHAT TO TRY. Shown until a sweep has run, in the space the results panel will occupy, so a
  // first-time visitor -- a reader arriving from the paper -- has something concrete to press
  // rather than a wall of unlabelled controls. It disappears once ptPanel is populated.
  if (!ptPanel || !ptPanel.length) {
    let tx = 20, ty = 336;
    fill(100, 200, 255); textSize(12); textStyle(BOLD);
    text('What to try', tx, ty); textStyle(NORMAL);
    fill(190); textSize(11);
    text('1.  Choose Z and the shell occupations below, then Start.', tx, ty + 20);
    fill(140); textSize(10);
    text('Nothing fixes the shell radii: they move until the amplitudes match across each', tx + 14, ty + 33);
    text('interface. That balance is the whole of the boundary condition.', tx + 14, ty + 46);
    fill(190); textSize(11);
    text('2.  The two "Periodic table" buttons solve 2..18 and 19..36 in turn.', tx, ty + 66);
    fill(140); textSize(10);
    text('All-electron, nothing fitted. N=400 through argon and N=800 beyond, because the', tx + 14, ty + 79);
    text('innermost shell contracts as 1/Z; the second run is slower for that reason.', tx + 14, ty + 92);
    fill(190); textSize(11);
    text('3.  Watch what changes at scandium.', tx, ty + 112);
    fill(140); textSize(10);
    text('Up to calcium each new charge goes outside what is already there. From scandium it', tx + 14, ty + 125);
    text('belongs inside, and a build-up that only adds outward cannot put it there.', tx + 14, ty + 138);
  }

  // On-screen results panel: periodic-table heatmap of total-energy error (after "Total energies" sweep)
  if (ptPanel && ptPanel.length) {
    const groups = [1, 2, 13, 14, 15, 16, 17, 18];
    let gx0 = 20, gy0 = 395, cw = 46, ch = 22;
    fill(100, 200, 255); textSize(12); textStyle(BOLD);
    text('Frozen-core total-E error %  (green <1, yellow <3, red >3)', gx0, gy0 - 16);
    textStyle(NORMAL); textSize(9); fill(150); textAlign(LEFT);
    for (let c = 0; c < 8; c++) text('g' + groups[c], gx0 + c * cw + 3, gy0 - 3);
    for (let p = 2; p <= 6; p++) {
      fill(150); textSize(9); text('P' + p, gx0 - 0, gy0 + (p - 2) * ch + 13);
      for (let c = 0; c < 8; c++) {
        let cell = ptPanel.find(r => r.p === p && r.g === groups[c]);
        let x = gx0 + 18 + c * cw, y = gy0 + (p - 2) * ch;
        if (cell && isFinite(cell.eE)) {
          let a = Math.abs(cell.eE);
          if (a < 1) fill(30, 95, 35); else if (a < 3) fill(120, 95, 25); else fill(130, 40, 40);
          noStroke(); rect(x, y, cw - 2, ch - 2);
          fill(255); textSize(10); text(cell.el, x + 3, y + 10);
          fill(225); textSize(8); text((cell.eE >= 0 ? '+' : '') + cell.eE.toFixed(1), x + 3, y + 19);
        }
      }
    }
  }
}
</script>
