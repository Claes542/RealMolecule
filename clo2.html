<!DOCTYPE html>
<!--
  clo2.html -- chlorine dioxide, ClO2, in RealQM.
  =================================================================================
  WHY THIS SYSTEM.  ClO2 has 19 valence electrons -- ODD -- and is a stable free
  radical.  In standard quantum mechanics that is the difficulty: open-shell doublet,
  UHF or ROHF, spin contamination, a decision about which orbital holds the unpaired
  electron, and Pauling's "three-electron bond" invented to explain Cl-O distances
  shorter than a single bond.  Every one of those is SPIN BOOKKEEPING.
  RealQM has no spin and no pairing -- Pauli exclusion is replaced by non-overlap of
  unit charge densities -- so an odd electron count is not a special case here, it is
  the generic case.  The observable is the GEOMETRY, where the framework is strong.

  THE MODEL.  Reduced bonding valence on screened pseudo-kernels, which is the house
  convention (mol_fast_menu.html: O is Z=2 rc=0.5, N is Z=3, C is Z=4, F is Z=5):

      Cl   kernel +3,  3 valence electrons   'third' split, 3 sectors at 120 deg
      O    kernel +2,  2 valence electrons   'hemi'  split, 2 hemispheres
      O    kernel +2,  2 valence electrons   'hemi'

      7 one-electron domains, kernel +7, net 0.  SEVEN IS ODD, so the radical
      character survives the reduction, which is the whole point of the test.

  Chlorine at +3 is two Cl-O bonds plus the odd electron, on the same reading that
  makes O two bonds and N three.  No sector count is invented: 3 and 2 are splits the
  machinery already has, so unlike the 8-sector octet-with-holes construction there
  are no vacancies whose orientation has to be guessed.

  SECTOR ORIENTATION, derived rather than assumed.  For splitType 3 ('third') the
  shader builds its in-plane basis as e1 = (a1,-a0,0) and e2 = a x e1 (molecule.js
  :461-474).  With the molecule in the xz-plane and the split axis along +y, that
  gives e1 = x, e2 = -z, so a direction's azimuth is atan2(-p_z, p_x).  Setting
  splitRot to the azimuth of O(a) puts
      sector 1 -> bond to O(a)      sector 0 -> bond to O(b)
      sector 2 -> the radical direction, -z, away from both oxygens
  with separations 117.4 / 121.3 / 121.3 deg against the sectors' 120.  For 'hemi'
  the axis is the O->Cl direction, so sector 1 (dotp >= 0) is the bond-side
  hemisphere and sector 0 the far side -- both occupied, nothing to orient.

  The page PRINTS the realised sector directions, not just the bond lengths: the
  electron geometry has to be checked the way CLAUDE.md requires the nuclear geometry
  to be checked, and a wrongly aimed sector would not show up in a bond length.

  WHAT THIS CANNOT DO, so nobody reads it as doing it.
    - Every spin observable: the doublet ground state, EPR, hyperfine, the g-tensor.
      Coulomb-only, so these are absent structurally, not inaccurately.
    - Absolute energies, and 2 ClO2 vs Cl2O4 -- a difference ACROSS compositions,
      which is the class where the errors stop cancelling.
    - Z = 17 is at the top of the validated atomic range (Z <= 18, 4+4 packing), so
      chlorine is inside it but at the edge.

  BEFORE QUOTING ANY ANGLE: ladders, per CLAUDE.md.
    step   ?steps=4000 / 8000 / 16000 / 32000
    mesh   ?n=120 / 160 / 200 / 240
    r_c    ?rc_cl= and ?rc_o=    (r_c is an INPUT; the water case showed r_c trading
                                 the dipole against the angle)
  Kernel positions are FRACTIONAL on purpose.  Math.round on a kernel position costs
  39.5 kcal/mol in NH3 and destroys T_d (project_kernel_grid_snapping); the menu page
  rounds, and this page must not.

  ?dyn=1 lets the built-in schedule release the nuclei, so the geometry is FOUND.
  Do NOT set USER_DYNAMICS at step 0: molecule.js auto-enables at phaseSteps >= 10000
  (line 6135) so the electrons relax first, and forcing it on earlier moves the nuclei
  on forces from an unrelaxed density -- ClO2 then flies apart, 2.78 -> 8.46 au in
  44 s, which is a protocol artefact and not a dissociation.
-->
<meta charset="utf-8">
<title>ClO2 -- chlorine dioxide in RealQM</title>
<style>
  body { background:#0b0e12; color:#cfd8dc; font:13px/1.6 -apple-system,Segoe UI,sans-serif; margin:0; padding:14px }
  pre.box { white-space:pre-wrap; background:#0f141a; border:1px solid #243; padding:10px 13px;
            border-radius:6px; max-width:940px }
  #log  { border-left:3px solid #4fc3f7 }
  #live { border-left:3px solid #ffb74d; margin-top:10px }
  b.k { color:#4fc3f7 } b.w { color:#ffb74d } b.g { color:#a5d6a7 }
</style>
<pre class="box" id="log">loading...</pre>

<script>
(function () {
  var q    = new URLSearchParams(location.search);
  var N    = parseInt(q.get('n') || '200', 10);
  var scr  = parseFloat(q.get('box')   || '16');
  var rcCl = parseFloat(q.get('rc_cl') || '0.5');
  var rcO  = parseFloat(q.get('rc_o')  || '0.5');   // mol_fast_menu: O at Z=2 uses rc 0.5
  var steps= parseInt(q.get('steps')   || '32000', 10);
  var dyn  = q.get('dyn') === '1';

  // --- experimental geometry (microwave): r(Cl-O) = 1.470 A, O-Cl-O = 117.4 deg ---
  var A2AU = 1 / 0.529177210903;
  var R    = parseFloat(q.get('r')     || '1.470') * A2AU;
  var ANG  = parseFloat(q.get('angle') || '117.4');
  var half = ANG * Math.PI / 360;
  var h    = scr / N;
  var c    = N / 2;                                  // fractional centre, NOT rounded

  // Cl at the centre, C2 axis along +z, molecule in the xz-plane.
  var sh = Math.sin(half), ch = Math.cos(half);
  var posAu = { Cl: [0,0,0], Oa: [ +R*sh, 0, +R*ch ], Ob: [ -R*sh, 0, +R*ch ] };
  function cell(p) { return [ c + p[0]/h, c + p[1]/h, c + p[2]/h ]; }

  // ---- where the odd electron is put: ?radical=plane (default) or perp ----
  //
  // stdQM assigns ClO2 a X 2B1 ground state, and b1 in C2v is the OUT-OF-PLANE
  // representation, so the standard picture has the odd electron in a pi* orbital
  // perpendicular to the molecular plane.  The question is whether this model agrees.
  //
  // It cannot be asked as a pure rotation.  A 'third' split bins cells by azimuth
  // about its axis, so its three sector centres are COPLANAR by construction -- and
  // the two bond directions together with the out-of-plane direction are not
  // coplanar: a.O(a) = a.O(b) = a.y = 0 forces a = 0.  So the two variants below are
  // different PARTITIONS, not one partition rotated, and the energy difference
  // between them mixes the radical's placement with the shape of the partition.
  // Stated here because it limits what the comparison can settle.
  //
  //   plane  axis +y, sectors fan out IN the molecular xz-plane:
  //          two on the bonds, the third along -z, away from both oxygens.
  //          splitRot = azimuth of O(a) in the shader's basis (e1 = x, e2 = -z).
  //   perp   axis +z, sectors fan out in the xy-plane (e1 = y, e2 = -x):
  //          sector 1 centred on +y, OUT of the plane; sectors 0 and 2 straddle the
  //          plane on the O(a) and O(b) sides.  Asymmetry to note: -y also falls in
  //          sector 0, so that domain carries the O(a) side and the -y region both.
  var radical = (q.get('radical') === 'perp') ? 'perp' : 'plane';
  var clAxis, clRot, clLabels;
  if (radical === 'plane') {
    clAxis = [0,1,0];
    clRot  = Math.atan2(-ch, sh);                    // = -31.30 deg at 117.4
    clLabels = ['bond to O(b)', 'bond to O(a)', 'radical lobe, IN plane, along -z'];
  } else {
    clAxis = [0,0,1];
    clRot  = 0;                                      // puts sector 1 centre on +y
    clLabels = ['O(a) side (and the -y region)', 'radical lobe, OUT of plane, along +y',
                'O(b) side'];
  }

  var spec = [
    { el:'Cl', pos:posAu.Cl, ne:3, Znuc:3, rc:rcCl, split:'third',
      axis:clAxis, rot:clRot, labels:clLabels },
    { el:'O',  pos:posAu.Oa, ne:2, Znuc:2, rc:rcO,  split:'hemi',
      axis:[-sh,0,-ch], rot:0, labels:['far side', 'bond side, toward Cl'] },
    { el:'O',  pos:posAu.Ob, ne:2, Znuc:2, rc:rcO,  split:'hemi',
      axis:[ sh,0,-ch], rot:0, labels:['far side', 'bond side, toward Cl'] }
  ];

  var atoms=[], Zel=[], Znuc=[], rcA=[], stype=[], sidx=[], saxis=[], srot=[], names=[];
  spec.forEach(function (a) {
    var g = cell(a.pos);
    for (var m = 0; m < a.ne; m++) {
      atoms.push({ i:g[0], j:g[1], k:g[2], Z:1, el:a.el });
      Zel.push(1);
      Znuc.push(a.Znuc / a.ne);        // spread evenly; sums to a.Znuc
      rcA.push(a.rc);
      stype.push(a.split); sidx.push(m); saxis.push(a.axis); srot.push(a.rot);
      names.push(a.el + ' ' + m + ': ' + a.labels[m]);
    }
  });

  window.USER_NN         = N;
  window.USER_SCREEN     = scr;
  window.USER_STEPS      = steps;
  window.USER_ATOMS      = atoms;
  window.USER_Z          = Zel;
  window.USER_Z_NUC      = Znuc;
  window.USER_RC         = rcA;
  window.USER_SPLIT_TYPE = stype;
  window.USER_SPLIT_IDX  = sidx;
  window.USER_SPLIT_AXIS = saxis;
  window.USER_SPLIT_ROT  = srot;
  window._atomNames      = names;
  if (dyn) window.USER_NUC_SUBSTEPS = 2; else window.NO_AUTO_DYNAMICS = true;

  // ---- the geometry actually built, from the kernel cells ----
  var gCl = cell(posAu.Cl), gOa = cell(posAu.Oa), gOb = cell(posAu.Ob);
  function d(p,r){ var a=p[0]-r[0], b=p[1]-r[1], e=p[2]-r[2];
                   return Math.sqrt(a*a+b*b+e*e)*h; }
  var rA = d(gCl,gOa), rB = d(gCl,gOb);
  var va=[gOa[0]-gCl[0],gOa[1]-gCl[1],gOa[2]-gCl[2]];
  var vb=[gOb[0]-gCl[0],gOb[1]-gCl[1],gOb[2]-gCl[2]];
  var dp=va[0]*vb[0]+va[1]*vb[1]+va[2]*vb[2];
  var La=Math.hypot(va[0],va[1],va[2]), Lb=Math.hypot(vb[0],vb[1],vb[2]);
  var angBuilt = Math.acos(dp/(La*Lb))*180/Math.PI;

  // ---- the SECTOR geometry actually built: where each Cl third points ----
  // Reproduce the shader's own basis (molecule.js:461-474) for whatever axis is in
  // use, so the printout is a check and not a restatement of the input.
  function shaderBasis(a) {
    var L = Math.hypot(a[0],a[1],a[2]); a = [a[0]/L, a[1]/L, a[2]/L];
    var e1 = (Math.abs(a[2]) < 0.9) ? [a[1], -a[0], 0] : [0, a[2], -a[1]];
    var l1 = Math.hypot(e1[0],e1[1],e1[2]); e1 = [e1[0]/l1, e1[1]/l1, e1[2]/l1];
    var e2 = [ a[1]*e1[2] - a[2]*e1[1], a[2]*e1[0] - a[0]*e1[2], a[0]*e1[1] - a[1]*e1[0] ];
    return { a:a, e1:e1, e2:e2 };
  }
  var B = shaderBasis(clAxis);
  function sectorOf(p) {                    // which third a direction falls in
    var th = Math.atan2(p[0]*B.e2[0]+p[1]*B.e2[1]+p[2]*B.e2[2],
                        p[0]*B.e1[0]+p[1]*B.e1[1]+p[2]*B.e1[2]) - clRot;
    while (th < -Math.PI) th += 2*Math.PI;
    while (th >  Math.PI) th -= 2*Math.PI;
    return ((Math.floor((th + Math.PI)/(2*Math.PI/3)) % 3) + 3) % 3;
  }
  var secLines = '';
  for (var m = 0; m < 3; m++) {
    var az = -Math.PI + (m + 0.5)*(2*Math.PI/3) + clRot;
    var u  = [ Math.cos(az)*B.e1[0] + Math.sin(az)*B.e2[0],
               Math.cos(az)*B.e1[1] + Math.sin(az)*B.e2[1],
               Math.cos(az)*B.e1[2] + Math.sin(az)*B.e2[2] ];
    secLines += '    Cl sector ' + m + ' centre = ('
              + u[0].toFixed(3) + ', ' + u[1].toFixed(3) + ', ' + u[2].toFixed(3) + ')'
              + '   |y| = ' + Math.abs(u[1]).toFixed(3)
              + '   (' + clLabels[m] + ')\n';
  }
  var dirOa = [ sh, 0, ch], dirOb = [-sh, 0, ch], dirY = [0,1,0], dirMz = [0,0,-1];
  secLines += '    O(a) bond -> sector ' + sectorOf(dirOa)
            + ',  O(b) bond -> sector ' + sectorOf(dirOb)
            + ',  +y -> sector ' + sectorOf(dirY)
            + ',  -z -> sector ' + sectorOf(dirMz) + '\n';

  document.getElementById('log').innerHTML =
    '<b class="k">ClO2 -- chlorine dioxide, RealQM</b>\n' +
    'reduced bonding valence: <b class="g">Cl +3 with 3 electrons</b> (third split), ' +
      '<b class="g">O +2 with 2 electrons</b> each (hemi split)\n' +
    '-> <b class="g">' + Zel.length + ' one-electron domains</b>, kernel +' +
      Znuc.reduce(function(s,z){return s+z;},0).toFixed(3) + ', net ' +
      (Znuc.reduce(function(s,z){return s+z;},0) - Zel.length).toFixed(3) +
      '  &mdash; <b class="w">7 is odd, so the radical survives the reduction</b>\n' +
    'grid ' + N + '^3, box ' + scr + ' au, h = ' + h.toFixed(4) + ' au, steps ' + steps + '\n' +
    'r_c: Cl ' + rcCl + ', O ' + rcO + '   (inputs -- run the r_c ladder)\n' +
    'nuclei ' + (dyn ? '<b class="w">released by the built-in schedule at step 10000</b>'
                     : 'held at the experimental geometry (add ?dyn=1 to release)') + '\n' +
    '\n<b class="k">nuclear geometry actually built</b> (from the kernel cells)\n' +
    '  Cl-O    ' + rA.toFixed(4) + ' / ' + rB.toFixed(4) + ' au = ' +
      (rA/A2AU).toFixed(4) + ' / ' + (rB/A2AU).toFixed(4) + ' A   [target ' +
      (R/A2AU).toFixed(3) + ' A]\n' +
    '  O-Cl-O  ' + angBuilt.toFixed(3) + ' deg   [target ' + ANG.toFixed(1) + ' deg]\n' +
    '  fractional cells, no Math.round\n' +
    '\n<b class="k">electron geometry actually built</b> (sector centres, checked not assumed)\n' +
    '  radical placement: <b class="w">' + radical.toUpperCase() + '</b>' +
      (radical === 'plane' ? '  (odd electron IN the molecular plane, along -z)'
                           : '  (odd electron OUT of the plane, along +y -- the b1 direction)') +
      '   &mdash; switch with ?radical=plane|perp\n' +
    secLines +
    '    O hemi axis = O->Cl, so sector 1 is the bond-side hemisphere and 0 the far side\n' +
    '    <b class="w">caveat:</b> the two variants are different PARTITIONS, not one rotated,\n' +
    '    because a third split has coplanar sector centres and the two bonds plus the\n' +
    '    out-of-plane direction are not coplanar. The energy difference therefore mixes\n' +
    '    the radical placement with the partition shape.\n' +
    '\n<b class="w">ladders before any number is quoted</b>  ?steps= / ?n= / ?rc_cl= / ?rc_o=\n' +
    '<b class="w">out of range</b>  spin (doublet, EPR, hyperfine, g); absolute energies;\n' +
    '  and 2 ClO2 vs Cl2O4, a difference ACROSS compositions.\n' +
    '\nloading molecule.js ...';

  // ---- live readout: DOM + title, since AppleScript sees no window.* globals ----
  var out = document.createElement('pre');
  out.className = 'box'; out.id = 'live';
  out.textContent = 'waiting for the solver ...';
  document.body.appendChild(out);

  var t0 = Date.now();
  function geomNow() {
    var P = window._nucPos;
    if (!P || !P[5]) return null;
    var cl = P[0], oa = P[3], ob = P[5];     // 0-2 Cl thirds, 3-4 O(a) hemis, 5-6 O(b)
    function dc(p,r){ var a=p[0]-r[0], b=p[1]-r[1], e=p[2]-r[2];
                      return Math.sqrt(a*a+b*b+e*e); }
    var ra = dc(cl,oa)*h, rb = dc(cl,ob)*h;
    var wa=[oa[0]-cl[0],oa[1]-cl[1],oa[2]-cl[2]], wb=[ob[0]-cl[0],ob[1]-cl[1],ob[2]-cl[2]];
    var dt=wa[0]*wb[0]+wa[1]*wb[1]+wa[2]*wb[2];
    var A=Math.hypot(wa[0],wa[1],wa[2]), B=Math.hypot(wb[0],wb[1],wb[2]);
    return { ra:ra, rb:rb, ang:Math.acos(Math.max(-1,Math.min(1,dt/(A*B))))*180/Math.PI };
  }
  setInterval(function () {
    var E = window._E, g = geomNow();
    var txt = 't=' + ((Date.now()-t0)/1000).toFixed(0) + 's'
      + '  E=' + (E === undefined ? 'n/a' : E.toFixed(5))
      + (g ? '  Cl-O=' + g.ra.toFixed(4) + '/' + g.rb.toFixed(4) + ' au ('
             + (g.ra/A2AU).toFixed(4) + '/' + (g.rb/A2AU).toFixed(4) + ' A)'
             + '  O-Cl-O=' + g.ang.toFixed(3) + ' deg' : '  geom n/a')
      + '  | 7e n=' + N + ' box=' + scr + ' rc=' + rcCl + '/' + rcO + ' dyn=' + (dyn?1:0);
    out.textContent = txt;
    document.title = 'CLO2 ' + txt;
    try { localStorage.setItem('clo2_live', txt); } catch (e) {}
  }, 2000);

  var s = document.createElement('script');
  s.src = 'molecule.js?t=' + Date.now();
  s.onerror = function () { out.textContent += '\nfailed to load molecule.js'; };
  s.onload  = function () {
    var p = document.createElement('script');
    p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
    document.head.appendChild(p);
  };
  document.head.appendChild(s);
})();
</script>
