<!-- ===================================================================
     Leibniz World of Math — live Model Gallery
     Paste into a WordPress "Custom HTML" block.
     Replaces thumbnails with the running sketches themselves.

     loading="lazy" matters here: each embed loads the p5 EDITOR app, not
     just the sketch, so without it six tiles pull six bundles at once.
     Lazy loading defers each until it scrolls into view.

     To add a tile: copy one <figure>, swap the sketch id in the src.
     A /sketches/<id> link from the workshop becomes /full/<id> here.
     =================================================================== -->
<style>
  .lwm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
            gap:22px;margin:18px 0}
  .lwm-grid figure{margin:0;border:1px solid #ddd;border-radius:6px;overflow:hidden;
                   background:#fff}
  .lwm-grid iframe{display:block;width:100%;height:340px;border:0}
  .lwm-grid figcaption{padding:8px 10px;font:13px/1.35 system-ui,sans-serif;
                       border-top:1px solid #eee;background:#fafafa}
  .lwm-grid figcaption a{text-decoration:none}
  .lwm-note{font:13px/1.45 system-ui,sans-serif;color:#555;margin:6px 0 16px}
</style>

<p class="lwm-note">
  These run here. Click a title to open the code in the p5 editor, where you can read it,
  change it and run your own version.
</p>

<div class="lwm-grid">

  <figure>
    <iframe loading="lazy" src="https://editor.p5js.org/claesjohnson/full/FWWQ29WbJ"></iframe>
    <figcaption><a href="https://editor.p5js.org/claesjohnson/sketches/FWWQ29WbJ">Double Pendulum</a>
      — two equations, no formula for the answer.</figcaption>
  </figure>

  <figure>
    <iframe loading="lazy" src="https://editor.p5js.org/claesjohnson/full/cEDX1WiAQ"></iframe>
    <figcaption><a href="https://editor.p5js.org/claesjohnson/sketches/cEDX1WiAQ">Gravitational World Model</a>
      — Laplace u = f, solved by time stepping in one line.</figcaption>
  </figure>

  <figure>
    <iframe loading="lazy" src="https://editor.p5js.org/claesjohnson/full/I_4pCbHlx"></iframe>
    <figcaption><a href="https://editor.p5js.org/claesjohnson/full/I_4pCbHlx">Bluff Body Flow</a>
      — incompressible flow with slip.</figcaption>
  </figure>

  <figure>
    <iframe loading="lazy" src="https://editor.p5js.org/claesjohnson/full/LJ4fzm1_B"></iframe>
    <figcaption><a href="https://editor.p5js.org/claesjohnson/full/LJ4fzm1_B">Turing Patterns</a>
      — structure from diffusion and reaction alone.</figcaption>
  </figure>

  <figure>
    <iframe loading="lazy" src="https://editor.p5js.org/claesjohnson/full/vNeu97DfH"></iframe>
    <figcaption><a href="https://editor.p5js.org/claesjohnson/full/vNeu97DfH">Ship Waves</a>
      — shallow water, nonlinear.</figcaption>
  </figure>

  <figure>
    <iframe loading="lazy" src="https://editor.p5js.org/claesjohnson/full/_mafPT2U6"></iframe>
    <figcaption><a href="https://editor.p5js.org/claesjohnson/full/_mafPT2U6">RealQM Helium</a>
      — the atom as non-overlapping charge densities.</figcaption>
  </figure>

</div>
