     canvas still began at x=0 under the panel), so target canvas directly and force it. The
     plots are also shrunk below: panel edge 252 + 24px gap + canvas 336 = 612 fits a 627 px window side by side,
     where the stock 620 px canvas could not. */
  /* Target ONLY p5's main canvas. A bare `canvas` rule with display:block !important also
     un-hid p5's offscreen createGraphics buffer (the 3D view), which then rendered a second,

  #defaultCanvas0 { margin-left: 276px !important; display: block !important; position: relative; z-index: 1; }
  /* The picker must sit above the canvas unconditionally: a select is a native control and was

  #panel, #panel * { position: relative; z-index: 1001; }
  #mol { width: 100%; box-sizing: border-box; }
  #defaultCanvas1 { display: none !important; }

  var pre = document.createElement('pre');
  pre.style.cssText = 'color:#f66;background:#200;padding:12px;white-space:pre-wrap';
  pre.textContent = 'ERROR: ' + m + '\n  at ' + u + ':' + l + ':' + c;
  document.body.insertBefore(pre, document.body.firstChild);
};
// Measured geometries converted from internal coordinates to Cartesian (bohr), centred.

// The four linear additions were chosen because the measurements predict that linear

// and their domains are firmly held, so no shallow-kernel non-convergence.
// WHAT SigmaF MEANS depends on the molecule's symmetry, and the distinction is easy to misread.
// SigmaF = 0 is NOT an identity: it equals the net force of the electron cloud on the nuclei and
// vanishes only when the electronic state is converged -- so it is a CONVERGENCE meter. But a
// symmetric molecule has SigmaF = 0 forced by symmetry whatever the accuracy, so there it reports

// symmetry being preserved, not convergence being good.
var SYM = { h:'full', c:'full', n:'full', o:'full', h2:'full', n2:'full', o2:'full', co:'none', co2:'full', n2o:'none', hcn:'none',
            c2h2:'full', c2n2:'full', c3o2:'full', hc3n:'none', c4h2:'full',

var SYMNOTE = {

(function () {
  // A MOLECULE SIMULATOR ON MEASURED GEOMETRIES.
  //
  // Each entry carries experimental internal coordinates converted to Cartesian and centred.
  // At the measured geometry the true force on every nucleus is ZERO, so the computed force is
  // model error read directly -- no reference calculation, no scan, no minimum-finding.
  //
  // WHAT THE PAGE CHECKS ON EVERY RUN, because a plausible-looking number is the failure mode:
  //   V_KK   exact arithmetic (sum Z_a Z_b / R_ab) on the geometry ACTUALLY BUILT
  //   Fsum   must vanish: it equals the net force of the electron cloud on the nuclei, so it is
  //          a CONVERGENCE meter -- but symmetry cancels it, so it informs only in unprotected
  //          directions. Symmetric molecules get a per-atom zero check instead where one applies.
  //
  // LIMITS, measured 2026-11: mol_fast caps at 16 domains. Shallow kernels do not converge, so
  // C+4/N+3/O+3 and never C+2. Threefold and bent geometries (NH3, H2O) suffer cubic-grid
  // anisotropy and are the worst cases. Absolute energies are not converged at these meshes and
  // depend strongly on the kernel softening -- H2's bond moves 1.375 -> 1.625 as eps goes
  // 0 -> h in an independent solver -- so read DIRECTIONS and error bars, not absolute numbers.
  var qp  = new URLSearchParams(location.search);
  var key = qp.get('mol') || 'ch4';
  if (!MOLS[key]) key = 'ch4';
  var M = MOLS[key];

  // Box from the molecule's own extent: the outermost nucleus plus room for its electron cloud
  // (~3 a0) plus margin. Undersized boxes were a real error source -- several runs were silently
  // wall-clipped before the extents were checked.
  // Auto-sized from the molecule's own extent. ?box= OVERRIDES it, which is required for any
  // comparison that varies geometry: opening water's bond angle changes the extent, which changes
  // the auto box and therefore the mesh, so an angle ladder on the default sizing silently compares
  // rows at different h. Rows must share a box to be read against one another.
  var box = parseFloat(qp.get('box') || '0') || Math.ceil((M.ext + 3.0) * 2 + 4);
  if (box < (M.ext + 3.0) * 2) console.warn('box ' + box + ' is smaller than the molecule needs');
  var hTarget = parseFloat(qp.get('h') || '0.14');
  var N = Math.round(box / hTarget / 2) * 2;
  var h = box / N, N2 = Math.round(N / 2);

  // An atom may carry sp:n, meaning its valence is SPLIT into n one-electron domains at that
  // site rather than held as one n-electron blob. That is the house construction -- n unit charges
  // give n(n-1)/2 pairs, each counted once -- and for water it is the difference between right and
  // wrong: the recorded result is that correct polarity needs SPLIT O and r_c = 0, while a
  // non-split blob inverts it. Only the FIRST sibling carries the kernel charge; mol_fast sums
  // Z over entries at a site, so the others take Z:0. Angular split type follows the count.
  // ?sep= OVERRIDES a diatomic's separation, keeping the centroid. This is what lets the
  // dissociation path be walked: E_bind = integral of F dR from R_e to infinity is the WORK done
  // against the restoring force to pull the molecule apart. That route never computes a separated
  // atom -- the composition is identical at every point and the dissociation limit is reached by
  // the same code with the same domains -- so the atomic references' 2-2.6x over-binding, which
  // currently cancels only by assumption, drops out by construction.
  // It requires the force to be a TRUE GRADIENT, which the volume integral is (agreeing with
  // -dE/dR to 4-6%) and the old sampled point-gradient was not, so this was previously unavailable.
  if (qp.get('sep') && M.atoms.length === 2) {
    var sepWant = parseFloat(qp.get('sep'));
    var ax = M.atoms[0], bx = M.atoms[1];
    var d0 = Math.sqrt(Math.pow(ax.x-bx.x,2) + Math.pow(ax.y-bx.y,2) + Math.pow(ax.z-bx.z,2));
    var f = sepWant / d0, cx = (ax.x+bx.x)/2, cy = (ax.y+bx.y)/2, cz = (ax.z+bx.z)/2;
    M = JSON.parse(JSON.stringify(M));          // do not mutate the shared MOLS entry
    var P = [[ax.x,ax.y,ax.z],[bx.x,bx.y,bx.z]], C = [cx,cy,cz];
    for (var q = 0; q < 2; q++) {
      M.atoms[q].x = C[0] + (P[q][0]-C[0])*f;
      M.atoms[q].y = C[1] + (P[q][1]-C[1])*f;
      M.atoms[q].z = C[2] + (P[q][2]-C[2])*f;
    }
    M.ext = Math.max(M.ext, sepWant/2);
  }

  var SPLIT_BY_N = { 2: 'hemi', 3: 'third', 4: 'tetra' };
  var nuclei = [], targets = [], labels = [];
  M.atoms.forEach(function (a) {
    var base = { i: N2 + a.x / h, j: N2 + a.y / h, k: N2 + a.z / h, rc: 0, fixed: !qp.get('dyn') };
    if (!a.sp) {
      nuclei.push(Object.assign({}, base, { Z: a.Z }));
      targets.push(a.Z); labels.push(a.el);
    } else {
      for (var q = 0; q < a.sp; q++) {
        nuclei.push(Object.assign({}, base, {
          Z: q === 0 ? a.Z : 0, split: SPLIT_BY_N[a.sp] || 'sphere', split_idx: q,
          split_axis: a.ax || [0, 0, 1], z_init: 2.0,
          split_fix: qp.get('sfix') === '0' ? false : true }));
        targets.push(1); labels.push(a.el + '.' + q);
      }
    }
  });
  // THE DISPLACEMENT METRIC. SigmaF is a force residual: symmetry-cancelled for symmetric
  // molecules (CO2 and CH4 read ~0 whatever the accuracy), mesh-unconverged, and in arbitrary
  // units. Displacement from the OBSERVED geometry under released kernels has none of those
  // defects -- it is a length, in the units the model claims to predict, and it is NOT
  // symmetry-protected: CO2 can contract symmetrically with SigmaF staying exactly zero while
  // every bond is wrong. Reported as radial (% of each bond) and angular (degrees) SEPARATELY,
  // because the two are in different accuracy classes: ~1% on water's angle against ~41% on H2's
  // bond length. Requires ?dyn=1; with the kernels held every displacement is identically zero.
  //   kernelOf[a] = the domain carrying atom a's charge. Split siblings share a site but are
  //   separate domains that dynamics can move apart, so the atom's position is the kernel's.
  var kernelOf = [], kd = 0;
  M.atoms.forEach(function (at, ai) { kernelOf[ai] = kd; kd += (at.sp || 1); });
  var startPos = kernelOf.map(function (d) {
    return [nuclei[d].i, nuclei[d].j, nuclei[d].k];
  });
  // bonds = pairs closer than 3.2 a0 in the OBSERVED geometry, with the angle at every atom
  // carrying two or more of them
  function posAU(idx, live) {
    var n = live ? (window._nuclei && window._nuclei[kernelOf[idx]]) : null;
    var p = n ? [n.i, n.j, n.k] : startPos[idx];
    return [p[0]*h, p[1]*h, p[2]*h];
  }
  function dist(u, v) { var d=0; for (var c=0;c<3;c++) d += (u[c]-v[c])*(u[c]-v[c]); return Math.sqrt(d); }
  // Bonded if d < 1.3*(r_cov_i + r_cov_j), covalent radii in a0. A FLAT cutoff cannot work: it
  // either counts water's non-bonded H-H (2.8605 a0) as a bond -- which then generates spurious
  // O-H-H angles of 37.75 deg -- or it misses H2's genuine H-H at 1.40. The radius sum separates
  // them: 1.3*(0.59+0.59) = 1.53, above H2's bond and below water's H...H gap.
  var RCOV = { H: 0.59, C: 1.44, N: 1.34, O: 1.25 };
  var bonds = [], nbr = M.atoms.map(function () { return []; });
  for (var bi = 0; bi < M.atoms.length; bi++)
    for (var bj = bi+1; bj < M.atoms.length; bj++) {
      var d0 = dist(posAU(bi,false), posAU(bj,false));
      var lim = 1.3 * ((RCOV[M.atoms[bi].el] || 1.3) + (RCOV[M.atoms[bj].el] || 1.3));
      if (d0 < lim) { bonds.push([bi,bj,d0]); nbr[bi].push(bj); nbr[bj].push(bi); }
    }
  var angles = [];
  M.atoms.forEach(function (at, ai) {
    for (var x = 0; x < nbr[ai].length; x++)
      for (var y = x+1; y < nbr[ai].length; y++) angles.push([nbr[ai][x], ai, nbr[ai][y]]);
  });
  function angleAt(tri, live) {
    var A=posAU(tri[0],live), B=posAU(tri[1],live), C=posAU(tri[2],live), u=[],v=[];
    for (var c=0;c<3;c++) { u.push(A[c]-B[c]); v.push(C[c]-B[c]); }
    var du=Math.sqrt(u[0]*u[0]+u[1]*u[1]+u[2]*u[2]), dv=Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
    var dot=(u[0]*v[0]+u[1]*v[1]+u[2]*v[2])/(du*dv);
    return Math.acos(Math.max(-1,Math.min(1,dot))) * 180/Math.PI;
  }
  var angles0 = angles.map(function (t) { return angleAt(t,false); });

  // V_KK by hand on the built geometry -- the one check nothing can satisfy accidentally
  var vkkExp = 0;
  for (var a = 0; a < M.atoms.length; a++)
    for (var b = a + 1; b < M.atoms.length; b++) {
      var A1 = M.atoms[a], B1 = M.atoms[b];
      var d = Math.sqrt(Math.pow(A1.x-B1.x,2) + Math.pow(A1.y-B1.y,2) + Math.pow(A1.z-B1.z,2));
      if (d > 0) vkkExp += A1.Z * B1.Z / d;
    }

  window.USER_NN = N;
  window.USER_SCREEN = box;
  window.USER_NUCLEI = nuclei;
  window.USER_NORM_TARGETS = targets;
  window.USER_WEIGHTED_DENSITY = true;    // the consistent functional: every term weighted by w
  // KINETIC TERM: w-WEIGHTED (default here) or CUT OFF at a w threshold.
  //   ?wkinw=0          use the GATE instead of w-weighting
  //   ?wkingate=<t>     the threshold; mol_fast inherits 0.1 from h2o.js, the ORIGINAL p5 uses 0.5
  // mol_fast.js:153 is explicit that this is not cosmetic: "on a DIFFUSE w the choice decides how
  // many interface cells pay kinetic cost, which is exactly what sets a bond length". A HIGHER
  // threshold means fewer interface cells pay, less kinetic energy, more binding, shorter bond.
  // 0.5 is worth testing because it is the p5 value -- an independent, pre-existing choice, and p5
  // is the construction that gave H2 ~ -1.17. Searching for a value that fits would be a FIT;
  // testing one chosen elsewhere is not.
  window.USER_W_KIN_WEIGHT = qp.get('wkinw') !== '0';
  if (qp.get('wkingate')) window.USER_W_KIN_GATE = parseFloat(qp.get('wkingate'));
  // KERNEL SOFTENING, eps = SOFT*h. This was hard-coded to 1 with no recorded reason, overriding
  // mol_fast's own default of 2. But the collapse criterion is Z*h/c <~ 0.1 with eps = c*h, and at
  // h = 0.14 that gives Z*h/c = 0.42 for O+3 and 0.56 for C+4 -- 4 to 6 times INSIDE the collapse
  // regime. h2o_mol.html sets soft = ceil(Z_max*h/0.1) for exactly this reason, its header noting
  // that getting it wrong is what left ClO2 with a monotone E(R) and no minimum at all.
  // ?soft= overrides; ?soft=auto applies the criterion from the deepest kernel actually present.
  var zMax = Math.max.apply(null, nuclei.map(function (q) { return q.Z; }).concat([1]));
  // MEASURED 2026-11-04: SigmaF is monotone in the ABSOLUTE softening length eps = SOFT*h, and
  // is NOT monotone in Z*h/c -- six water runs collapse onto one curve in eps (0.140 -> 0.471,
  // 0.175 -> 0.394, 0.280 -> 0.375, 0.420 -> 0.229, 0.700 -> 0.177, 0.980 -> 0.160) with no
  // feature at the Z*h/c = 0.1 criterion. So eps is the quantity to control:
  //   ?eps=<a0>  fixes the softening LENGTH, setting SOFT = eps/h. Required for any comparison
  //              across molecules (whose boxes and therefore h differ) or across meshes -- with
  //              SOFT held fixed instead, refining h silently sharpens the kernel and the ladder
  //              measures eps rather than h.
  //   ?soft=     fixes the MULTIPLE, so eps rides on h. This is the shipped default (soft=1).
  //              NOTE it does NOT spoil the published table: hTarget is pinned at 0.14, so h spans
  //              only 0.1389-0.1413 across the sixteen molecules (1.7%), which moves SigmaF by
  //              ~0.8% -- the table is a valid comparison at eps ~ 0.14. What it cannot support is
  //              an ABSOLUTE value, since water's SigmaF runs 0.16 to 0.62 over eps 0.98 to 0.08.
  var softQ = qp.get('soft'), epsQ = qp.get('eps');
  window.USER_SOFT = epsQ ? (parseFloat(epsQ) / h)
                   : (softQ === 'auto') ? Math.max(1, Math.ceil(zMax * h / 0.1))
                   : (softQ ? parseFloat(softQ) : 1);
  // R_init caps each domain's INITIAL territory at 3.0 au from its own nucleus, leaving everything
  // beyond unowned (w = 0 for every domain) -- permanently, since neither u nor w can move first
  // into it, so amplitude leaking there steals normalisation from the core.
  //
  // MEASURED 2026-11-04, H2 at h=0.10, eps=h, consistent scheme, ONLY R_init varied:
  //     rinit=3.0  E=-1.134067  bond +28.3%
  //     rinit=4.5  E=-1.138203  bond +28.2%
  // i.e. 0.004 Ha and 0.1 percentage points. **THE HALO IS A MINOR EFFECT HERE.**
  // mol_fast.js:1354 attributes V_eK +0.165 and E +0.127 Ha to it, but that figure comes from
  // comparing mol_fast against the ORIGINAL P5, which differs in far more than R_init -- p5 imposes
  // a hard symmetric midplane where mol_fast evolves a free front -- so the whole scheme difference
  // was charged to the halo. The direct ladder the comment itself asks for gives 30x less.
  // ?rinit= DEFAULT LEFT AT THE INHERITED 3.0 deliberately: changing it would silently shift every
  // number measured against the old behaviour, including the sixteen-molecule table. Pass
  // ?rinit=<au> to test, e.g. half the box to cover it.
  window.USER_R_INIT = parseFloat(qp.get('rinit') || '3.0');
  // ?wdiff= interface sharpness. With weighted density + weighted kinetic term this is a
  // CONVERGENCE parameter, not a fitted one -- sharpening w approaches the true disjoint-domain
  // problem (mol_fast.js:183). Default 0.05 is inherited, and no ladder has ever been run on it.
  if (qp.get('wdiff')) window.USER_W_DIFF = parseFloat(qp.get('wdiff'));
  // ?wfloor= the one w cut-off that touches the DYNAMICS (mol_fast.js:412, inside the w-update):
  //   if (nw < W_FLOOR && w_max_other > 0.5) nw = 0
  // Default 0, i.e. no cut-off at all -- w is only clamped non-negative. It exists because the
  // diffusion term smears a residue behind a RETREATING front which advection later regrows, seen
  // directly as a charge seeded inside the Li+ core being expelled and then reappearing. Not to be
  // confused with W_KIN_GATE (0.1), which thresholds w for the kinetic ENERGY only and is measured
  // to leave geometry and forces bit-identical.
  if (qp.get('wfloor')) window.USER_W_FLOOR = parseFloat(qp.get('wfloor'));
  // ?udecay= clears the FROZEN RESIDUE. Where w = 0 every term of the u update is gated to zero,
  // so u is "FROZEN at whatever the initial seed left -- not relaxed, just stationary"
  // (mol_fast.js:270), and with wd=0 that stale density is counted as real charge: "it is the sense
  // in which this solver's domains OVERLAP while the model's do not". U_DECAY multiplies the
  // amplitude by (1-d) each step wherever w < 0.5, so non-overlap holds for the DENSITY and not
  // only for the occupancy. Default 0 because every page here was tuned with the residue present.
  // p5 achieves the same end differently: it ZEROES u outside each domain at initialisation.
  if (qp.get('udecay')) window.USER_U_DECAY = parseFloat(qp.get('udecay'));
  // ?uzero=1 is p5's ACTUAL mechanism, and mol_fast.js:150 says so: "zero u outside its own
  // Voronoi cell AT INITIALISATION, as the original p5 solver does".
  // WHY IT IS THE RIGHT MIMIC. p5 never has to choose between u^2 and u^2*w, because confining the
  // amplitude makes them IDENTICAL -- u = 0 wherever w = 0. The choice only arises in mol_fast
  // because its u is frozen at the seed outside its territory, so the density must be weighted to
  // avoid counting that residue, and weighting is what introduces the partial-weight interface
  // kinetic term. Confine u and the question disappears.
  if (qp.get('uzero')) window.USER_U_ZERO_INIT = true;
  // ?wd=0 switches the density from u^2*w back to u^2 -- p5's choice (its Poisson source is
  // 2*PI*dt*u^2 with no w factor, and its normalisation is over u^2). Only meaningful together
  // with udecay, since wd=0 alone reinstates the overlap p5 does not have.
  if (qp.get('wd') === '0') window.USER_WEIGHTED_DENSITY = false;
  // ?wadv= FRONT SPEED. mol_fast's default 1 "makes the front crawl ... the u-field then
  // equilibrates at essentially fixed territory and the geometry is the last thing to settle,
  // which is the WRONG ORDER for a free-boundary problem" (mol_fast.js:250). The original p5 uses
  // advection 10 with diffusion 2, where mol_fast ships 1 with 0.05 -- so p5's territory and
  // amplitude settle together, as a free-boundary problem should.
  // STABILITY IS MEASURED AND TIGHT: W_ADV=2 conserves charge, 4 at diff=0.1 diverged, 10 ended
  // with 4.3 and 5.3 units of charge instead of 3. But that test paired high advection with LOW
  // diffusion; p5 pairs it with HIGH diffusion, which damps the front. The file's own prescription
  // is "keep W_ADV at a few, raise W_DIFF to damp the front instead, and ALWAYS check charge
  // conservation -- q_u per domain must come back at its target".
  if (qp.get('wadv')) window.USER_W_ADV = parseFloat(qp.get('wadv'));
  window.USER_FORCE_VOLUME = true;        // volume integral, not the point gradient
  window.USER_DYNAMICS = !!qp.get('dyn');
  window.USER_STEPS = parseInt(qp.get('steps') || '120000', 10);
  // Smaller plots: the default 620 px canvas plus a 220x280 3D view crowds the readout panel.
  // ?px= overrides. Defaults in mol_fast.js are untouched, so other pages are unaffected.
  window.USER_CANVAS_PX = parseInt(qp.get('px') || '336', 10);
  // the 3D view is drawn inside the scaled frame, so leave it at its native size
  // and let the frame scaling shrink it along with everything else.

  // picker
  var sel = '<select id="mol" onchange="location.search=\'?mol=\'+this.value">';
  Object.keys(MOLS).forEach(function (k) {
    sel += '<option value="' + k + '"' + (k === key ? ' selected' : '') + '>' + MOLS[k].name + '</option>';
  });
  document.getElementById('picker').innerHTML = sel + '</select>';
  document.getElementById('geom').innerHTML =
    M.atoms.length + ' atoms / ' + nuclei.length + ' domains, ' + M.nelec + ' electrons &middot; Z=[' +
    M.atoms.map(function (a) { return a.el + a.Z; }).join(' ') + ']<br>' +
    'box ' + box + ' a<sub>0</sub>, n=' + N + ', h=' + h.toFixed(4) +
    ' &middot; extent ' + M.ext.toFixed(2) + ' a<sub>0</sub>' +
    (nuclei.length > 16 ? ' <b style="color:#f66">exceeds the 16-domain cap</b>' : '');

  var t0 = Date.now();
  // CHARGE CONSERVATION. readDomainCentroids is async and returns q_u (what the solver normalises)
  // and q_uw (the charge inside the domain's own territory). With WEIGHTED_DENSITY the density IS
  // u^2*w and normalisation enforces int u^2 w = target, so q_uw should return AT its target; a
  // drift means the front has broken the partition, and the file notes these failures "announce
  // themselves there long before the picture looks wrong".
  var qReport = '';
  setInterval(function () {
    // q_uw lives in readDomainProfiles, NOT readDomainCentroids -- I called the wrong one and
    // got q=[?,?]. The field is at mol_fast.js:1968, inside the profiles readback.
    if (typeof window.readDomainProfiles !== 'function') return;
    window.readDomainProfiles().then(function (out) {
      var arr = Array.isArray(out) ? out : (out && out.domains) || (out && out.profiles);
      if (!arr || !arr.length) { qReport = ' q=unavailable'; return; }
      var bad = 0, parts = [];
      // q_u is what the solver NORMALISES and is the conservation check the source demands
      // ("q_u per domain must come back at its target"). q_uw is the charge inside the domain's
      // OWN TERRITORY, which is legitimately < target whenever u extends beyond w -- and it does,
      // since the u-update's flux carries face-averaged w and so pushes amplitude into the first
      // cell outside. Claes observed exactly this in p5: u fills the vacuum while w keeps the gap.
      // Flagging on q_uw therefore reports a normal feature as a failure; only q_u can fail.
      arr.forEach(function (d, di) {
        var tgt = targets[di], q = d.q_u, qw = d.q_uw;
        if (q !== undefined && Math.abs(q - tgt) > 0.02 * Math.max(1, tgt)) bad++;
        parts.push((q === undefined ? '?' : q.toFixed(3))
                   + '/' + (qw === undefined ? '?' : qw.toFixed(3)));
      });
      qReport = ' q_u/q_uw=[' + parts.join(' ') + ']' + (bad ? ' CHARGE_DRIFT=' + bad : '');
    }).catch(function () {});
  }, 6000);
  setInterval(function () {
    var ls = document.getElementById('loadStatus');
    if (ls && document.getElementById('defaultCanvas0')) ls.style.display = 'none';
    var F = window.nucForce, rows = '', sx = 0, sy = 0, sz = 0, fmax = 0;
    if (F) {
      for (var a = 0; a < nuclei.length; a++) {
        var f = F[a] || [0,0,0], m = Math.sqrt(f[0]*f[0]+f[1]*f[1]+f[2]*f[2]);
        sx += f[0]; sy += f[1]; sz += f[2]; fmax = Math.max(fmax, m);
        rows += '<tr><td>' + labels[a] + '</td><td align=right>' + m.toFixed(5) + '</td></tr>';
      }
    }
    // DISPLACEMENT FROM THE OBSERVED GEOMETRY -- the measure of success, reported as a length.
    var maxRad = 0, maxAng = 0;
    function geomReport() {
      if (!window._nuclei) return '';
      if (!qp.get('dyn')) return '<br><span style="color:#789;font-size:10.5px">nuclei held'
        + ' &mdash; displacement is zero by construction; add ?dyn=1 to measure it</span>';
      var rows = '';
      bonds.forEach(function (b) {
        var d = dist(posAU(b[0],true), posAU(b[1],true)), pc = 100*(d-b[2])/b[2];
        maxRad = Math.max(maxRad, Math.abs(pc));
        rows += M.atoms[b[0]].el + '&ndash;' + M.atoms[b[1]].el + ' ' + d.toFixed(4)
             + ' vs ' + b[2].toFixed(4) + ' (<b style="color:'
             + (Math.abs(pc) < 2 ? '#6c6' : Math.abs(pc) < 10 ? '#fc6' : '#f66') + '">'
             + (pc>=0?'+':'') + pc.toFixed(1) + '%</b>)<br>';
      });
      angles.forEach(function (t, ti) {
        var a1 = angleAt(t,true), da = a1 - angles0[ti];
        maxAng = Math.max(maxAng, Math.abs(da));
        rows += M.atoms[t[0]].el + '&ndash;' + M.atoms[t[1]].el + '&ndash;' + M.atoms[t[2]].el
             + ' ' + a1.toFixed(2) + '&deg; vs ' + angles0[ti].toFixed(2) + '&deg; (<b style="color:'
             + (Math.abs(da) < 2 ? '#6c6' : Math.abs(da) < 10 ? '#fc6' : '#f66') + '">'
             + (da>=0?'+':'') + da.toFixed(2) + '&deg;</b>)<br>';
      });
      return '<br><b>displacement from observed</b><br><span style="font-size:10.5px">'
        + rows + '</span>';
    }
    // AXIAL FORCE for a diatomic -- the integrand of E_bind = int F dR, i.e. the component that
    // changes the separation:  F_R = (F2 - F1).e / 2,  e the bond unit vector.
    // SIGN: F_R > 0 pushes the atoms APART (net repulsion), F_R < 0 pulls them TOGETHER.
    // So the work to dissociate is  E_bind = -int_{Re}^{inf} F_R dR, positive for a bound molecule.
    // Using (F2-F1)/2 rather than one atom's force cancels any spurious NET force on the pair,
    // which matters: mol_fast_h2_scan.html carries a constant ~0.05 Ha/bohr offset with 42-91%
    // per-atom asymmetry, and that page's forces are unusable because of it.
    var fax = null;
    if (M.atoms.length === 2 && F && F[0] && F[1]) {
      var p0 = posAU(0, !!qp.get('dyn')), p1 = posAU(1, !!qp.get('dyn')), e = [], L = 0;
      for (var c = 0; c < 3; c++) { e.push(p1[c] - p0[c]); L += e[c]*e[c]; }
      L = Math.sqrt(L);
      if (L > 0) {
        fax = 0;
        for (var c2 = 0; c2 < 3; c2++) fax += (F[1][c2] - F[0][c2]) * (e[c2]/L);
        fax /= 2;
      }
    }
    var fs = Math.sqrt(sx*sx + sy*sy + sz*sz);
    var rel = fmax > 0 ? 100 * fs / fmax : 0;
    // V_KK against exact arithmetic on the geometry ACTUALLY BUILT. With the kernels released the
    // reference must be recomputed from their CURRENT positions -- comparing a relaxed V_KK against
    // the starting geometry flagged a red MISMATCH on every dynamics run, which is a false alarm
    // that discredits a check that in fact passes exactly (H2 held: 0.7141 vs 0.71414).
    var vkk = window._E_KK, vkkRef = vkkExp;
    if (qp.get('dyn') && window._nuclei) {
      vkkRef = 0;
      for (var p1 = 0; p1 < M.atoms.length; p1++)
        for (var p2 = p1 + 1; p2 < M.atoms.length; p2++) {
          var d2 = dist(posAU(p1, true), posAU(p2, true));
          if (d2 > 0) vkkRef += M.atoms[p1].Z * M.atoms[p2].Z / d2;
        }
    }
    var vok = (vkk !== undefined) && Math.abs(vkk - vkkRef) < 1e-3 * Math.max(1, vkkRef);
    document.getElementById('checks').innerHTML =
      '<table style="font-size:11px"><tr><th align=left>atom</th><th>|F|</th></tr>' + rows + '</table>'
      + '<b>&Sigma;F</b> = ' + fs.toFixed(6) + '  (<b style="color:'
      + (rel < 5 ? '#6c6' : rel < 20 ? '#fc6' : '#f66') + '">' + rel.toFixed(1) + '%</b> of |F|max)'
      + '<br><span style="color:' + SYMNOTE[SYM[key]][1] + ';font-size:10.5px" title="'
      + SYMNOTE[SYM[key]][2] + '">&#9432; ' + SYMNOTE[SYM[key]][0] + '</span>'
      + '<br>V<sub>KK</sub> ' + (vkk === undefined ? '—' : vkk.toFixed(5))
      + ' vs exact ' + vkkRef.toFixed(5)
      + (qp.get('dyn') ? ' <span style="color:#789">(current geometry)</span>' : '')
      + ' <b style="color:' + (vok ? '#6c6' : '#f66') + '">' + (vok ? 'OK' : 'MISMATCH') + '</b>'
      + '<br>E = ' + (window._E === undefined ? '—' : window._E.toFixed(6))
      + geomReport();
    document.title = 'MOLSIM ' + key + ' t=' + ((Date.now()-t0)/1000).toFixed(0) + 's'
      + ' step=' + (window._tStep === undefined ? '?' : window._tStep)
      + ' E=' + (window._E === undefined ? 'n/a' : window._E.toFixed(6))
      + ' Fsum=' + fs.toFixed(6) + ' (' + rel.toFixed(1) + '%)'
      + (fax !== null ? ' Fax=' + (fax>=0?'+':'') + fax.toFixed(6) + ' R=' + L.toFixed(4) : '')
      + ' VKK=' + (vkk === undefined ? 'n/a' : vkk.toFixed(4)) + '/' + vkkRef.toFixed(4)
      // TERM BY TERM, so a difference against another implementation can be localised to one
      // integral rather than inferred from the total. p5 prints [T, Vee+VeK, VKK] and Vee, so
      // VeK = (Vee+VeK) - Vee recovers its fourth term and all four are comparable.
      + (window._E_T !== undefined ? ' [T=' + window._E_T.toFixed(4)
          + ' VeK=' + window._E_eK.toFixed(4)
          + ' Vee=' + window._E_ee.toFixed(4)
          + ' VKK=' + window._E_KK.toFixed(4) + ']' : '')
      + (qp.get('dyn') ? ' dR=' + maxRad.toFixed(1) + '% dAng=' + maxAng.toFixed(2) + 'deg' : '')
      + ' soft=' + window.USER_SOFT.toFixed(2) + ' eps=' + (window.USER_SOFT*h).toFixed(3)
      + ' rinit=' + window.USER_R_INIT + ' wdiff=' + (window.USER_W_DIFF !== undefined ? window.USER_W_DIFF : 0.05)
      + ' wkinw=' + (window.USER_W_KIN_WEIGHT ? 1 : 0)
      + ' wkingate=' + (window.USER_W_KIN_GATE !== undefined ? window.USER_W_KIN_GATE : 0.1)
      + ' wfloor=' + (window.USER_W_FLOOR !== undefined ? window.USER_W_FLOOR : 0)
      + ' wadv=' + (window.USER_W_ADV !== undefined ? window.USER_W_ADV : 1)
      + ' wd=' + (window.USER_WEIGHTED_DENSITY ? 1 : 0)
      + ' udecay=' + (window.USER_U_DECAY !== undefined ? window.USER_U_DECAY : 0)
      + ' uzero=' + (window.USER_U_ZERO_INIT ? 1 : 0) + qReport
      + ' | n=' + N + ' box=' + box + ' h=' + h.toFixed(4) + ' nat=' + M.atoms.length + ' ndom=' + nuclei.length;
  }, 1500);
})();

// BOTH solvers define setup()/draw() for p5 and sit inert until p5 drives them, so p5 must load
// AFTER the solver. A plain <script src> for the solver alone yields no canvas, no iteration and
// no energies -- silently, with the page looking fine. Made this mistake twice in one session.
var s = document.createElement('script');
s.src = 'mol_fast.js?t=' + Date.now();
s.onload = function () {
  var p = document.createElement('script');
  p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
  document.body.appendChild(p);
};
document.body.appendChild(s);
</script>
</body></html>
