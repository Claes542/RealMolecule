<!DOCTYPE html>
<html><head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>CH4 — mol_fast (C non-split, Z=4, target=4)</title>
  <style>body { margin: 0; background: #000; }</style>
</head><body>
<div id="loadStatus" style="color:#ff0;font-family:monospace;padding:20px;font-size:14px">HTML loaded, fetching solver…</div>
<script>
  window.onerror = function(msg, url, line, col, err) {
    var pre = document.createElement('pre');
    pre.style.cssText = 'color:#f66;background:#200;padding:12px;font-size:13px;white-space:pre-wrap';
    pre.textContent = 'ERROR: ' + msg + '\n  at ' + url + ':' + line + ':' + col +
      (err && err.stack ? '\n\n' + err.stack : '');
    document.body.insertBefore(pre, document.body.firstChild);
  };
  (function() {
    var N = 200;
    var urlScr = parseFloat(new URLSearchParams(location.search).get('scr'));
    var scr = isFinite(urlScr) ? urlScr : 12;
    var h = scr / N;
    var N2 = Math.round(N / 2);

    // CH4 tetrahedral: C-H = 2.054 au (1.087 Å), all H-C-H = 109.47°
    // Override bond via URL: ?bond=4.108 for dissociated reference
    var urlBond = parseFloat(new URLSearchParams(location.search).get('bond'));
    var bond = isFinite(urlBond) ? urlBond : 2.054;
    // Rotated tetrahedron: H1 along +x (in slice + line plot),
    //   H2 in xy-plane (in slice), H3 and H4 at ±z (only in 3D view).
    var ci = N2, cj = N2, ck = N2;   // C at grid center
    function shift(dx, dy, dz) {
      return { i: Math.round(ci + dx*bond/h), j: Math.round(cj + dy*bond/h), k: Math.round(ck + dz*bond/h) };
    }
    var s2 = Math.sqrt(2), s6 = Math.sqrt(6);
    // ?perturb=<deg>  SEED THE HYDROGENS OFF TETRAHEDRAL.
    // Starting at 109.47 and staying there demonstrates nothing -- the answer is then the
    // initial condition, and a symmetric seed is preserved by symmetry. To show the tetrahedron
    // is a RESULT, displace the H's and let the nuclear dynamics relax them back. perturb=0
    // recovers the original exact-tetrahedral seed.
    var pert = parseFloat(new URLSearchParams(location.search).get('perturb'));
    if (!isFinite(pert)) pert = 0;
    var pr = pert * Math.PI / 180;
    // squash two H's toward each other and splay the other two, preserving the C-H length:
    // a pure angular perturbation, so any recovery is angular and not a bond-length artefact.
    function rot(v, a) {   // rotate in the plane spanned by v and the squash axis
      var n = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
      var cx = Math.cos(a), sx = Math.sin(a);
      return [ (v[0]*cx - v[1]*sx), (v[0]*sx + v[1]*cx), v[2] ];
    }
    var d1 = rot([ 1,       0,      0    ],  pr);
    var d2 = rot([-1/3,  2*s2/3,    0    ], -pr);
    var d3 = rot([-1/3,   -s2/3,  s6/3   ],  pr);
    var d4 = rot([-1/3,   -s2/3, -s6/3   ], -pr);
    var h1 = shift(d1[0], d1[1], d1[2]);
    var h2 = shift(d2[0], d2[1], d2[2]);
    var h3 = shift(d3[0], d3[1], d3[2]);
    var h4 = shift(d4[0], d4[1], d4[2]);
    window._ch4seed = { perturb: pert, bond: bond, h: h };

    window.USER_NN = N;
    window.USER_SCREEN = scr;
    window.USER_STEPS = 100000;
    window.USER_NUCLEI = [
      { i: ci,   j: cj,   k: ck,   Z: 4, rc: 0.5 },  // C pseudo (Z=4, 4 valence in one orbital)
      { i: h1.i, j: h1.j, k: h1.k, Z: 1, rc: 0.0 },
      { i: h2.i, j: h2.j, k: h2.k, Z: 1, rc: 0.0 },
      { i: h3.i, j: h3.j, k: h3.k, Z: 1, rc: 0.0 },
      { i: h4.i, j: h4.j, k: h4.k, Z: 1, rc: 0.0 },
    ];
    window.USER_NORM_TARGETS = [4, 1, 1, 1, 1];  // C 4-electron orbital + 4× H singly-occupied = 8 valence e-
    // TF skipped per user — accept overbinding for non-split multi-occupancy
    window.USER_ALPHA_TF = 0;
    // Enable nuclear dynamics so force arrows display (press D to toggle later)
    window.USER_DYNAMICS = true;
  })();

  var status = document.getElementById('loadStatus');
  var s = document.createElement('script');
  s.src = 'mol_fast.js?t=' + Date.now();
  s.onload = function() {
    status.textContent += '\nmol_fast.js loaded';
    var p = document.createElement('script');
    p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
    p.onload = function() { status.textContent += '\np5.js loaded — simulation should start'; };
    p.onerror = function() { status.textContent += '\nFAILED to load p5.js'; status.style.color = '#f44'; };
    document.body.appendChild(p);
  };
  s.onerror = function() { status.textContent += '\nFAILED to load mol_fast.js'; status.style.color = '#f44'; };
  document.body.appendChild(s);
</script>

<script>
// Six H-C-H angles from the LIVE nuclear positions, so the tetrahedral angle is measured
// as an output rather than read back from the seed. Exact tetrahedral = 109.4712 deg.
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('angles') !== '1') return;
  var seed = window._ch4seed || {};
  function angles() {
    // mol_fast.js publishes window._nuclei (objects with grid indices i,j,k) -- there is no
    // nucPos array. Angles are scale-free so grid units need no conversion.
    var P = window._nuclei;
    if (!P || P.length < 5) return null;
    var c = P[0], out = [];
    function v(a) { return [P[a].i-c.i, P[a].j-c.j, P[a].k-c.k]; }
    for (var a = 1; a <= 4; a++) for (var b = a+1; b <= 4; b++) {
      var u = v(a), w = v(b);
      var d = u[0]*w[0]+u[1]*w[1]+u[2]*w[2];
      var nu = Math.sqrt(u[0]*u[0]+u[1]*u[1]+u[2]*u[2]);
      var nw = Math.sqrt(w[0]*w[0]+w[1]*w[1]+w[2]*w[2]);
      out.push(Math.acos(Math.max(-1, Math.min(1, d/(nu*nw)))) * 180/Math.PI);
    }
    return out;
  }
  setInterval(function () {
    var a = angles(); if (!a) return;
    var mean = a.reduce(function(x,y){return x+y;},0)/a.length;
    var dev  = Math.max.apply(null, a.map(function(x){return Math.abs(x-109.4712);}));
    var rec = { perturb: seed.perturb, angles: a.map(function(x){return +x.toFixed(2);}),
                mean: +mean.toFixed(3), maxDev: +dev.toFixed(3), E: window._E,
                step: window._tStep,
                pos: window._nuclei.slice(0,5).map(function(n){
                       return [+n.i.toFixed(2), +n.j.toFixed(2), +n.k.toFixed(2)]; }) };
    try { localStorage.setItem('ch4_angles_p' + seed.perturb, JSON.stringify(rec)); } catch (e) {}
    document.title = 'CH4 p=' + seed.perturb + ' mean=' + mean.toFixed(2)
                   + ' maxdev=' + dev.toFixed(2);
  }, 2000);
})();
</script>
</body></html>
