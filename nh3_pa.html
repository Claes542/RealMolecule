<!DOCTYPE html>
<html><body style="margin:0;background:#000;color:#ddd;font-family:monospace">
<pre id="log">NH3 proton affinity — building…</pre>
<script>
// ===========================================================================
//  NH3 PROTON AFFINITY -- the cheap calibration system.
//
//     PA = E(NH3) - E(NH4+)        experiment: 204 kcal/mol = 0.325 Ha
//
//  Four atoms against pyridine's eleven, the same nitrogen acceptor, the same
//  bare-proton construction proton_transfer_nh3.html already uses (Z=0 with
//  Z_nuc=1). Both runs carry the same electron count and differ by one kernel.
//
//  Variants, to separate the hypotheses that pyridine could not:
//    zn=3  (default)  N as the house reduced map: 3 electrons, 3 bonds, no lone pair
//    zn=5             full valence: core 1s^2 in the kernel, 5 valence electrons
//    split=1          N as FOUR tetrahedral lobes -- 3 toward the H's, 1 free.
//                     This is the direct analogue of the 3-split water model
//                     (2 lobes to the H's, 1 lone pair) that gives 99% of the
//                     measured dipole. Needs zn=4.
//    sic=1            lobes share a group: siblings do not repel.
//                     NOTE: on the pyridine evidence and the pair-counting
//                     argument, siblings SHOULD repel -- three unit charges give
//                     three pairs, each counted once by the i != j sum, and there
//                     is nothing to double count. sic=1 is here to be refuted,
//                     not assumed.
// ===========================================================================
window.onerror = function(m,u,l){ var e=document.getElementById('log'); if(e) e.textContent += '\nERROR: '+m+' ('+l+')'; };
window.addEventListener('unhandledrejection', function(e){ var el=document.getElementById('log'); if(el) el.textContent += '\nGPU REJECTED: '+(e.reason&&e.reason.message||e.reason); });

var q = location.search;
// what=natom | hatom : the isolated fragments, for the ATOMIZATION energy
//     E_atz = E(N) + 3 E(H) - E(NH3)
// This is the quantity the multi-occupancy correction was diagnosed from: NH3's binding comes out
// 2.22x too large, and missing intra-atomic repulsion over-binds. It is also where the correction
// CAN act, unlike the proton affinity -- there nitrogen sits on both sides with the same Z_eff=3
// domain, so its restored repulsion cancels. Here the nitrogen domain goes from a free sphere to
// one distorted toward three hydrogens, which is a large shape change and does not cancel.
// Fragments are computed in the SAME box at their molecular positions, so the grid is common.
var WHAT  = (q.match(/[?&]what=(nh4|nh3|natom|hatom)/) || [])[1] || 'nh3';
var ZN    = parseInt((q.match(/[?&]zn=(\d)/) || [])[1] || '3', 10);
var SPLIT = /[?&]split=1/.test(q);
// spl=<n> : split nitrogen's valence into n SEPARATE one-electron domains instead of one -n blob.
// This is the clean RealQM answer to the self-repulsion question: n unit charges on non-overlapping
// supports give n(n-1)/2 pairs, each counted once by the i!=j rule -- exact, with no ad hoc (Z-1)/Z
// factor and no kinetic fudge. Precedent: 3-split oxygen gave H2O a dipole of 1.836 D against
// 1.85 experimental. n=3 uses splitType 'third' (3-fold azimuthal about the C3 axis, one lobe per
// N-H bond), n=2 uses 'hemi', n=4 uses 'tetra'. Siblings are NOT grouped: they are genuine separate
// electrons and must repel each other, so shared-SIC is left off.
var SPL = parseInt((q.match(/[?&]spl=(\d)/) || [])[1] || '0', 10);
var SIC   = /[?&]sic=1/.test(q);
var STEPS = parseInt((q.match(/[?&]steps=(\d+)/) || [])[1] || '4000', 10);
// sym=1 : the T_d-symmetric NH4+. Built as NH3 + a bare proton, three hydrogens own a domain and
// the fourth does not, so the four bonds are inequivalent BY CONSTRUCTION and the symmetry that
// makes NH4+ the cleanest test in this family is thrown away. Take the missing electron from
// NITROGEN instead: N with 4 electrons on a +5 kernel, four ordinary H. Then all four bonds are
// identical, the four nitrogen lobes are equivalent by symmetry -- which is a CONTROL, since any
// difference between them is numerical error -- and both sides of the proton affinity carry the
// same 8 electrons.
//    NH4+  N Z=4 kernel +5, 4H Z=1  -> 8 electrons, 9 kernel, charge +1, T_d
//    NH3   N Z=5 kernel +5, 3H Z=1  -> 8 electrons, 8 kernel, neutral
var SYM = /[?&]sym=1/.test(q);
if (SYM) { ZN = (WHAT === 'nh4') ? 4 : 5; }
// shr=<R> : HOMOGENISED SHELL. Nitrogen keeps its +3 kernel clamped at r_c but its three valence
// electrons stop being a relaxing DOMAIN and become a fixed -3 charge smeared uniformly over a
// sphere of radius R. By Newton's theorem the pair is exactly neutral outside R and a bare +3
// kernel inside it, so any binding must come from hydrogen charge that PENETRATES the shell.
//
// The point is what it removes. Every proton-affinity run so far let nitrogen's domain relax, and
// it relaxes DIFFERENTLY in NH3 than in NH4+ -- that shape change is the one error the user's
// cancellation argument does NOT cover, since the clamp and the core are identical on both sides
// but the shape is not. Freezing nitrogen makes it literally the same object in both molecules,
// so it cannot contribute to the difference at all. What is left is the hydrogens and the proton.
// Cost drops too: 3 electrons instead of 6, since nitrogen no longer carries domains.
var SHR = parseFloat((q.match(/[?&]shr=([\d.]+)/) || [])[1] || '0');
var SHELL = SHR > 0;
// shq=<q> : shell charge, default = the kernel charge so the atom is neutral outside R.
// For NH4+ the bare-proton construction cannot be tetrahedral -- three electrons over four
// equivalent protons is asymmetric BY CONSTRUCTION, and the run reports a 5.36 D dipole where
// T_d demands exactly zero. Booking the cation as shell -2 with four ordinary hydrogens keeps
// the same six valence electrons, keeps nitrogen frozen, and restores T_d.
// hom=1 : nitrogen's charge is homogenised inside its own FREE DOMAIN, not smeared into a fixed
// external potential. The difference is a boundary. A shell potential has none: hydrogen electrons
// pass straight through it into the clamp well, which is why the frozen-shell NH3 dipole came out
// 4.0 D against 1.47 experimental. A homogenised DOMAIN tiles against the hydrogen domains, so the
// hydrogens MEET it and non-overlap excludes them -- while uniform density still prevents nitrogen
// from distorting its shape. Free boundary, frozen shape.
var HOMDOM = /[?&]hom=1/.test(q);
// nq=<Z> : nitrogen's DOMAIN charge. The plain RealQM construction and nothing else -- one -Z
// charge density on N, one -1 on each H, non-overlapping supports whose boundaries are free.
// NH3 is nq=3, NH4+ is nq=2 with four ordinary hydrogens, which makes the cation T_d and keeps
// six valence electrons on both sides. No shell, no fixed outer radius, no frozen shape: the
// only imposed length is the inner cutoff r_c, exactly as in every other molecule run.
// Pairs with mocc, since a -Z domain must carry its self-repulsion reduced by (Z-1)/Z.
// kn=<c> : kinetic coefficient for NITROGEN's domain only. The physical value is 1/2. A domain
// holding Z electrons in ONE smooth psi under-counts kinetic energy -- Z electrons forced into
// orthogonal orbitals carry more gradient than a single lumped function -- and kinetic energy is
// what resists compression, i.e. it IS a form of self-repulsion. Thomas-Fermi puts the excess at
// about Z^(2/3) per electron, so 3^(2/3) = 2.08, i.e. kn ~ 1.0, is the first guess for a -3 domain.
// Implemented via FIRST_SHELL=1: labels >= 1 are the hydrogens and keep KIN_S = 0.5, label 0 is
// nitrogen and takes KIN_C = kn. Nitrogen is coords[0] by construction.
// NOT a physical knob: it corresponds to a lighter carrier and rescales every length, so read
// trends against the dipole, not total energies.
var KN = parseFloat((q.match(/[?&]kn=([\d.]+)/) || [])[1] || '');
var NQ = parseFloat((q.match(/[?&]nq=([\d.]+)/) || [])[1] || '');
var HASNQ = !isNaN(NQ);
var SHQ = parseFloat((q.match(/[?&]shq=([\d.]+)/) || [])[1] || '');
var SHQV = isNaN(SHQ) ? ZN : SHQ;
var SHELL_SYM = (SHELL || HOMDOM) && !isNaN(SHQ);  // explicit shq => no bare proton, all H own an electron

var A = 1.8897;
// NH3: N-H = 1.012 A, HNH = 106.7 deg. Pyramid about +z; the lone pair points -z,
// and the incoming proton goes there, at the N-H distance of NH4+ (1.021 A).
var bNH = 1.012, ang = 106.7*Math.PI/180;
// solve for the polar angle theta from the apex such that HNH = 106.7
var ct = Math.cos(ang), th = Math.acos(Math.sqrt((1+2*ct)/3));   // angle from +z
var sx = Math.sin(th), cz = Math.cos(th);
var FRAG = (WHAT === 'natom' || WHAT === 'hatom');
var coords = [['N', 0,0,0, 'N']];
// GEOMETRY IS A PROPERTY OF THE SPECIES, NOT OF THE CHARGE BOOKKEEPING. The T_d coordinates were
// reachable only under sym=1, so every asymmetric NH4+ run so far was NH3's pyramid with a proton
// bolted on at -z -- the wrong geometry for the cation. Experimental NH4+ is T_d, four equal
// 1.021 A bonds at 109.47 deg. Shell mode uses it too.
// GEOMETRY IS UNCONDITIONAL. Gating T_d on (SYM || SHELL) meant 10 of the 15 NH4+ runs in this
// project were computed on NH3's pyramid with a proton bolted at -z -- the wrong shape AND the
// wrong size for the cation. Every nh4 run gets the tetrahedron now; only the ELECTRON booking
// (bare proton vs shell charge vs sym) is a switch.
if (WHAT === 'nh4') {
  // NH4+ is T_d: four EQUAL bonds of 1.021 A at the tetrahedral angle 109.47 deg, not NH3's
  // pyramid with a fourth atom bolted on. Three in a cone about +z, one along -z.
  var b4 = 1.021, c4 = 1/3, s4 = Math.sqrt(1 - 1/9);
  for (var k = 0; k < 3; k++) {
    var ph4 = 2*Math.PI*k/3;
    coords.push(['H', b4*s4*Math.cos(ph4), b4*s4*Math.sin(ph4), b4*c4, 'H']);
  }
  coords.push(['H', 0, 0, -b4, 'H']);
} else if (WHAT === 'natom') {
  // nitrogen alone, at the same place in the same box
} else if (WHAT === 'hatom') {
  coords = [['H', bNH*sx, 0, bNH*cz, 'H']];     // one hydrogen, at its molecular position
} else {
  for (var k = 0; k < 3; k++) {
    var phi = 2*Math.PI*k/3;
    coords.push(['H', bNH*sx*Math.cos(phi), bNH*sx*Math.sin(phi), bNH*cz, 'H']);
  }
}
var PROTON_IDX = -1, zList_isProtonAtTd = false;
if (WHAT === 'nh4' && SHELL && !SHELL_SYM) {
  // bare-proton booking: fourth hydrogen of the T_d cage owns no domain. Breaks T_d in the charge.
  PROTON_IDX = coords.length - 1;
  zList_isProtonAtTd = true;
} else if (WHAT === 'nh4' && (SHELL_SYM || HASNQ)) {
  // shell-charge booking: all four hydrogens are ordinary, the cation comes from shell = ZN-1.
  PROTON_IDX = -1;
} else if (WHAT === 'nh4' && !SYM) {
  // asymmetric booking on the T_d cage: the fourth vertex is the bare proton. Previously this
  // branch APPENDED a fifth hydrogen at NH3's apex distance, giving a 5-coordinate cation.
  PROTON_IDX = coords.length - 1;
}

var BOX = 20.0;                       // a.u., fixed for every variant
var gridN = 128, h = BOX/gridN, gN2 = Math.round(gridN/2);
// rc=<A> : nitrogen's shell radius. The house 0.3 is only 1.9 cells at h = 0.156, so FULL_RC
// carves a hole below the grid's resolution and changes nothing -- measured: identical energies to
// 15 digits with and without frc=1. A meaningful shell needs r_c several cells across, and the
// physical radius of nitrogen's 2s/2p is about 0.9 a0, which is 5.8 cells here.
var RCN = parseFloat((q.match(/[?&]rc=([\d.]+)/) || [])[1] || '0.3');
var Zof = { N:ZN, H:1 }, RCof = { N:RCN, H:0 };

// nitrogen split into FOUR tetrahedral lobes: three along the N-H bonds, one on -z
var SPLIT_OF = [], expand = [];
var NLOBE = SPL >= 2 ? SPL : (SPLIT ? 4 : 0);
coords.forEach(function(c, i) {
  if (i === 0 && NLOBE >= 2) { for (var s = 0; s < NLOBE; s++) { expand.push(c.slice()); SPLIT_OF.push(s); } }
  else { expand.push(c.slice()); SPLIT_OF.push(-1); }
});
coords = expand;
// NOT in sym mode -- there the fourth H is an ordinary hydrogen owning a domain. Setting
// PROTON_IDX here regardless of SYM turned it into a bare proton and the sym 4-split run came
// out with 7 electrons instead of 8.
// PROTON_IDX is computed BEFORE the split expands coords, so it must be remapped afterwards --
// with spl=3 the pre-expansion index 4 lands on the second hydrogen instead of the T_d apex.
// Only when the cation is actually booked with a bare proton (not SYM, not shq, not nq).
if (NLOBE >= 2 && WHAT === 'nh4' && !SYM && !SHELL_SYM && !HASNQ) PROTON_IDX = coords.length - 1;
else if (NLOBE >= 2 && WHAT !== 'nh4') PROTON_IDX = -1;

var atoms = [], zList = [], zNucList = [], rcList = [], shqList = [], shrList = [], homList = [];
var splitType = [], splitIdx = [], splitAxis = [], splitRot = [], initZeff = [], grp = [];
for (var n = 0; n < coords.length; n++) {
  var el = coords[n][0], isP = (n === PROTON_IDX), sct = SPLIT_OF[n], isL = (sct >= 0);
  // NO ROUNDING. Snapping kernels to integer cells broke the tetrahedron: the four NH4+ bonds
  // came out 1.0459 / 1.0194 / 1.0194 / 0.9922 A, a 2.8% spread, so T_d was destroyed before the
  // solver ran and the "dipole must be 0 by symmetry" control had a floor of unknown size.
  // Positions reach the GPU as f32 and are never used as array indices -- the only integer use is
  // a display-only density line plot that rounds locally -- so fractional cells are exact here.
  atoms.push({ i: gN2 + coords[n][1]*A/h,
               j: gN2 + coords[n][2]*A/h,
               k: gN2 + coords[n][3]*A/h,
               Z: isP ? 0 : (isL ? 1 : Zof[el]), el: (el === 'Hp' ? 'H' : el) });
  var isShellN = SHELL && !HOMDOM && el === 'N' && !isL;
  var isHomN   = HOMDOM && el === 'N' && !isL;
  // nitrogen carries NO electron domain in shell mode: its charge is the fixed smeared shell
  var isNqN = HASNQ && el === 'N' && !isL;
  zList.push((isP || isShellN) ? 0 : (isL ? 1 : (isHomN ? SHQV : (isNqN ? NQ : Zof[el]))));
  homList.push(isHomN ? 1 : 0);
  shqList.push(isShellN ? SHQV : 0);
  shrList.push(isShellN ? SHR : 0);
  // kernel != electron count for nitrogen in sym mode: the core is homogenized into a +5 kernel
  // whatever the valence occupancy, and it is the ELECTRON count that drops from 5 to 4 on
  // protonation. That is what makes NH4+ a cation while leaving all four bonds equivalent.
  var kern = isP ? 1 : (isL ? 1 : ((SYM && el === 'N') ? 5 : Zof[el]));
  zNucList.push(kern);
  rcList.push((isP || isL) ? 0 : RCof[el]);
  splitType.push(isL ? (NLOBE === 3 ? 'third' : NLOBE === 2 ? 'hemi' : 'tetra') : 'sphere');
  splitIdx.push(isL ? sct : 0);
  splitAxis.push([0,0,1]);
  splitRot.push(0);
  initZeff.push(isL ? 3 : (isP ? 1 : Zof[el]));
  grp.push(isL ? 999 : n);
}
document.getElementById('log').textContent =
  'NH3 PA — ' + WHAT + '  zn=' + ZN + (SPLIT?' 4-split':'') + (SIC?' sharedSIC':'') +
  (SHELL&&!HOMDOM?(' hom-shell q=-' + SHQV + ' R=' + SHR + (SHELL_SYM?' T_d-sym':' bare-proton')):'') +
  // hom mode has the SAME atom and electron counts as the plain model, so without this the banner
  // is identical and a run cannot be identified from the page at all.
  (HOMDOM?(' HOMOGENISED DOMAIN q=-' + SHQV + ' free outer boundary, r_c=' + RCN):'') +
  (HASNQ&&!HOMDOM?(' N domain -' + NQ + ', free supports, r_c=' + RCN):'') +
  (!isNaN(KN)?(' KIN(N)=' + KN + ' vs 0.5 on H'):'') +
  (SPL?(' N split into ' + SPL + ' x -1 lobes, no shared-SIC'):'') +
  (window.USER_FULL_RC?' frc':'') + (window.USER_MULTI_OCC?' mocc':'') +
  '\n' + coords.length + ' entries, ' + zList.reduce(function(a,b){return a+b;},0) + ' electrons, grid ' +
  gridN + '^3, box ' + BOX + ' a.u., h=' + (h/A).toFixed(4) + ' A\nsteps=' + STEPS + '\nrelaxing…';

window.USER_NN = gridN;
window.USER_ATOMS = atoms;
window.USER_SCREEN = BOX;
window.USER_Z = zList;
window.USER_Z_NUC = zNucList;
window.USER_RC = rcList;
if (SHELL && !HOMDOM) { window.USER_SHELL_Q = shqList; window.USER_SHELL_R = shrList; }
if (HOMDOM) { window.USER_HOMOG = homList; }
if (NLOBE >= 2) {
  window.USER_SPLIT_TYPE = splitType; window.USER_SPLIT_IDX = splitIdx;
  window.USER_SPLIT_AXIS = splitAxis; window.USER_SPLIT_ROT = splitRot;
  window.USER_INIT_ZEFF = initZeff;
  if (SIC) window.USER_SPLIT_GROUP = grp;
}
// frc=1 : USER_FULL_RC -- every cell within r_c of ANY kernel is excluded from every domain, so
// the electrons form a SHELL OUTSIDE r_c rather than sitting on top of the kernel. This is the
// construction the conduction runs use (their storage keys carry _FULLRC_, chain_slide.html
// defaults it on), and it was missing from every proton-affinity run so far -- molecule.js has it
// OFF by default. For NH3 it carves a 0.3 a0 sphere out of the nitrogen: the three N electrons
// become a -3 shell outside 0.3, which is what a homogenized inner shell should look like.
if (/[?&]frc=1/.test(q)) window.USER_FULL_RC = true;
// mocc=1 : keep (Z_eff-1)/Z_eff of a multi-occupancy domain's own potential -- the intra-atomic
// pair repulsion that excluding the whole domain throws away. N:3 should keep 2/3 of it and keeps
// none, which over-binds; NH3's binding energy comes out 2.22x too large, which is the right sign
// for a missing repulsion. This is the one diagnosed candidate for the systematic error in E.
if (/[?&]mocc=1/.test(q)) window.USER_MULTI_OCC = true;
// A homogenised domain is ONE charge density of total charge Z, and its self-repulsion must be
// INCLUDED, reduced by (Z-1)/Z: Z smeared electrons have Z(Z-1)/2 real pairs where the naive
// integral counts Z^2/2. q=3 keeps 2/3, q=2 keeps 1/2. Excluding it outright -- what the i!=j
// rule does -- is the wrong limit for a multi-occupancy domain, so mocc is not optional here.
// Ad hoc, in that it is a mean-field pair count for a blob, not a derivation.
if (HOMDOM) window.USER_MULTI_OCC = true;
if (!isNaN(KN)) { window.USER_KIN = KN; window.USER_KIN_SHELL = 0.5; window.USER_FIRST_SHELL = 1; }
window.USER_DYNAMICS = false;
window.USER_DIRECT_POTHER = true;
window.USER_STEPS = STEPS;
window.NO_AUTO_DYNAMICS = true;
window.CONVERGENCE_THRESHOLD = 0;
if (PROTON_IDX >= 0) window.USER_MARK_ATOMS = [{ i: PROTON_IDX, label: 'H⁺', col: [255,0,255] }];

var KEY = 'nh3pa_' + WHAT + '_zn' + ZN + (SPLIT?'_s':'') + (SIC?'_g':'') + (SYM?'_y':'') + (window.USER_FULL_RC?'_f':'') + (RCN!==0.3?'_rc'+RCN:'') + (window.USER_MULTI_OCC?'_m':'') + (SPL?'_spl'+SPL:'') + (HASNQ&&!HOMDOM?'_nq'+NQ:'') + (!isNaN(KN)?'_kn'+KN:'') + (HOMDOM?'_hom':'') + (SHELL&&!HOMDOM?'_sh'+SHR:'') + (SHELL_SYM?'_q'+SHQV:'') + '_n' + STEPS;   // ALWAYS stamp the step count. Omitting it at the 4000 default meant a
// harness polling '..._n4000' watched a key the page never wrote, and sat until its timeout.
// A key that always carries every varied parameter fails loudly (timeout) instead of silently
// returning a stale value from a different configuration.
window.onSweepDone = async function(E){
  var res = null; try { res = await window.readELResidual(); } catch(e) {}
  var rec = { what: WHAT, zn: ZN, split: SPLIT, sic: SIC, sym: SYM, frc: !!window.USER_FULL_RC, steps: STEPS, E: E,
              rMax: res ? Number(res.rMax.toPrecision(4)) : null,
              mocc: !!window.USER_MULTI_OCC, rcN: RCN, shr: SHR,
              // The dipole is the one quantity here checkable against experiment: NH3 = 1.47 D.
              // A frozen spherical shell contributes no dipole of its own, so what survives is the
              // hydrogens' polarisation alone. MEASURED 2026-09-17: that is LARGER, not smaller --
              // frozen 1.923 D vs relaxing 1.706 D vs experiment 1.470 D. Freezing nitrogen removes
              // what was pushing the hydrogen electrons back, so they move further in. There is no
              // "lone-pair share" to subtract; both variants overshoot experiment.
              dipD: window._dipole_D, spl: SPL, kn: isNaN(KN)?0.5:KN, nq: HASNQ?NQ:0, shq: (SHELL||HOMDOM) ? SHQV : 0, hom: HOMDOM,
              // energy breakdown, so a PA can be attributed rather than just reported
              eT: window._E_T, eeK: window._E_eK, eee: window._E_ee, eKK: window._E_KK, nAtoms: coords.length, nElec: zList.reduce(function(a,b){return a+b;},0) };
  try { localStorage.setItem(KEY, JSON.stringify(rec)); } catch(e){}
  console.log('=== NH3 PA ===', JSON.stringify(rec));
  document.getElementById('log').textContent += '\nDONE  E=' + E.toFixed(6) + ' Ha  rMax=' + (rec.rMax||'n/a');
};

var s = document.createElement('script');
s.src = 'molecule.js?t=' + Date.now();
s.onload = function(){ var p = document.createElement('script');
  p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
  p.onerror = function(){ document.getElementById('log').textContent += '\nERROR: p5 failed'; };
  document.body.appendChild(p); };
s.onerror = function(){ document.getElementById('log').textContent += '\nERROR: molecule.js failed'; };
document.body.appendChild(s);
</script>
</body></html>
