<!DOCTYPE html>
<html><head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>Molecule simulator (mol_fast, archived) — H, C, N, O</title>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:monospace }
    select,button { background:#1a2228; color:#dfe; border:1px solid #456; padding:3px 6px; font-family:monospace }
    a { color:#6cf }

</head><body>
<!-- Panel on the LEFT and narrow; the solver's canvas is drawn at the page origin, so a panel
     pinned top-right sat on top of the 3D view. Canvas and 3D view are also shrunk below via
     USER_CANVAS_PX / USER_VIEW3D_*, and the page is laid out so neither overlaps the other. -->
<div id="panel" style="position:fixed;top:8px;left:8px;background:rgba(0,0,0,.92);padding:9px 11px;
     border:1px solid #345;border-radius:6px;width:220px;max-height:96vh;overflow-y:auto;
     font-size:11.5px;z-index:1000;color:#cde">
  <div style="font-weight:bold;color:#8df">Molecule simulator &mdash; H, C, N, O</div>
  <div id="picker" style="margin:7px 0"></div>
  <div id="geom" style="color:#9ab;font-size:11px"></div>
  <div id="checks" style="margin-top:7px"></div>
  <div style="color:#789;font-size:11px;margin-top:7px">
    Forces evaluated at the <b>measured</b> geometry, where the true force is zero &mdash; so each
    residual is model error directly. <code>?mol=</code> <code>?h=</code> <code>?dyn=1</code>
    <code>?steps=</code>
  </div>
</div>
<div id="loadStatus" style="color:#ff0;padding:20px;font-size:14px;margin-left:276px">Loading…</div>
<style>
  /* p5 appends its canvases to the body. A `body > canvas` rule did NOT take (measured: the
     canvas still began at x=0 under the panel), so target canvas directly and force it. The
     plots are also shrunk below: panel edge 252 + 24px gap + canvas 336 = 612 fits a 627 px window side by side,
     where the stock 620 px canvas could not. */
  /* Target ONLY p5's main canvas. A bare `canvas` rule with display:block !important also
     un-hid p5's offscreen createGraphics buffer (the 3D view), which then rendered a second,
     duplicate plot below the page. The buffer is id defaultCanvas1 and must stay hidden. */
  #defaultCanvas0 { margin-left: 276px !important; display: block !important; position: relative; z-index: 1; }
  /* The picker must sit above the canvas unconditionally: a select is a native control and was
     being overlapped at the panel edge. Explicit stacking rather than relying on document order. */
  #panel, #panel * { position: relative; z-index: 1001; }
  #mol { width: 100%; box-sizing: border-box; }
  #defaultCanvas1 { display: none !important; }
</style>
<script>
window.onerror = function (m, u, l, c) {
  var pre = document.createElement('pre');
  pre.style.cssText = 'color:#f66;background:#200;padding:12px;white-space:pre-wrap';
  pre.textContent = 'ERROR: ' + m + '\n  at ' + u + ':' + l + ':' + c;
  document.body.insertBefore(pre, document.body.firstChild);
};
// Measured geometries converted from internal coordinates to Cartesian (bohr), centred.
// GENERATED, not hand-entered. Zx: H1 C4 N3 O3.
// The four linear additions were chosen because the measurements predict that linear
// geometries with DEEP kernels pass: they lie on a grid axis, so no cubic-grid anisotropy,
// and their domains are firmly held, so no shallow-kernel non-convergence.
// WHAT SigmaF MEANS depends on the molecule's symmetry, and the distinction is easy to misread.
// SigmaF = 0 is NOT an identity: it equals the net force of the electron cloud on the nuclei and
// vanishes only when the electronic state is converged -- so it is a CONVERGENCE meter. But a
// symmetric molecule has SigmaF = 0 forced by symmetry whatever the accuracy, so there it reports
// only whether the algorithm PRESERVES symmetry and bounds nothing.
//   'full'    every direction cancelled (CO2, CH4, N2, C2H2...) -> symmetry preservation only
//   'axis'    one axis unprotected (H2O's C2, NH3's C3, H2CO's C=O) -> real meter along it
//   'none'    nothing cancels (CO, HCN, N2O, HC3N) -> a genuine convergence measurement
// Measured 2026-11-03: the asymmetric cases run 11-89% while CO2 and C3O2 read 0.1-0.2%, which is
// symmetry being preserved, not convergence being good.
var SYM = { h:'full', c:'full', n:'full', o:'full', he_split:'full', he_v:'full', heplus:'full', hyd2:'full', hyd3:'full', hyd4:'full', c4s:'full', c_sh:'full', c_sh222:'full', heli3:'full', heli4:'full', heli6:'full', heli7:'full', heli8:'full', hehp:'none', h2:'full', n2:'full', o2:'full', co:'none', oh:'none', nh:'none', ch:'none', lih:'none', li_live:'full', lih_live:'none', h_x:'full', be_live:'full', beh_live:'none', beh2_live:'full', be_ps2hom:'full', beh2_ps2hom:'full', be_ps11:'full', beh2_ps11:'full', lih_ion:'none', hminus:'full', hminus_split:'full', lih_ion_split:'none', co2:'full', n2o:'none', hcn:'none',
            c2h2:'full', c2n2:'full', c3o2:'full', hc3n:'none', c4h2:'full',
            h2o:'axis', h2o_split:'axis', nh3:'axis', ch4:'full', h2co:'axis',
            h2o_a90:'axis', h2o_a109:'axis', h2o_a120:'axis', h2o_z2:'axis' };
var SYMNOTE = {
  full: ['symmetry-cancelled', '#8a9', 'SigmaF is forced to zero by symmetry here, so it measures only whether the algorithm preserves symmetry — it does NOT bound the convergence error.'],
  axis: ['partly cancelled', '#dc8', 'Symmetry cancels SigmaF except along the unique axis, so the residual IS a convergence measurement in that direction.'],
  none: ['genuine convergence meter', '#8cf', 'No symmetry cancels SigmaF here, so the residual measures electronic non-convergence directly.'] };

// -----------------------------------------------------------------------------------------------
// BINDING ENERGY, reported in the output instead of being recomputed by hand afterwards.
//
//     E_bind = sum_i E(atom_i) - E(molecule),      positive = bound.
//
// The subtraction is legitimate only when the atomic references were computed on the SAME grid
// with the SAME settings as the molecule. That is not a formality: mixed boxes were measured to
// corrupt a cross-molecule difference by 2.7x (CO gave 0.0369 on mixed boxes against 0.0137 on
// matched ones). So the references are KEYED BY GRID, and a run whose grid has no reference set
// reports n/a together with the reason, rather than silently subtracting a number measured
// somewhere else. Declaring one mesh for every molecule is what turns these into fixed constants
// of the model instead of per-run bookkeeping.
//
// Key is 'box|h|gate'. Each set records how it was measured; add a set, do not edit one.
var E_ATOM_SETS = {
  // Measured 2026-11-08 at the CALIBRATED softening (eq:sigmacal, sigma = 0.627). H only so far;
  // C, N and O still need running there before any molecular row beyond H2 can report an E_bind.
  '12|0.100|0.1|s0.627': { H: -0.499854 },   // measured at box 12, not transferred
  '20|0.100|0.1|s0.627': { H: -0.499901 },   // E(H) is box-free to 1e-4, verified at both
  // THE DECLARED GRID: box 20, h 0.10 (200^3), eps = h, soft 1, rinit 3, wdiff 0.05, wd 1,
  // 232500 steps, gate 0.9. The atom is nearly box-free (-0.000082 Ha from box 12) while the
  // MOLECULE is not (+0.005967), so E_bind drops 3.5 points of D_e on moving here from box 12 --
  // larger than the 2.1-point seed scatter, hence real. Measured 2026-11-05.
  '20|0.100|0.9': { H: -0.486591 },
  // box 12, h 0.10, eps = h, soft 1, rinit 3, wdiff 0.05, wd 1, 232500 steps, gate 0.9
  '12|0.100|0.9': { H: -0.486509 },
  // same grid, baseline kinetic accounting (gate 0.1)
  '12|0.100|0.1': { H: -0.486422 },
  // box 15, h 0.1389, eps 0.14, 119500 steps, gate 0.1. N and O are BIT-IDENTICAL here (both
  // carry Z_x = 3), so nothing computed from this set distinguishes nitrogen from oxygen.
  '15|0.139|0.1': { H: -0.482258, C: -13.999484, N: -6.847492, O: -6.847492 }
};
// Experimental dissociation energy (Ha). TWO conventions, and the output reports the error against
// BOTH, because for H2 they differ by 6.0% -- larger than the model's own run-to-run scatter, so
// quoting one silently picks a 6-point answer:
//   De = the depth of the well at its own minimum. The MATCHED target: the model has no nuclear
//        motion, so what it computes is a well depth, not the energy of a vibrational state.
//   D0 = the directly measured dissociation energy, from the vibrational ground state.
//        De = D0 + ZPE, so De is a hybrid of a measurement and a spectroscopic correction.
// Only values checked against a standard compilation are listed. A molecule absent here still gets
// its E_bind, with no error column -- which is the honest output, not an incomplete one.
var D_EXP = {
  h2: { De: 0.174470, D0: 0.164560 }    // 4.747 / 4.478 eV; ZPE 0.00991 Ha
};

// ABSOLUTE (total) energy references, Ha. Reported alongside E_bind because the two errors are of
// very different size and only quoting the binding energy conceals that: for H2 the total is
// 2.4% too shallow (0.0287 Ha) while the binding energy is off by 0.0017 Ha, so 94% of the error
// CANCELS in the difference. The binding energy is good BECAUSE of that cancellation, not because
// the totals are. Reporting E_bind alone overstates the model by a factor of 17 on this system.
//
// PROVENANCE MATTERS and is carried per entry: 'exact' is an analytic result, 'computed' is
// somebody's calculation and not an observable at all -- H2's -1.17447 is Kolos-Wolniewicz in the
// Born-Oppenheimer limit, so agreeing with it is agreeing with a calculation, not with nature.
// Experimental dipole moments, Debye. The SIGN/direction matters more than the magnitude here:
// a construction that inverts the polarity is wrong whatever its energy says, and the inversion is
// reproducible (OH: +0.778 split vs -0.470 as one domain, same kernel and electron count).
// Symmetric molecules have mu = 0 BY SYMMETRY, which makes them null tests rather than targets --
// a nonzero value there is pure error, so they are listed at 0 deliberately.
var MU_EXP = {
  h2o: 1.8546, nh3: 1.4718, co: 0.1098, hcn: 2.985, h2co: 2.332, n2o: 0.1608,
  h2: 0.0, n2: 0.0, o2: 0.0, co2: 0.0, ch4: 0.0, c2h2: 0.0, c2n2: 0.0
};

var E_TOT_REF = {
  h:  { E: -0.500000,  src: 'exact' },
  h2: { E: -1.174470,  src: 'computed (Kolos-Wolniewicz, BO)' }
};

// Absolute error of the total energy. Independent of the grid key, since a total needs no atomic
// reference -- so this one is available on every run, including the single atoms.
function totalErrReport(key) {
  if (window._E === undefined) return null;
  var R = E_TOT_REF[key];
  if (!R) return { why: 'no checked total-energy reference for this molecule' };
  var dE = window._E - R.E;
  return { E: window._E, ref: R.E, src: R.src, dE: dE, pct: 100 * dE / Math.abs(R.E) };
}

function bindReport(key, M, box, h) {
  if (window._E === undefined) return { why: 'no energy yet' };
  if (M.atoms.length < 2) return { why: 'single atom - this run IS a reference' };
  var gate = (window.USER_W_KIN_GATE !== undefined ? window.USER_W_KIN_GATE : 0.1);
  // sigma MUST be in the key. It was not, and that silently paired a sigma=0.627 molecule with a
  // sigma=1 atom: H2 then reported E_bind = 0.188011 (+7.8%, apparently OVER-binding) where the
  // matched atom (-0.499901) gives 0.161053 (-7.7%, UNDER-binding). The sign inverted, and a whole
  // conclusion was drawn from it before the mismatch was noticed. sigma sets the cusp resolution
  // and therefore every energy, so a reference at a different sigma is not a reference at all.
  var sig = (window.USER_SOFT !== undefined ? window.USER_SOFT : 1);
  var gkey = box + '|' + h.toFixed(3) + '|' + gate + '|s' + Number(sig).toFixed(3);
  var set = E_ATOM_SETS[gkey];
  if (!set) return { why: 'no atomic references at ' + gkey + ' (box|h|gate); run the single atoms on THIS grid' };
  var sum = 0, miss = [];
  for (var i = 0; i < M.atoms.length; i++) {
    var el = M.atoms[i].el;
    if (set[el] === undefined) { if (miss.indexOf(el) < 0) miss.push(el); } else sum += set[el];
  }
  if (miss.length) return { why: 'no ' + miss.join('/') + ' reference at ' + gkey };
  var eb = sum - window._E, out = { eb: eb, gkey: gkey };
  var D = D_EXP[key];
  if (D) {
    // the ERROR, both as an absolute energy and as a fraction, against both conventions
    out.err = [];
    ['De', 'D0'].forEach(function (nm) {
      if (D[nm] === undefined) return;
      out.err.push({ name: nm, ref: D[nm], dE: eb - D[nm], pct: 100 * (eb - D[nm]) / D[nm] });
    });
  }
  return out;
}

var XH_LIVE_Q = { h:'0.1', box:'15', soft:'0.627', softLi:'0.932', softBe:'1.090',
                  wkinw:'0', wdiff:'0.01', normint:'1', sfix:'0' };
var XH_PS_Q = { h:'0.1', box:'15', soft:'0.627', softBe:'0.778', rcBe:'0.4',
                wkinw:'0', wdiff:'0.01', normint:'1', sfix:'0' };
var MOLS = {
  h: { name: 'H  single atom  [E_bind reference + null test]', ext: 0.000, nelec: 1, atoms: [
      { x:  0.00000, y:  0.00000, z:  0.00000, el:'H', Z:1 },
  ]},
  c: { name: 'C  single atom  [E_bind reference]', ext: 0.000, nelec: 4, atoms: [
      { x:  0.00000, y:  0.00000, z:  0.00000, el:'C', Z:4 },
  ]},
  // SHELL MODEL WITH A PSEUDO INNER CORE (Claes 2026-11-08): kernel Z_x = 4 carries the 1s pair as a
  // pseudocore (?rc= at its PHYSICAL radius, Slater 0.263 for C), valence explicit and SPLIT into
  // four one-electron tetrahedral sectors. Compare with `c` (one 4-electron blob) at equal rc.
  // FAILED 2026-11-09: at rc 0 the lone atom is not spherical (mu 0.134 D -- the kernel cell is owned
  // by one sector); at rc 0.263 it diverges (E -7.97, mu 0.50). Blob `c` is the working entry.
  c4s: { name: 'C  pseudo-1s + valence split 4 x 1e (tetra)  [shell model, pseudo core]', ext: 0.000, nelec: 4, atoms: [
      { x: 0, y: 0, z: 0, el:'C', Z:4, sp:4 },
  ]},
  // ALL-ELECTRON carbon, hom2 core + valence, both free (?sh=1; add ?shv=1 for a hom4 valence). The
  // 3D version of atom_simulator's 2+4: no r_c, the core/valence boundary found by non-overlap.
  // FAILED 2026-11-09: E = NaN from step 0-500, hom or split valence. Not debugged.
  c_sh: { name: 'C  all-electron 2+4 on Z=6  [?sh=1; ?shv=1 = hom valence]', ext: 0.000, nelec: 6, atoms: [
      { x: 0, y: 0, z: 0, el:'C', Z:4, Zfull:6, sh:[2,4] },
  ]},
  // atom_simulator's PHYSICAL carbon, 2+2+2 (1D: -37.376, 1.2% from exact). In ?sh=1 the inner two
  // shells are shape-locked spheres -- so here TWO VALENCE electrons are locked spherical too.
  // FAILED 2026-11-09: E = NaN from step 0-500, as c_sh. Not debugged.
  c_sh222: { name: 'C  all-electron 2+2+2 on Z=6  [?sh=1; 1D physical config]', ext: 0.000, nelec: 6, atoms: [
      { x: 0, y: 0, z: 0, el:'C', Z:4, Zfull:6, sh:[2,2,2] },
  ]},
  n: { name: 'N  single atom  [E_bind reference]', ext: 0.000, nelec: 3, atoms: [
      { x:  0.00000, y:  0.00000, z:  0.00000, el:'N', Z:3 },
  ]},
  o: { name: 'O  single atom  [E_bind reference]', ext: 0.000, nelec: 3, atoms: [
      { x:  0.00000, y:  0.00000, z:  0.00000, el:'O', Z:3 },
  ]},
  // SPLIT ATOMIC REFERENCES. The blob entries above carry Z_x electrons in ONE domain, which has
  // no intra-domain repulsion, and that is the suspected whole cause of their over-binding
  // (C 2.57x, N/O 2.03x against the sum of their ionization energies; H, with one electron and
  // therefore NO pairs, is right to 3%). Dividing each over-binding by the pairs the blob fails
  // to count gives 1.43 Ha/pair for C and 1.16 for O, i.e. <1/r12> implying r12 = 0.70 and
  // 0.86 a0 -- a valence-shell separation, so the magnitudes fit.
  //   PREDICTION under splitting: E(C) rises by ~8.55 Ha to about -5.45, E(O) by ~3.47 to about
  //   -3.37. A much smaller rise means the over-binding is NOT the missing repulsion.
  // These are separate entries so the blob references stay reproducible.
  // SECOND ROW AT FULL VALENCE, Z_x = 1..8. Required for an ATOMIC validation because Z_x is the
  // only label distinguishing elements: at the molecular truncations (H1 C4 N3 O3) lithium is
  // bit-identical to hydrogen and B = N = O collapse onto one object at Z_x = 3. Reference is the
  // sum of IEs to strip the whole valence, = |E_neutral - E_core| from atom_simulator.html's
  // REF_ETOT and its fitted coreE(Z); validated on carbon to 0.2% against the recorded 2.57x.
  // He+ : ONE electron on a Z=2 kernel. Exact energy -Z^2/2 = -2.0, no interface, no partition,
  // no two-electron content -- so this is the Z=2 member of the hydrogenic family and the system
  // that fixes sigma(2), exactly as H fixes sigma(1).
  // WHY IT IS NEEDED (measured 2026-11-08): sigma calibrated on H (0.627 at h=0.10) does NOT
  // transfer to Z=2. It UNDER-softens the sharper Z=2 cusp, and helium came out -2.415723 against
  // exact -2.903724, i.e. 16.8% shallow -- WORSE than the 10.5% at sigma=1 -- with mu = 0.512 D
  // where sphericity demands identically zero. One sigma cannot serve two kernel charges.
  // So the scheme is sigma(Z), one value per kernel charge, each fixed on the corresponding
  // hydrogenic ion. Still no molecular observable consumed; a function of Z, not one constant.
  // CONSTRUCTION: sp:1 gives one domain with the full kernel charge and target 1 electron.
  heplus: { name: 'He+  1e on Z=2  [fixes sigma(2); exact -2.0]', ext: 0, nelec: 1, atoms: [
      { x:0, y:0, z:0, el:'He', Z:2, sp:1, ax:[0,0,1] },
  ]},
  // ONE-ELECTRON IONS on the plain single-domain path (ne:1). sigma(Z) is calibrated HERE, against
  // the exact -Z^2/2, because He+ at the hydrogen sigma 0.627 gives -2.053 (2.7% deep): sigma
  // already depends on Z with ONE electron, so a 2hom fit would mix that with the pair's shape.
  hyd2: { name: 'He+  1e on Z=2, single domain  [sigma(2); exact -2.0]', ext: 0, nelec: 1, atoms: [ { x:0,y:0,z:0, el:'He', Z:2, ne:1 } ]},
  hyd3: { name: 'Li2+ 1e on Z=3, single domain  [sigma(3); exact -4.5]', ext: 0, nelec: 1, atoms: [ { x:0,y:0,z:0, el:'Li', Z:3, ne:1 } ]},
  hyd4: { name: 'Be3+ 1e on Z=4, single domain  [sigma(4); exact -8.0]', ext: 0, nelec: 1, atoms: [ { x:0,y:0,z:0, el:'Be', Z:4, ne:1 } ]},
  // HE-LIKE IONS: two electrons in ONE domain on a kernel of charge Z -- the 2hom core, which is
  // the construction the atom model actually uses for inner shells. Calibrating sigma HERE rather
  // than on a one-electron ion calibrates it in the configuration it will be used in.
  //
  // CALIBRATE AGAINST THE RHF ENERGY OF THE ION, NOT THE EXACT ONE. 2hom is the RHF ansatz for a
  // two-electron closed shell (one spatial shape, one Coulomb pair -- confirmed: Vee = 1.0197
  // against RHF's J = 1.0258 for He, 0.6%). The exact energy includes correlation, which the
  // construction has none of, so calibrating to it would make sigma absorb a physical omission --
  // the r_c failure mode. RHF targets leave correlation a declared omission.
  //
  // MEASURED so far (He, Z=2, box 12): sigma 0.2846 -> -3.022386 ; sigma 0.627 -> -2.771193,
  // against RHF -2.861680. So sigma(2) ~ 0.504, against sigma(1) = 0.627 -- sigma DECREASES with Z,
  // since a more compact density needs less artificial weakening to reach the right depth.
  // Two points fit sigma(Z) ~ 0.627 Z^(-1/3) (0.498 predicted vs 0.504 measured), predicting
  // sigma(3) ~ 0.435 for Li+. HOLD THAT LOOSELY -- it is two points.
  //
  // RHF REFERENCES NOT ASSERTED: only He's -2.861680 is used here. Look up the He-like RHF series
  // before quoting Li+/Be2+/C4+/N5+/O6+; do not recall them.
  heli3: { name: 'Li+  2e on Z=3, one domain  [2hom core; tests sigma(3)]', ext: 0, nelec: 2, atoms: [ { x:0,y:0,z:0, el:'Li', Z:3, ne:2 } ]},
  heli4: { name: 'Be2+ 2e on Z=4, one domain  [2hom core]', ext: 0, nelec: 2, atoms: [ { x:0,y:0,z:0, el:'Be', Z:4, ne:2 } ]},
  heli6: { name: 'C4+  2e on Z=6, one domain  [2hom core of carbon]', ext: 0, nelec: 2, atoms: [ { x:0,y:0,z:0, el:'C', Z:6, ne:2 } ]},
  heli7: { name: 'N5+  2e on Z=7, one domain  [2hom core of nitrogen]', ext: 0, nelec: 2, atoms: [ { x:0,y:0,z:0, el:'N', Z:7, ne:2 } ]},
  heli8: { name: 'O6+  2e on Z=8, one domain  [2hom core of oxygen]', ext: 0, nelec: 2, atoms: [ { x:0,y:0,z:0, el:'O', Z:8, ne:2 } ]},
  // HELIUM, restored 2026-11-07 (removed in the H,C,N,O reduction). Needed because He is the
  // SECOND minimal two-electron system and the other half of the hard-vs-diffuse bracket: its
  // interface passes THROUGH the kernel, cutting the density maximum, where H2's midplane sits in
  // the tail between two kernels. Measured: INT_Gamma u^2 dS = 1.681 for He against 0.496 for H2.
  // USE he_split, NOT he_v: he_v puts both electrons in ONE domain, which counts NO
  // electron-electron pair inside itself and therefore carries no V_ee -- kept only as that control.
  // CAVEAT: He's split plane is IMPOSED (sp:2 along z); nothing in the system picks it, unlike H2's
  // midplane which symmetry fixes. So this row carries an arbitrary orientation that H2's does not.
  he_split: { name: 'He  split 2x1e hemi  [two-domain He: the bracket entry]', ext: 0, nelec: 2, atoms: [
      { x:0,y:0,z:0, el:'He', Z:2, sp:2, ax:[0,0,1] },
  ]},
  // HOMOGENEOUS He: both electrons in ONE domain sharing one shape. NOT a no-V_ee control -- I
  // labelled it that from a memory about a different solver. mol_fast carries multi-occupancy
  // (fm = 1/selfN for selfN > 1, mol_fast.js:838), so this domain gets Vee = INT(P_m - P_m/2)u^2,
  // i.e. exactly ONE pair.
  // CONNECTION TO HF: for a two-electron closed shell, both electrons in one spatial shape with
  // exactly one Coulomb pair IS the restricted Hartree-Fock ansatz -- RHF's exchange cancels
  // precisely half the self-interaction, leaving one J integral, which the i != j rule gives
  // directly. So this should land on the RHF limit -2.861680, and its shortfall against the exact
  // -2.903724 is the correlation energy (-0.0420). It is the natural BALANCE to the hard split:
  // one shared shape (correlation-free, under-binds) against one territory each (over-binds 4.2%).
  he_v: { name: 'He  homogeneous: 2e in ONE domain, one shared shape  [= RHF ansatz]', ext: 0, nelec: 2, atoms: [ { x:0,y:0,z:0, el:'He', Z:2 } ]},
  // HeH+ : the ASYMMETRIC two-electron system, and the only one here that can settle the
  // formulation question. H2 and He both have interfaces fixed by symmetry, where amplitude
  // matching and zero flux COINCIDE (the two constructions agree to 4e-8), so neither can
  // distinguish them. HeH+ has unequal kernels, so its interface is at no symmetry plane.
  // CONSTRUCTION: sp:1 on He decouples the electron count from the kernel charge -- the sp branch

               + (Math.abs(t.pct) < 1 ? '#6c6' : Math.abs(t.pct) < 5 ? '#fc6' : '#f66') + '">'
               + (t.dE >= 0 ? '+' : '') + t.dE.toFixed(6) + ' Ha ('
               + (t.pct >= 0 ? '+' : '') + t.pct.toFixed(2) + '%)</b></span>';
        })()
      + (function () {
          var b = bindReport(key, M, box, h);
          if (b.eb === undefined)
            return '<br><span style="color:#889;font-size:10.5px">E<sub>bind</sub> — <i>'
                   + b.why + '</i></span>';
          var t = '<br><b>E<sub>bind</sub></b> = ' + b.eb.toFixed(6)
                + (b.eb > 0 ? '' : ' <b style="color:#f66">UNBOUND</b>')
                + '<span style="color:#789;font-size:10.5px"> (refs ' + b.gkey + ')</span>';
          if (!b.err) return t + '<br><span style="color:#889;font-size:10.5px">'
            + 'error — <i>no checked experimental value for this molecule</i></span>';
          // the ERROR against both conventions. They disagree by 6 points for H2, so showing one
          // would be choosing an answer; the sign of the disagreement is the useful part.
          t += '<br><span style="font-size:10.5px">error vs ';
          b.err.forEach(function (e, i) {
            t += (i ? ' &nbsp;|&nbsp; ' : '') + 'D<sub>' + e.name.slice(1) + '</sub>=' + e.ref.toFixed(6)
               + ': <b style="color:'
               + (Math.abs(e.pct) < 5 ? '#6c6' : Math.abs(e.pct) < 20 ? '#fc6' : '#f66') + '">'
               + (e.dE >= 0 ? '+' : '') + e.dE.toFixed(6) + ' Ha ('
               + (e.pct >= 0 ? '+' : '') + e.pct.toFixed(1) + '%)</b>';
          });
          return t + '</span>';
        })()
      + geomReport();
    document.title = 'MOLSIM ' + key + ' t=' + ((Date.now()-t0)/1000).toFixed(0) + 's'
      + ' step=' + (window._tStep === undefined ? '?' : window._tStep)
      + ' E=' + (window._E === undefined ? 'n/a' : window._E.toFixed(6))
      // ABSOLUTE error alongside the total, so the title never shows a good binding energy without
      // the much larger total error it was differenced out of.
      + (function () {
          var t = totalErrReport(key);
          return (!t || t.why) ? '' : ' errE=' + (t.dE >= 0 ? '+' : '') + t.dE.toFixed(6)
               + '(' + (t.pct >= 0 ? '+' : '') + t.pct.toFixed(2) + '%)';
        })()
      + (window._mu_mag !== undefined ? ' mu=' + (window._mu_mag*2.5417).toFixed(3) + 'D' : '')
      // SIGNED axial component, mol_fast convention mu = sum Z R - int rho r (points - to +). Diatomics
      // are built heavy/first atom at -x: for CO (C at -x) mu_x > 0 is the EXPERIMENTAL C-O+ sign and
      // mu_x < 0 is Hartree-Fock's wrong sign; for OH/NH/CH mu_x > 0 means X negative.
      + (window._mu_x !== undefined ? ' mux=' + (window._mu_x*2.5417 >= 0 ? '+' : '') + (window._mu_x*2.5417).toFixed(3) + 'D' : '')
      + ' Fsum=' + fs.toFixed(6) + ' (' + rel.toFixed(1) + '%)'
      // E_bind in the TITLE as well as the panel: the drivers read the title, and computing the
      // subtraction by hand between messages is how a mismatched-step atomic reference survived
      // long enough to put a wrong -11.4% on record.
      + (function () {
          var b = bindReport(key, M, box, h);
          if (b.eb === undefined) return ' Ebind=n/a';
          return ' Ebind=' + b.eb.toFixed(6)
               + (b.err || []).map(function (e) {
                   return ' err' + e.name + '=' + (e.dE >= 0 ? '+' : '') + e.dE.toFixed(6)
                        + '(' + (e.pct >= 0 ? '+' : '') + e.pct.toFixed(1) + '%)';
                 }).join('');
        })()
      + (fax !== null ? ' Fax=' + (fax>=0?'+':'') + fax.toFixed(6) + ' R=' + L.toFixed(4) : '')
      // PER-KERNEL x-FORCE (Ha/bohr) for every charged kernel. For a symmetric molecule (BeH2) the net
      // force cancels by symmetry, so Fsum says nothing; the H's own F_x is the bond-stretch force
      // (H at +x with F_x > 0 is pushed outward: the bond wants to be LONGER than held).
      + (function () {
          var Fk = window.nucForce, nk = window._nuclei; if (!Fk || !nk) return '';
          var o = [];
          nk.forEach(function (n, a) { if (n.Z > 0 && Fk[a]) o.push(labels[a] + ':' + (Fk[a][0] >= 0 ? '+' : '') + Fk[a][0].toFixed(5)); });
          return o.length >= 2 ? ' Fx=[' + o.join(' ') + ']' : '';
        })()
      + ' VKK=' + (vkk === undefined ? 'n/a' : vkk.toFixed(4)) + '/' + vkkRef.toFixed(4)
      // TERM BY TERM, so a difference against another implementation can be localised to one
      // integral rather than inferred from the total. p5 prints [T, Vee+VeK, VKK] and Vee, so
      // VeK = (Vee+VeK) - Vee recovers its fourth term and all four are comparable.
      + (window._E_T !== undefined ? ' [T=' + window._E_T.toFixed(4)
          + ' VeK=' + window._E_eK.toFixed(4)
          + ' Vee=' + window._E_ee.toFixed(4)
          + ' VKK=' + window._E_KK.toFixed(4) + ']' : '')
      // ASSEMBLED-FIELD KINETIC ENERGY, the overlap-defect meter (mol_fast.js NRED_SLOTS comment).
      // Tpsi = 1/2 int |grad(sum_m w_m u_m)|^2 against the per-domain T beside it; Npsi = int Psi^2,
      // which must be read FIRST -- Tpsi is only comparable to T when Npsi is near the electron
      // count, since sum_m w_m is not constrained to 1 here. gap = T - Tpsi, predicted POSITIVE.
      + (window._T_psi !== undefined ? ' [Tpsi=' + window._T_psi.toFixed(4)
          + ' gap=' + window._T_psi_gap.toFixed(4)
          + ' Npsi=' + window._N_psi.toFixed(4) + '/'
          + targets.reduce(function (s, t) { return s + t; }, 0).toFixed(0)
          // SAME-PASS norm, the diagnostic's real self-test: for ONE domain Npsi <= normraw
          // exactly. q_u/q_uw below come from a DIFFERENT readback and must not be used for this.
          + ' normraw=' + (window._norm_raw || []).map(function (q) { return q.toFixed(4); }).join(',')
          + ']' : '')
      // ROBIN SURFACE MEASURE, sum_m INT u_m^2 |grad w_m| dV -- the phase-field form of
      // INT_Gamma u^2 dS, which is what a Robin beta needs and what lets beta live in mol_fast
      // without cut cells. Printed HALVED, because summing over all m counts each interface twice
      // (once per side), so Ssurf/2 is what compares with axisym's 0.496 for H2 at D=2.1.
      + (window._S_surf !== undefined ? ' Ssurf/2=' + (window._S_surf/2).toFixed(4) : '')
      + (qp.get('dyn') ? ' dR=' + maxRad.toFixed(1) + '% dAng=' + maxAng.toFixed(2) + 'deg' : '')
      + ' soft=' + window.USER_SOFT.toFixed(2) + ' eps=' + (window.USER_SOFT*h).toFixed(3)
      + (FREE.length ? ' free=[' + FREE.join(',') + ']' : '')
      + ' rc=' + USER_RC.toFixed(3) + M.atoms.map(function (a) { return a.el; }).filter(function (e, i, A) { return A.indexOf(e) === i; }).map(function (e) {
          var v = qp.get('rc' + e), w = qp.get('soft' + e);   // every element present, not just C/N/O
          return (v !== null ? ' rc' + e + '=' + parseFloat(v).toFixed(3) : '') + (w !== null ? ' soft' + e + '=' + parseFloat(w).toFixed(3) : ''); }).join('') + (window.USER_CLAMP_RC ? ' CLAMP' : '')
      + (SAX ? ' sax=[' + SAX.join(',') + ']' : '')
      + (window.USER_CORE_SYMM ? ' corefix=1' : '')
      + ' rinit=' + window.USER_R_INIT + ' wdiff=' + (window.USER_W_DIFF !== undefined ? window.USER_W_DIFF : 0.05)
      + ' wkinw=' + (window.USER_W_KIN_WEIGHT ? 1 : 0)
      + ' wkingate=' + (window.USER_W_KIN_GATE !== undefined ? window.USER_W_KIN_GATE : 0.1)
      + ' wfloor=' + (window.USER_W_FLOOR !== undefined ? window.USER_W_FLOOR : 0)
      + ' wadv=' + (window.USER_W_ADV !== undefined ? window.USER_W_ADV : 1)
      + ' wd=' + (window.USER_WEIGHTED_DENSITY ? 1 : 0)
      + ' udecay=' + (window.USER_U_DECAY !== undefined ? window.USER_U_DECAY : 0)
      + ' uzero=' + (window.USER_U_ZERO_INIT ? 1 : 0)
      + ' fn=' + (window.USER_FACE_NEUMANN ? 1 : 0)
      + ' zinit=' + (nuclei[0] && nuclei[0].z_init !== undefined ? nuclei[0].z_init : 'dflt') + qReport
      + ' | n=' + N + ' box=' + box + ' h=' + h.toFixed(4) + ' nat=' + M.atoms.length + ' ndom=' + nuclei.length;
    // ?log=1: echo the title to the console, so a HEADLESS Chrome run (--enable-logging=stderr)
    // can be read without AppleScript or a visible window.
    if (qp.get('log') === '1') console.log(document.title);
  }, 1500);
})();

// ?build=<seed> STAGE CONTROLLER. Per stage: (1) DENSITY with kernels held, until E changes by less
// than ethr over 4000 steps; (2) RELAX with kernels released, until max|F| < ftol on three polls
// (or a step cap); (3) add the next H warm along its pre-drawn direction from the CURRENT heavy atom.
// After the last stage: kernels held again and a STEP LADDER (E at +4k/+8k/+16k/+32k steps), since a
// 4000-step energy carries no information below ~10 kcal/mol.
(function () {
  var B = window.BUILD_CFG; if (!B) return;
  var qpB = new URLSearchParams(location.search), LOGB = qpB.get('log') === '1';
  var div = document.createElement('pre');
  div.id = 'buildrep';
  div.style.cssText = 'position:fixed;left:0;bottom:0;max-height:40%;overflow:auto;margin:0;padding:6px;'
    + 'background:rgba(0,0,0,.8);color:#cfc;font:11px monospace;z-index:60;white-space:pre-wrap';
  document.addEventListener('DOMContentLoaded', function () { document.body.appendChild(div); });
  var lines = [], KEY = 'build_' + B.mol + '_s' + B.seed + (B.direct ? '_direct' : '');
  function say(s) {
    lines.push(s); div.textContent = lines.join('\n');
    if (LOGB) console.log('[BUILD] ' + s);
    try { localStorage.setItem(KEY, lines.join('\n')); } catch (e) {}
  }
  var nAct = B.direct ? B.n - 1 : 1;     // number of ACTIVE H
  function geo() {
    var N = window.nuclei, c = N[0], d = [], u = [], ang = [];
    for (var a = 1; a <= nAct; a++) {
      var v = [(N[a].i - c.i) * B.h, (N[a].j - c.j) * B.h, (N[a].k - c.k) * B.h], r = Math.hypot(v[0], v[1], v[2]);
      d.push(r); u.push([v[0] / r, v[1] / r, v[2] / r]);
    }
    for (var x = 0; x < u.length; x++) for (var y = x + 1; y < u.length; y++)
      ang.push(Math.acos(Math.max(-1, Math.min(1, u[x][0]*u[y][0] + u[x][1]*u[y][1] + u[x][2]*u[y][2]))) * 180 / Math.PI);
    return { d: d, ang: ang };
  }
  function fmax() {
    var F = window.nucForce || [], m = 0;
    for (var a = 0; a <= nAct; a++) if (F[a]) m = Math.max(m, Math.hypot(F[a][0], F[a][1], F[a][2]));
    return m;
  }
  function rep(tag) {
    var G = geo();
    say(tag + '  step=' + window._tStep + '  E=' + (+window._E).toFixed(6) + '  |F|max=' + fmax().toFixed(4)
      + '  X-H=' + G.d.map(function (x) { return x.toFixed(4); }).join(' ')
      + (G.ang.length ? '  HXH=' + G.ang.map(function (x) { return x.toFixed(2); }).join(' ') : '')
      + '  mu=' + (window._mu_mag !== undefined ? (+window._mu_mag * 2.541746).toFixed(4) + ' D' : '?'));
    return G;
  }
  say('build seed=' + B.seed + (B.direct ? ' DIRECT' : '') + '  mol=' + B.mol + '  dch=' + B.dch.toFixed(4)
    + '  ftol=' + B.ftol + '  ethr=' + B.ethr + '  h=' + B.h.toFixed(4)
    + '  dirs=' + JSON.stringify(B.dirs.map(function (v) { return v.map(function (x) { return +x.toFixed(3); }); })));
  var sub = 'density', hist = [], okP = 0, t0 = 0, ladder = null, busy = false;
  setInterval(async function () {
    if (busy || window._tStep === undefined || window._E === undefined || !window.setDynamics) return;
    var t = window._tStep, E = +window._E;
    if (sub === 'density' || sub === 'final') {
      hist.push([t, E]);
      while (hist.length > 2 && t - hist[1][0] >= 4000) hist.shift();
      if (hist.length >= 2 && t - hist[0][0] >= 4000 && Math.abs(E - hist[0][1]) < B.ethr) {
        if (sub === 'density') {
          rep('[n=' + nAct + '] density converged, kernels held');
          sub = 'relax'; okP = 0; t0 = t; window.setDynamics(true);
        } else {
          rep('[FINAL] density converged at the relaxed geometry');
          sub = 'ladder'; ladder = { t0: t, marks: [4000, 8000, 16000, 32000], E: [] };
        }
      }
    } else if (sub === 'relax') {
      okP = (fmax() < B.ftol && t - t0 > 4000) ? okP + 1 : 0;
      var cap = t - t0 > 400000;
      if (okP >= 3 || cap) {
        window.setDynamics(false);
        rep('[n=' + nAct + '] relaxed' + (cap ? '  (STEP CAP HIT -- not converged)' : ''));
        if (nAct < B.n - 1) {
          busy = true;
          var c = window.nuclei[0], d = B.dirs[nAct];
          nAct++;
          var pos = { i: c.i + B.dch * d[0] / B.h, j: c.j + B.dch * d[1] / B.h, k: c.k + B.dch * d[2] / B.h };
          var r = await window.addDomainWarm(nAct, pos, B.Z[nAct], B.targets[nAct]);
          say('[add H' + nAct + '] claimed ' + r.claimed + ' cells');
          hist = []; sub = 'density'; busy = false;
        } else { hist = []; sub = 'final'; }
      }
    } else if (sub === 'ladder') {
      while (ladder.marks.length && t - ladder.t0 >= ladder.marks[0]) {
        say('  ladder +' + ladder.marks[0] + ' steps: E=' + E.toFixed(6) + '  |F|max=' + fmax().toFixed(4));
        ladder.marks.shift();
      }
      if (!ladder.marks.length) {
        var G = rep('[RESULT]');
        say('RESULT ' + KEY + '  mean X-H=' + (G.d.reduce(function (s, x) { return s + x; }, 0) / G.d.length).toFixed(4)
          + '  HXH-109.47: ' + G.ang.map(function (x) { return (x - 109.4712).toFixed(2); }).join(' '));
        sub = 'done';
        try { localStorage.setItem(KEY + '_done', '1'); } catch (e) {}
      }
    }
  }, 1000);
})();

// BOTH solvers define setup()/draw() for p5 and sit inert until p5 drives them, so p5 must load
// AFTER the solver. A plain <script src> for the solver alone yields no canvas, no iteration and
// no energies -- silently, with the page looking fine. Made this mistake twice in one session.
var s = document.createElement('script');
s.src = 'mol_fast.js?t=' + Date.now();
s.onload = function () {
  var p = document.createElement('script');
  p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
  document.body.appendChild(p);
};
document.body.appendChild(s);
</script>
</body></html>
