<!DOCTYPE html>
<html><body style="margin:0;background:#000;color:#fff;font-family:monospace">
<div id="results" style="position:fixed;bottom:8px;left:8px;background:rgba(0,0,0,0.85);border:1px solid #444;padding:6px 8px;z-index:100;font-size:10px;line-height:1.25;max-width:340px"></div>
<pre id="log" style="margin:0;padding:8px;color:#8cf">Building GAD65 decarboxylation scan...</pre>
<script>
// ===========================================================================
//  GAD65 / PLP decarboxylation : ELECTRON-SINK scan  (clamped E vs Ca-CO2 distance)
// ---------------------------------------------------------------------------
//  Drives the breaking Ca-COO bond outward (the CO2 that leaves) in fixed steps and
//  records the RealQM total energy at each step, for TWO electronic environments:
//    * 'PLP'  : glutamate as the PLP external aldimine -- conjugated pyridinium imine
//               (the electron sink that can soak up the carbanion left when CO2 goes);
//    * 'free' : the SAME glutamate as a free amino acid (-NH3+), NO conjugation/sink.
//  Each (variant,R) clamps all nuclei (USER_DYNAMICS=false), relaxes the electron
//  density to convergence -> onSweepDone(E), then reloads for the next point.
//  READ-OUT: the energy RISE dE(R)=E(R)-E(R0) for each variant. If the PLP rise is
//  shallower than the free rise, that gap is the electron-sink stabilisation -- PLP's
//  job -- quantified, even though neither case spontaneously reacts in gas phase.
//  EXPLORATORY: hand-built geometry, gas-phase, no protein/phosphate/water.
// ===========================================================================
var variants = ['PLP', 'free'];
// steps=<n> in the URL drives the convergence ladder; default is the production count.
var STEPS = parseInt((location.search.match(/[?&]steps=(\d+)/) || [])[1] || '4000', 10);
// relaxall=1 : release EVERY nucleus and see how far the hand-built geometry moves.
// This model's coordinates were typed in as idealised bond lengths and angles and have never
// been relaxed against this functional. If they sit far from any minimum of it, then every
// number the model has produced was computed somewhere the functional does not want to be.
// The answer is a displacement, in Angstrom -- not an energy, so it does not depend on the
// energy scale that is in doubt.
var RELAXALL = /[?&]relaxall=1/.test(location.search);
var Rlist = [1.55, 2.00, 2.60, 3.30, 4.20, 5.00, 6.00];   // Ca-CO2 distance (Angstrom)  [7 pts -> 14 runs; reaches separation to see the sink saturate]
// Targeted runs for the convergence ladder and the quinonoid readout:
//   ?only=PLP&R=6.00&steps=4000   runs ONE point instead of all 14.
(function(){
  var q = location.search;
  var o = (q.match(/[?&]only=(PLP|free)/) || [])[1];
  if (o) variants = [o];
  var r = (q.match(/[?&]R=([\d.]+)/) || [])[1];
  if (r) Rlist = [parseFloat(r)];
})();
var A = 1.8897;

var vIdx = 0, rIdx = 0, results = { PLP:{}, free:{} };
// The quinonoid question: after CO2 departs, does the charge sit on Ca or on C4'?  Those are the
// two protonation sites -- Ca gives product and regenerates PLP, C4' gives PMP and the APO enzyme.
// Atom indices in buildAtoms(): Ca = 0 always; C4' = 21 in the PLP variant (core is 0..8, then the
// PLP block: N9, C10-14, H15-18, O19, H20, C21=C4', H22, N23=N7).  The free variant has no C4'.
var IDX_CA = 0, IDX_C4P = 21;
var extras = { PLP:{}, free:{} };
(function(){ var s = sessionStorage.getItem('gadScan');
  if (s){ var st = JSON.parse(s); vIdx=st.vIdx; rIdx=st.rIdx; results=st.results; if (st.extras) extras=st.extras; sessionStorage.removeItem('gadScan'); } })();

function buildAtoms(withPLP, R) {
  // [el, x, y, z] Angstrom.  glutamate core + CO2 unit at z=R; PLP ring (sink) in xy-plane.
  var c = [
    ['C', -2.299, -4.394, 0.000],   // 0 Ca
    ['H', -2.299, -4.394,-1.090],   //   Ca-H
    ['C', -2.299, -4.394, R],        //   Ccoo  (the CO2 carbon, at distance R along +z)
    ['O', -2.299, -3.344, R+0.68],   //   O1
    ['O', -2.299, -5.444, R+0.68],   //   O2
    ['C', -3.40,  -5.40,  0.000],   //   Cb methyl  (substrate truncated to ALANINE: the glutamate
    ['H', -4.00,  -5.00,  0.800],   //   side chain is a spectator for the Ca-COO cleavage; cut for speed)
    ['H', -4.00,  -5.00, -0.800],
    ['H', -3.60,  -6.40,  0.000],
  ];
  if (withPLP) {
    c = c.concat([
      ['N',  0.000,  1.390, 0.000],  // pyridinium ring (electron sink)
      ['C', -1.204,  0.695, 0.000],
      ['C', -1.204, -0.695, 0.000],
      ['C',  0.000, -1.390, 0.000],
      ['C',  1.204, -0.695, 0.000],
      ['C',  1.204,  0.695, 0.000],
      ['H',  0.000,  2.390, 0.000],  // N1-H (protonated -> sink)
      ['H', -2.139,  1.235, 0.000],
      ['H',  2.139, -1.235, 0.000],
      ['H',  2.139,  1.235, 0.000],
      ['O', -2.382, -1.375, 0.000],  // 3-OH
      ['H', -1.887, -2.209, 0.000],
      ['C',  0.000, -2.890, 0.000],  // C4' imine carbon
      ['H',  0.940, -3.400, 0.000],
      ['N', -1.070, -3.590, 0.000],  // N7 (=C4', bonded to Ca)
    ]);
  } else {
    c = c.concat([
      ['N', -1.20, -3.50, 0.000],    // free -NH3+ on Ca (no conjugation/sink)
      ['H', -0.50, -3.10, 0.300],
      ['H', -0.90, -4.30,-0.300],
      ['H', -1.95, -3.10,-0.300],
    ]);
  }
  return c;
}

if (vIdx < variants.length) {
  var variant = variants[vIdx], R = Rlist[rIdx];
  var coords = buildAtoms(variant === 'PLP', R);
  var gridN = 160, scr = 38, gN2 = Math.round(gridN/2), h = scr/gridN;   // coarser grid (160^3) + tighter box -> faster  (gN2: avoid clobbering molecule.js global N2)
  var Zof = { H:1, C:4, N:3, O:2 }, RCof = { H:0, C:0.3, N:0.3, O:0.8 };
  var atoms = [], zList = [], rcList = [];
  for (var n=0; n<coords.length; n++) {
    var el = coords[n][0];
    var gi = Math.max(3, Math.min(gridN-3, Math.round(gN2 + coords[n][1]*A/h)));
    var gj = Math.max(3, Math.min(gridN-3, Math.round(gN2 + coords[n][2]*A/h)));
    var gk = Math.max(3, Math.min(gridN-3, Math.round(gN2 + coords[n][3]*A/h)));
    atoms.push({ i:gi, j:gj, k:gk, Z:Zof[el], el:el });
    zList.push(Zof[el]); rcList.push(RCof[el]);
  }
  document.getElementById('log').textContent =
    'GAD65 decarb scan: variant=' + variant + '  R(Ca-CO2)=' + R.toFixed(2) + ' A  ('
    + (vIdx*Rlist.length + rIdx + 1) + '/' + (variants.length*Rlist.length) + ')  ' + atoms.length + ' atoms';

  window.USER_BOND_PAIRS = [[0, 2, "Ca-CO2:"]];
  window.USER_REFERENCE = { energy: "GAD65 PLP decarboxylation electron-sink scan (clamped E vs Ca-CO2)" };
  window.USER_NN = gridN;
  window.USER_ATOMS = atoms;
  window.USER_SCREEN = scr;
  // FIXED-STEP PROTOCOL. The energy-plateau test ("3 frames within 0.01") halted at a different
  // step count for every one of the 14 runs, so no two points were relaxed to the same degree --
  // that is the whole +-0.5-0.8 scatter, and it is not physics. Stop every run at the SAME step
  // count instead. CONVERGENCE_THRESHOLD must be falsy to disable the plateau test (molecule.js
  // 5699), and NO_AUTO_DYNAMICS guards the branch that would otherwise switch on dynamics at
  // 10000 steps (molecule.js 5693). onSweepDone then fires at phaseSteps >= TOTAL_STEPS (5722).
  window.USER_STEPS = STEPS;
  window.NO_AUTO_DYNAMICS = true;
  window.USER_DYNAMICS = RELAXALL;              // clamped -> E(R), unless we are testing the geometry
  if (RELAXALL) {
    window.USER_N_MOVE = 20;
    window.USER_DAMPING = 0.85;                 // settle, do not ring
    window._startPos = atoms.map(function(a){ return [a.i, a.j, a.k]; });
    window._hA = h / A;                          // Angstrom per cell
  }
  // Exclude self-interaction EXACTLY, every step. Without this, NELEC=24 selects the
  // total-Poisson+SIC path with SIC_INTERVAL=5 frames = every 250 steps: in between, PotherBuf
  // holds the TOTAL potential, so each electron feels its own charge, and E_ee is read off that
  // buffer regardless. Whether the stopping frame happened to be a SIC frame is arbitrary -- which
  // is a candidate for both the +-0.5-0.8 scatter and the ~100x magnitude. The direct path builds
  // P_direct[m] = sum_{n != m} 0.5/r per electron per step, so i != j is exact and always applied.
  // Costs N Poisson solves per step; at 24 domains on 160^3 that is affordable.
  window.USER_DIRECT_POTHER = true;
  window.USER_Z = zList;
  window.USER_RC = rcList;
  window.CONVERGENCE_THRESHOLD = 0;             // OFF -- see FIXED-STEP PROTOCOL above
}

function render() {
  var div = document.getElementById('results');
  function rise(v){ var e0 = results[v][Rlist[0]]; if (e0===undefined) return null;
    return Rlist.map(function(R){ var e=results[v][R]; return e===undefined?undefined:e-e0; }); }
  var rP = rise('PLP'), rF = rise('free');
  var html = '<b style="color:#0cf">GAD65 / PLP decarboxylation &mdash; electron-sink scan</b><br>'
    + '<span style="color:#888;font-size:11px">reaction energy &Delta;E(R)=E(R)&minus;E(R<sub>0</sub>) of CO<sub>2</sub> departure (negative = downhill/exothermic); '
    + 'sink = free&minus;PLP = extra stabilisation from the pyridinium ring</span><br><br>'
    + '<table style="border-collapse:collapse"><tr style="color:#0cf"><th style="padding:1px 6px">R (&Aring;)</th>'
    + '<th>&Delta;E free</th><th>&Delta;E PLP</th><th>sink (free&minus;PLP)</th></tr>';
  var cur = (vIdx<variants.length) ? {v:variants[vIdx], R:Rlist[rIdx]} : null;
  for (var i=0;i<Rlist.length;i++){
    var R=Rlist[i];
    var df = rF?rF[i]:undefined, dp = rP?rP[i]:undefined;
    var sink = (df!==undefined && dp!==undefined) ? df-dp : undefined;
    var running = cur && cur.R===R && (results[cur.v][R]===undefined);
    html += '<tr'+(running?' style="color:#ff0"':'')+'><td style="padding:1px 6px">'+R.toFixed(2)+'</td>'
      + '<td>'+(df!==undefined?df.toFixed(3):(running&&cur.v==='free'?'run…':'—'))+'</td>'
      + '<td>'+(dp!==undefined?dp.toFixed(3):(running&&cur.v==='PLP'?'run…':'—'))+'</td>'
      + '<td style="color:#0f0">'+(sink!==undefined?(sink>=0?'+':'')+sink.toFixed(3):'')+'</td></tr>';
  }
  html += '</table>';
  if (rP && rF && rP[Rlist.length-1]!==undefined && rF[Rlist.length-1]!==undefined){
    var dF = rF[Rlist.length-1], dP = rP[Rlist.length-1], s = dF - dP;
    function word(d){ return d<0 ? 'releases '+(-d).toFixed(3) : 'costs '+d.toFixed(3); }
    html += '<br>At R='+Rlist[Rlist.length-1].toFixed(2)+' &Aring; (CO<sub>2</sub> departure): free '+word(dF)
      +', PLP '+word(dP)+' &rarr; '
      + '<b style="color:'+(s>0?'#0f0':'#f55')+'">'+(s>0?'PLP adds '+s.toFixed(3)+' extra stabilisation (electron sink)':'no sink benefit ('+s.toFixed(3)+')')+'</b>'
      + ' <span style="color:#888">(Ha, model units &mdash; sign/trend only, not calibrated)</span>';
  }
  if (vIdx>=variants.length) html += '<br><span style="color:#0f0">Done.</span>';
  div.innerHTML = html;
}
render();

window.onSweepDone = function(E){
  results[variants[vIdx]][Rlist[rIdx]] = E;
  if (RELAXALL && window._nucPos && window._startPos) {
    // how far did the hand-built geometry travel once released?
    var n = window._startPos.length, sum = 0, mx = 0, worst = -1, per = [];
    for (var i = 0; i < n; i++) {
      var p0 = window._startPos[i], p1 = window._nucPos[i];
      var d = Math.sqrt(Math.pow(p1[0]-p0[0],2)+Math.pow(p1[1]-p0[1],2)+Math.pow(p1[2]-p0[2],2)) * window._hA;
      per.push(Number(d.toFixed(3))); sum += d*d;
      if (d > mx) { mx = d; worst = i; }
    }
    var rec = { relaxall: true, steps: STEPS, E: E, nAtoms: n,
                rmsd: Number(Math.sqrt(sum/n).toFixed(4)),
                maxDisp: Number(mx.toFixed(4)), worstAtom: worst, per: per };
    try { localStorage.setItem('gad65_relaxall', JSON.stringify(rec)); } catch(e){}
    console.log('=== RELAXALL ===', JSON.stringify(rec));
  }
  // electronic force on each nucleus is the cheap proxy for where the density went; the dipole
  // components are already computed every run (ring lies in xy, CO2 departs along +z).
  try {
    var fE = window._nucForceElec || [], v = variants[vIdx];
    extras[v][Rlist[rIdx]] = {
      fCa:  fE[IDX_CA]  ? fE[IDX_CA].slice()  : null,
      fC4p: (v === 'PLP' && fE[IDX_C4P]) ? fE[IDX_C4P].slice() : null,
      dip:  [window._dip_x, window._dip_y, window._dip_z],
      steps: STEPS
    };
    console.log('EXTRAS ' + v + ' R=' + Rlist[rIdx] + ' ' + JSON.stringify(extras[v][Rlist[rIdx]]));
  } catch (e) { console.warn('extras capture failed', e); }
  render();
  rIdx++; if (rIdx>=Rlist.length){ rIdx=0; vIdx++; }
  if (vIdx < variants.length){
    sessionStorage.setItem('gadScan', JSON.stringify({vIdx:vIdx, rIdx:rIdx, results:results, extras:extras}));
    setTimeout(function(){ location.reload(); }, 600);
  } else {
    console.log('=== GAD65 decarb scan done ===', JSON.stringify(results));
    console.log('=== EXTRAS (charge readout) ===', JSON.stringify(extras));
    try { localStorage.setItem('gad65_extras', JSON.stringify({results:results, extras:extras, steps:STEPS})); } catch(e){}
  }
};

if (vIdx < variants.length){
  var s = document.createElement('script');
  s.src = 'molecule.js?t=' + Date.now();
  s.onload = function(){
    var p = document.createElement('script');
    p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
    document.body.appendChild(p);
  };
  document.body.appendChild(s);
}
</script>
</body></html>
