<!DOCTYPE html>
<html><body style="margin:0;background:#000;color:#fff;font-family:monospace">
<div id="results" style="position:fixed;top:10px;right:10px;background:rgba(0,0,0,0.85);border:1px solid #444;padding:10px;z-index:100;font-size:13px;max-height:90vh;overflow-y:auto;min-width:420px"></div>
<script>
// X2 with +2 kernel per atom (4 electrons total) vs r_c
// Compare E(R=5) and E(R=8) to get binding energy
// 15 au screen, 150^3 grid

// ?rc= and ?bonds= -- so the scan can be driven without editing the file.  Defaults are
// the previous hardcoded values, so an unparameterised load behaves exactly as before.
//
// WHY THE DEFAULTS WERE NOT A BOND-LENGTH SCAN.  R = 5 and 7 au are both far outside any
// real Z=2 diatomic bond, which sits near 2.3 au (O2 is 1.21 A = 2.28 au).  Those two points
// give a BINDING ENERGY between two long separations; they cannot show whether E(R) has a
// minimum.  This is the minimal test of the open question as of 2026-10-31: two identical
// CLAMPED heavy kernels, one Z, one r_c, one covalent bond, no angle -- does the force
// vanish anywhere?  ClO2, NO2 and O3 all failed it, and every geometry that works in the
// collection has hydrogen (r_c = 0, unclamped) on at least one side of the bond.
var _q = new URLSearchParams(location.search);
var rcValues = [parseFloat(_q.get('rc') || '0.5')];
var bondLengths = (_q.get('bonds') || '5.0,7.0').split(',').map(parseFloat);

var rcIdx = 0;
var bondIdx = 0;
var allResults = [];
var currentResults = [];

var N = 200, scr = 12;  // h=0.06, better kernel resolution
var hg = scr / N;
var ci = Math.round(N / 2);

function currentRc() { return rcValues[rcIdx]; }

function makeAtoms(bond) {
  var halfCells = Math.round(0.5 * bond / hg);
  return [
    { i: ci - halfCells, j: ci, Z: 2, el: 'X' },
    { i: ci + halfCells, j: ci, Z: 2, el: 'X' }
  ];
}

// Restore
(function() {
  var saved = sessionStorage.getItem('x2_z2_rc_progress');
  if (saved) {
    var state = JSON.parse(saved);
    rcIdx = state.rcIdx;
    allResults = state.allResults;
    sessionStorage.removeItem('x2_z2_rc_progress');
  }
})();

window.USER_NN = N;
window.USER_SCREEN = scr;
window.USER_ATOMS = makeAtoms(bondLengths[0]);
window.USER_STEPS = 50000;
window.USER_Z = [2, 2];
window.USER_RC = [currentRc(), currentRc()];
window.USER_DYNAMICS = false;
window.NO_AUTO_DYNAMICS = true;
window.CONVERGENCE_THRESHOLD = parseFloat(_q.get('conv') || '0.01');

function updateTable() {
  // Rewritten 2026-10-31.  The old table had TWO hardcoded columns, E(R=5) and E(R=7), and
  // printed "running bond n/2" -- it could only ever display a binding energy between two
  // fixed separations.  The sweep handler itself is generic and collects every bond length,
  // so the data were there and the display was throwing them away.  This prints the whole
  // E(R) curve, flags the minimum, and shows each point's step count so an unconverged or
  // halted point cannot be mistaken for a converged one.
  var div = document.getElementById('results');
  var html = '<b style="color:#0cf">X2 (Z=2) vs R</b><br>';
  html += '<span style="color:#888;font-size:11px">+2 kernel each, 4 electrons, two CLAMPED '
        + 'kernels, r_c=' + currentRc().toFixed(2) + ', ' + N + '^3 / ' + scr + ' au, h='
        + hg.toFixed(3) + '</span><br>';
  html += '<span style="color:#888;font-size:11px">does the force vanish anywhere? a real '
        + 'Z=2 diatomic bond is near 2.3 au</span><br><br>';
  var res = (allResults[rcIdx] && allResults[rcIdx].length) ? allResults[rcIdx] : currentResults;
  html += '<table style="border-collapse:collapse"><tr style="color:#0cf;border-bottom:1px solid #444">'
        + '<th style="padding:3px 10px">R (au)</th><th style="padding:3px 10px">E (Ha)</th>'
        + '<th style="padding:3px 10px">dE</th><th style="padding:3px 10px">steps</th></tr>';
  var lo = null;
  for (var k = 0; k < res.length; k++) if (lo === null || res[k].E < res[lo].E) lo = k;
  for (var k = 0; k < res.length; k++) {
    var d = (k > 0) ? (res[k].E - res[k-1].E) : NaN;
    var isMin = (k === lo && k > 0 && k < res.length - 1);
    html += '<tr' + (isMin ? ' style="color:#0f0;font-weight:bold"' : '') + '>'
          + '<td style="padding:3px 10px">' + res[k].bond.toFixed(2) + '</td>'
          + '<td style="padding:3px 10px">' + res[k].E.toFixed(5) + '</td>'
          + '<td style="padding:3px 10px">' + (isFinite(d) ? (d>0?'+':'') + d.toFixed(5) : '--') + '</td>'
          + '<td style="padding:3px 10px">' + res[k].steps + '</td>'
          + (isMin ? '<td style="color:#0f0">&lt;-- MINIMUM</td>' : '') + '</tr>';
  }
  if (bondIdx < bondLengths.length)
    html += '<tr style="color:#666"><td style="padding:3px 10px">'
          + bondLengths[bondIdx].toFixed(2) + '</td><td colspan="3">running '
          + (bondIdx+1) + '/' + bondLengths.length + '</td></tr>';
  html += '</table>';
  // INTERIOR minimum or not -- the one thing the run is for, stated outright.
  if (res.length === bondLengths.length) {
    html += (lo > 0 && lo < res.length - 1)
      ? '<br><b style="color:#0f0">INTERIOR MINIMUM at R = ' + res[lo].bond.toFixed(2) + ' au</b>'
      : '<br><b style="color:#f80">NO INTERIOR MINIMUM -- lowest point is at the '
        + (lo === 0 ? 'INNER' : 'OUTER') + ' end of the scan</b>';
  }
  div.innerHTML = html;
  try { localStorage.setItem('x2_z2_curve', JSON.stringify(res)); } catch (e) {}
}

updateTable();

window.onSweepDone = function(Emin, steps) {
  currentResults.push({ bond: bondLengths[bondIdx], E: Emin, steps: steps });
  console.log('r_c=' + currentRc() + ' R=' + bondLengths[bondIdx] + ' E=' + Emin.toFixed(6));
  updateTable();
  bondIdx++;
  if (bondIdx < bondLengths.length) {
    var atoms = makeAtoms(bondLengths[bondIdx]);
    window.restartWithPositions(atoms.map(function(a) { return [a.i, a.j]; }));
  } else {
    allResults[rcIdx] = currentResults.slice();
    rcIdx++;
    bondIdx = 0;
    currentResults = [];
    updateTable();
    if (rcIdx < rcValues.length) {
      sessionStorage.setItem('x2_z2_rc_progress', JSON.stringify({ rcIdx: rcIdx, allResults: allResults }));
      location.reload();
    } else {
      console.log('=== COMPLETE ===');
    }
  }
};

var s = document.createElement('script');
s.src = 'molecule.js?t=' + Date.now();
s.onload = function() {
  var p = document.createElement('script');
  p.src = 'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js';
  document.body.appendChild(p);
};
document.body.appendChild(s);
</script>
</body></html>
