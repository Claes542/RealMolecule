<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>RealQM Atom Simulator — 6-Shell Structure</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    /* The canvas must sit at page origin. p5's .position() places sliders and buttons at
       absolute PAGE coordinates, while text() draws in CANVAS coordinates; centring the canvas
       separates the two by the centring offset, so on a wide window every control ends up to
       the left of the label that names it. Anchoring at 0,0 keeps the two coordinate systems
       identical at any window width. */
    body { margin: 0; background: #111; }
    canvas { display: block; }
  </style>
</head>
<body>
<script>
// RealQM Atom Simulator: spherically symmetric N-shell structure (up to 6 shells)
// Radial 1D solver: u(r) electron density, P(r) Poisson potential, K(r) = Z/r kernel
// Free boundary between shells established by continuity of u(r)
// ITP: du/dt = 0.5*(d2u/dr2 + 2/r*du/dr) + K*u - 2*P*u

const MAXSHELLS = 24;   // enough cap-4 shells for the full periodic table (2 + 21*4 = 86)
let u = [], Karr = [], P = [];
let Z;
let Es = new Array(MAXSHELLS).fill(0);  // electrons per shell; Es[0] typically 2
Es[0] = 2;
let Ered = [];   // self-interaction reduction (E-1)/E per shell
let M = [];      // boundary indices: M[0]=0, M[1..NSHELLS] = shell boundaries, M[NSHELLS]=N
let NSHELLS = 1;
let N = 400;
let h, dt, D = 7;
let diff = 0.001;
let running = false;
let step = 0;
let energy = new Array(MAXSHELLS).fill(0);
let normu = new Array(MAXSHELLS).fill(0);
let eps = new Array(MAXSHELLS).fill(0);   // per-shell orbital eigenvalue (full 2P), for ionization energy

// Observed ground state energies
const observed = {
  '3:2+1': { E: -7.48, name: 'Li', fix: 0.1, D: 5 },
  '3:2': { E: -7.28, name: 'Li+', fix: 0.2, D: 5 },
  '4:2+2': { E: -14.47, name: 'Be', fix: 0.1, D: 5 },
  '4:2': { E: -13.65, name: 'Be2+', fix: 0.4, D: 5 },
  '5:2+2+1': { E: -24.53, name: 'B', fix: 0.1, D: 7 },
  '6:2+2+2': { E: -37.7, name: 'C', fix: 0, D: 7 },
  '7:2+3+2': { E: -54.6, name: 'N', fix: 0, D: 7 },
  '8:2+3+3': { E: -74.8, name: 'O', fix: 0, D: 7 },
  '9:2+4+3': { E: -99.8, name: 'F', fix: 0, D: 7 },
  '10:2+4+4': { E: -128.5, name: 'Ne', fix: 0, D: 7 },
  // Extended atoms (6 shells possible)
  '11:2+4+4+1': { E: -162.0, name: 'Na', fix: 0, D: 10 },
  '12:2+4+4+2': { E: -198.0, name: 'Mg', fix: 0, D: 10 },
  '18:2+4+4+4+4': { E: -527.5, name: 'Ar', fix: 0, D: 10 },
  '36:2+4+4+4+4+4+4+4+4+4': { E: -2752, name: 'Kr', fix: 0, D: 12 },
};

let sliderZ, sliders = [], btnStart, btnReset, btnLog, btnSweep, btnFull, btnFull2, inpZmax;
let batchRunning = false, sweepStatus = '';
// Full-table run: show the radial densities for each element in turn instead of a status line.
let batchPlot = false, batchCaption = '', batchNote = '';
let fullRows = [];   // live results of the periodic-table scan, drawn as a table while it runs
// Pseudo-kernel valence mode: replace nucleus+core by Z_ker/max(r,r_c), solve valence only.
let PK_MODE = false, PK_Zker = 8, PK_rc = 0.5, cuspZ = 0, btnVal, btnG12, btnCC, btnCalib, btnRow3, btnIC, btnISC, btnMGPT, btnTE, btnTM, btnConv, btnGrid;
let innerSphere = false;  // analytic inner-sphere cusp correction (R_SING=2h) on the 1s shell; OFF (Z<19 uses uncorrected code)
let ptPanel = null;       // on-screen results panel: per-atom {p,g,el,eE,eI} from the frozen-core sweep
const shellColors = [
  [255, 60, 60],    // shell 0: red
  [60, 200, 60],    // shell 1: green
  [80, 80, 255],    // shell 2: blue
  [255, 200, 0],    // shell 3: yellow
  [200, 60, 200],   // shell 4: magenta
  [60, 200, 200],   // shell 5: cyan
];
function shellCol(s) { return shellColors[s % shellColors.length]; }

function configKey() {
  let parts = [Z + ':' + Es[0]];
  for (let s = 1; s < MAXSHELLS; s++) {
    if (Es[s] > 0) parts.push(Es[s]);
    else break;
  }
  return parts.join('+');
}

function shellString() {
  let s = '' + Es[0];
  for (let i = 1; i < MAXSHELLS; i++) {
    if (Es[i] > 0) s += '+' + Es[i];
    else break;
  }
  return s;
}

function setup() {
  createCanvas(880, 560);

  // Opens on BORON, Z=5, in the configuration the paper reports for it (2+2+1). The default
  // was Z=4 against shell sliders of 2+1 -- three electrons on a Z=4 kernel, so the first thing
  // a reader from the paper saw was a beryllium CATION in a configuration appearing nowhere in
  // Table 1. Z and the occupations must agree at startup, and 2+2+1 also shows three shells at
  // once, which a two-shell default does not.
  sliderZ = createSlider(2, 86, 5, 1);
  sliderZ.position(20, 520);
  sliderZ.style('width', '100px');

  // Manual mode keeps 5 shell sliders (light atoms, spot checks); heavy atoms use the sweep.
  for (let s = 0; s < 5; s++) {
    const DEF = [2, 2, 1, 0, 0];               // sums to Z=5 above; keep the two in step
    let sl = createSlider(0, 4, DEF[s], 1);
    sl.position(160 + s * 90, 520);
    sl.style('width', '70px');
    sliders[s] = sl;
  }

  // --- controls in ordered rows, well below the sliders (sliders at y=520, canvas 560 tall) ---
  const BY = (b, x, y, pad) => { b.position(x, y); b.style('font-size', '14px'); b.style('padding', pad || '4px 12px'); };

  // FOUR BUTTONS. The page had ten, and five of them ran constructions this work no longer
  // uses -- a frozen core, a pseudo-kernel, a per-period calibrated r_c -- which a reader
  // arriving from the paper would press and be misled by. Those routines are NOT deleted; they
  // remain reachable as URL hooks (?auto=mgpt, ?auto=conv, and the rest) for our own use. What
  // is presented is what the paper claims: one atom by hand, the whole table, and the mesh.
  btnStart = createButton('Start');   BY(btnStart, 20, 595, '4px 16px'); btnStart.mousePressed(startSimulation);
  btnReset = createButton('Reset');   BY(btnReset, 90, 595, '4px 16px'); btnReset.mousePressed(function () { running = false; });
  // No mesh control is offered. N is fixed by Z -- 400 through argon, 800 beyond, because the
  // innermost shell contracts as 1/Z -- and a toggle would only let a reader produce the
  // divergent coarse-grid numbers past iron and take them for results.

  // Two runs, split where the mesh changes: N=400 through argon, N=800 beyond, because the
  // innermost shell contracts as 1/Z. The second is the slower of the two for that reason.
  // The convergence sweep had no role here -- the mesh is chosen by Z, not explored -- so it
  // is no longer offered; ?auto=conv still reaches it.
  btnFull = createButton('Periodic table  2..18');  BY(btnFull, 20, 640);
  btnFull.mousePressed(function () { runFullTable(2, 18); });
  btnFull2 = createButton('Periodic table  19..36'); BY(btnFull2, 210, 640);
  btnFull2.mousePressed(function () { runFullTable(19, 36); });

}

// FULL TABLE, ONE CLICK, WITH THE DENSITIES SHOWN. Walks Z=2..30 in order, solving each atom
// all-electron and drawing its radial densities before moving on, so the shell structure can be
// watched forming across the table rather than read off a CSV afterwards.
//
// The run is in two parts and the caption says which: through Z=20 the configuration comes from
// the build-up with nothing supplied; from Z=21 it is taken from observation, because the d
// charges belong inside the s pair that fills before them and an outward build-up cannot reach
// that. The arrangement is still radial -- the solver handles it perfectly well once told.
async function runFullTable(zlo, zhi) {
  if (batchRunning) return;
  batchRunning = true; running = false; batchPlot = true;
  zlo = zlo || 2; zhi = zhi || 36;
  PK_MODE = false;  const EL = {2:'He',3:'Li',4:'Be',5:'B',6:'C',7:'N',8:'O',9:'F',10:'Ne',11:'Na',12:'Mg',
    13:'Al',14:'Si',15:'P',16:'S',17:'Cl',18:'Ar',19:'K',20:'Ca',21:'Sc',22:'Ti',23:'V',
    24:'Cr',25:'Mn',26:'Fe',27:'Co',28:'Ni',29:'Cu',30:'Zn',31:'Ga',32:'Ge',33:'As',
    34:'Se',35:'Br',36:'Kr'};
  let rows = ['Z,el,config,config_source,quantity,value_Ha,ref_Ha,err_%,N'];
  fullRows = [];
  try { localStorage.setItem('fulltable_status', 'started'); } catch (e) {}
  for (let Z = zlo; Z <= zhi; Z++) {
    try { localStorage.setItem('fulltable_status', 'Z=' + Z); } catch (e) {}
    // ALL-ELECTRON THROUGHOUT. An earlier version switched to a pseudo-core past Z=20 to keep
    // a fixed mesh usable; that is no longer needed and would reintroduce a softening radius.
    // The innermost shell contracts as r_1s ~ 4.32/Z (measured from this model's own converged
    // boundaries, +-9% from carbon to argon), so what the heavier atoms need is resolution:
    // the mesh is chosen by Z, and the step count scales as (N/400)^2 because dt = h^2/2.
    // What IS still supplied past argon is the configuration, since a build-up that adds
    // outward cannot reach a shell lying inside one already occupied.
    const derived = configIsDerived(Z);
    let cfg, res, ref = null, err = NaN;
    // Two tiers, not three. A coarser N=200 for the light atoms looked like a free saving --
    // the step count scales as N^2 so the imaginary time is unchanged -- but the error here is
    // CUSP-LIMITED and first order in h, so halving the mesh doubled it: Li went -0.6% to -2.9%
    // and B -2.6% to -5.6%, a factor of two in each case. Resolution at the nucleus is what the
    // light atoms need; resolution of the 1s is what the heavy ones need.
    N = (Z <= 18) ? 400 : 800;
    const steps = Math.round(3000 * (N/400) * (N/400));
    batchNote = (Z >= 19)
      ? 'mesh N=800 from Z=19: about 8x the work per atom, so the scan slows here'
      : 'mesh N=400';
    try {
      PK_MODE = false;
      cfg = genConfigObserved(Z);
      res = solveAtomPure(Z, cfg, steps);
      ref = REF_ETOT[Z];
      err = (ref != null && isFinite(res.etot)) ? (res.etot - ref) / ref * 100 : NaN;
      // the comparison is the point of the run, so print it every time -- and say plainly
      // when there is no reference value rather than leaving the line looking complete
      var cmp = (ref == null) ? 'no reference'
              : (isFinite(res.etot) ? 'ref ' + ref.toFixed(3) + '   diff ' +
                 ((err >= 0 ? '+' : '') + err.toFixed(1) + '%') : 'ref ' + ref.toFixed(3));
      batchCaption = (EL[Z] || 'Z=' + Z) + '   ' + cfg.join('+') +
        '   E = ' + (isFinite(res.etot) ? res.etot.toFixed(3) : 'non-finite') +
        '   ' + cmp + '   N=' + N + '   [config: ' + configSource(Z) + ']';
      rows.push([Z, EL[Z] || '', cfg.join('+'), configSource(Z), 'E_total',
        isFinite(res.etot) ? res.etot.toFixed(4) : 'NONFIN',
        ref != null ? ref.toFixed(4) : '', isNaN(err) ? '' : err.toFixed(2), N].join(','));
      fullRows.push({ el: EL[Z] || ('Z' + Z), Z: Z, cfg: cfg.join('+'),
                      E: isFinite(res.etot) ? res.etot : null, ref: ref,
                      err: isNaN(err) ? null : err, N: N, src: configSource(Z) });
    } catch (e) {
      batchCaption = (EL[Z] || 'Z=' + Z) + '   failed: ' + (e && e.message);
      rows.push([Z, EL[Z] || '', (cfg||[]).join('+'), derived ? 'yes' : 'no', 'ERROR'].join(','));
    }
    // let the frame render, and hold long enough to be watched
    await new Promise(r => setTimeout(r, 550));
  }
  try { localStorage.setItem('fulltable_rows', JSON.stringify(rows));
        localStorage.setItem('fulltable_status', 'done'); } catch (e) {}
  PK_MODE = false;
  saveStrings(rows, 'realqm_full_table.csv');
  batchCaption = 'done: Z = ' + zlo + '..' + zhi + ' — CSV downloaded';
  await new Promise(r => setTimeout(r, 1500));
  batchPlot = false; batchRunning = false;
}

// Sweep Z=2..18 with inner-compact packing (buried octets = 8, valence octet = 4+4),
// full explicit solve (Neumann free boundaries). Reports total energy AND eigenvalue IE.
async function runInnerCompactSweep() {
  if (batchRunning) return;
  batchRunning = true; running = false;
  PK_MODE = false;  const Zmax = Math.min(18, sliderZ.value());
  let rows = ['Z,config,E_Ha,ref_E_Ha,Etot_err_%,IE_eV,NIST_IE_eV,IE_err_%'];
  for (let Z = 2; Z <= Zmax; Z++) {
    try {
      const cfg = genConfigInnerCompact(Z);
      sweepStatus = 'inner-compact Z=' + Z + '  ' + cfg.join('+');
      await new Promise(r => setTimeout(r, 0));
      let res = solveAtomPure(Z, cfg, 3000);
      const ref = REF_ETOT[Z], nist = NIST_IE1[Z];
      const eErr = (ref != null && isFinite(res.etot)) ? ((res.etot - ref) / ref * 100) : NaN;
      const ieErr = (nist && isFinite(res.IE_eV)) ? ((res.IE_eV - nist) / nist * 100) : NaN;
      rows.push([Z, cfg.join('+'), isFinite(res.etot) ? res.etot.toFixed(4) : 'NONFIN',
                 ref != null ? ref.toFixed(4) : '', isNaN(eErr) ? '' : eErr.toFixed(2),
                 isFinite(res.IE_eV) ? res.IE_eV.toFixed(2) : '', nist ? nist.toFixed(3) : '',
                 isNaN(ieErr) ? '' : ieErr.toFixed(1)].join(','));
      console.log('IC ' + rows[rows.length - 1]);
    } catch (e) {
      console.warn('IC Z=' + Z + ' failed: ' + (e && e.message));
      rows.push([Z, 'ERROR'].join(','));
    }
  }
  saveStrings(rows, 'realqm_inner_compact.csv');
  sweepStatus = 'inner-compact sweep done';
  batchRunning = false;
}

// Inner-compact packing: completed inner octets stay COMPACT (single 8-shell),
// the current valence octet is SPREAD (balanced 4+4). So Ne=2+4+4 (L is valence),
// but Na=2+8+1 (L is now a compact inner core), Ar=2+8+4+4, K=2+8+8+1, etc.
// Boundaries are the solver's usual Neumann free boundaries.
function genConfigInnerCompact(Z) {
  if (Z <= 2) return [Z];
  let cfg = [2], rem = Z - 2;
  while (rem > 8) { cfg.push(8); rem -= 8; }   // buried octet -> compact 8
  return cfg.concat(octetConfig(rem));          // current valence octet -> 4+4
}

// Balanced cap-4 packing of an octet's k electrons into its two cap-4 sub-shells.
function octetConfig(k) {
  let sh = [0, 0];
  for (let e = 0; e < k; e++) {
    let idx = (sh[0] <= sh[1] && sh[0] < 4) ? 0 : 1;
    if (sh[idx] >= 4) idx = 1 - idx;
    sh[idx]++;
  }
  return sh.filter(x => x > 0);
}

// 3rd row (Na->Ar): solve the M-shell valence in a Ne pseudo-kernel (Z_ker = Z-10), swept over
// the core radius r_c (the Ne core size). Tests whether a COMPACT Ne kernel fixes the M-valence
// IE that the spread explicit Ne core wrecked (Na full-solve was -65%).
async function runRow3Test() {
  if (batchRunning) return;
  batchRunning = true; running = false;
  PK_MODE = true;
  const elems = [
    { el: 'Na', Z: 11 }, { el: 'Mg', Z: 12 }, { el: 'Al', Z: 13 }, { el: 'Si', Z: 14 },
    { el: 'P', Z: 15 }, { el: 'S', Z: 16 }, { el: 'Cl', Z: 17 }, { el: 'Ar', Z: 18 },
  ];
  const rcs = [0.6, 0.8, 1.0, 1.3];
  let rows = ['r_c,el,Z_ker,config,IE_eV,NIST_eV,err_%'];
  for (const rc of rcs) {
    PK_rc = rc;
    for (const e of elems) {
      PK_Zker = e.Z - 10;
      const cfg = octetConfig(e.Z - 10);
      sweepStatus = 'row3 r_c=' + rc + '  ' + e.el;
      await new Promise(r => setTimeout(r, 0));
      let res = solveAtomPure(PK_Zker, cfg);
      const nist = NIST_IE1[e.Z];
      const err = (nist && isFinite(res.IE_eV)) ? ((res.IE_eV - nist) / nist * 100) : NaN;
      rows.push([rc.toFixed(1), e.el, PK_Zker, cfg.join('+'),
                 isFinite(res.IE_eV) ? res.IE_eV.toFixed(2) : 'NONFIN',
                 nist ? nist.toFixed(3) : '', isNaN(err) ? '' : err.toFixed(1)].join(','));
      console.log('R3 ' + rows[rows.length - 1]);
    }
  }
  PK_MODE = false; PK_Zker = 8;
  saveStrings(rows, 'realqm_row3_nekernel.csv');
  sweepStatus = 'row3 test done';
  batchRunning = false;
}

// Main-group valence packing: group 1 -> [1], group 2 -> cap-2 [2] (s^2 antipodal pair, single
// shell so it behaves like group 1), groups 13-18 -> octetConfig (the 4+4 octet building).
function mgConfig(g) {
  if (g === 1) return [1];
  if (g === 2) return [2];
  return octetConfig(g - 10);
}

// Bisection on r_c to match a target IE (IE decreases monotonically as r_c grows). Returns the
// best r_c found and its model IE. Used to pin each block's r_c to one reference atom.
async function calibRcFor(zker, cfg, targetIE, lo, hi) {
  PK_Zker = zker;
  let bestRc = (lo + hi) / 2, bestErr = Infinity, bestIE = NaN;
  for (let it = 0; it < 20; it++) {
    let mid = (lo + hi) / 2;
    PK_rc = mid;
    await new Promise(r => setTimeout(r, 0));
    let res = solveAtomPure(zker, cfg, 3000);
    let ie = res.IE_eV;
    if (isFinite(ie) && Math.abs(ie - targetIE) < bestErr) { bestErr = Math.abs(ie - targetIE); bestRc = mid; bestIE = ie; }
    if (!isFinite(ie)) hi = mid;          // unbound: r_c too large
    else if (ie > targetIE) lo = mid;     // too bound: increase r_c
    else hi = mid;                        // too loose: decrease r_c
  }
  return { rc: bestRc, ie: bestIE };
}

// Like calibRcFor but matches a target VALENCE ENERGY (E_val, more robust than the single IE).
// Used for the frozen-core total energy: pin r_c so the noble-gas valence energy is reproduced.
async function calibRcForEval(zker, cfg, target, lo, hi) {
  PK_Zker = zker;
  let bestRc = (lo + hi) / 2, bestErr = Infinity, bestE = NaN;
  for (let it = 0; it < 20; it++) {
    let mid = (lo + hi) / 2;
    PK_rc = mid;
    await new Promise(r => setTimeout(r, 0));
    let E = solveAtomPure(zker, cfg, 3000).etot;   // PK_MODE: etot == valence energy
    if (isFinite(E) && Math.abs(E - target) < bestErr) { bestErr = Math.abs(E - target); bestRc = mid; bestE = E; }
    if (!isFinite(E)) hi = mid;
    else if (E < target) lo = mid;   // too bound (E too negative): increase r_c
    else hi = mid;                   // too loose: decrease r_c
  }
  return { rc: bestRc, e: bestE };
}

// FULL main-group periodic table via the Neumann-confined pseudo-kernel, TWO r_c per period:
// r_c_s (s-block, groups 1-2) pinned to the alkali IE, r_c_p (p-block, groups 13-18) pinned to the
// noble-gas IE — physically the p-block core is more contracted (d^10 inserted before it). The
// other six atoms per period are then PREDICTIONS. d-block folded into the core and skipped.
async function runMainGroupPT() {
  if (batchRunning) return;
  batchRunning = true; running = false;
  PK_MODE = true;  const els = { 3:'Li',4:'Be',5:'B',6:'C',7:'N',8:'O',9:'F',10:'Ne',
    11:'Na',12:'Mg',13:'Al',14:'Si',15:'P',16:'S',17:'Cl',18:'Ar',
    19:'K',20:'Ca',31:'Ga',32:'Ge',33:'As',34:'Se',35:'Br',36:'Kr',
    37:'Rb',38:'Sr',49:'In',50:'Sn',51:'Sb',52:'Te',53:'I',54:'Xe',
    55:'Cs',56:'Ba',81:'Tl',82:'Pb',83:'Bi',84:'Po',85:'At',86:'Rn' };
  const NIST = { 3:5.392,4:9.323,5:8.298,6:11.260,7:14.534,8:13.618,9:17.423,10:21.565,
    11:5.139,12:7.646,13:5.986,14:8.152,15:10.487,16:10.360,17:12.968,18:15.760,
    19:4.341,20:6.113,31:5.999,32:7.900,33:9.789,34:9.752,35:11.814,36:14.000,
    37:4.177,38:5.695,49:5.786,50:7.344,51:8.609,52:9.010,53:10.451,54:12.130,
    55:3.894,56:5.212,81:6.108,82:7.417,83:7.286,84:8.417,85:9.318,86:10.749 };
  const table = [
    { p:2, zs:{1:3,2:4,13:5,14:6,15:7,16:8,17:9,18:10} },
    { p:3, zs:{1:11,2:12,13:13,14:14,15:15,16:16,17:17,18:18} },
    { p:4, zs:{1:19,2:20,13:31,14:32,15:33,16:34,17:35,18:36} },
    { p:5, zs:{1:37,2:38,13:49,14:50,15:51,16:52,17:53,18:54} },
    { p:6, zs:{1:55,2:56,13:81,14:82,15:83,16:84,17:85,18:86} },
  ];
  const groups = [1, 2, 13, 14, 15, 16, 17, 18];

  // Phase 1: calibrate r_c_s (alkali) and r_c_p (noble gas) per period.
  let rcByPer = {};
  let crows = ['period,r_c_s,r_c_p,alkali_IE_model,alkali_NIST,noble_IE_model,noble_NIST'];
  for (const per of table) {
    sweepStatus = 'calib P' + per.p + ' s-block (alkali ' + els[per.zs[1]] + ')';
    let cs = await calibRcFor(1, mgConfig(1), NIST[per.zs[1]], 0.2, 6.0);
    sweepStatus = 'calib P' + per.p + ' p-block (noble ' + els[per.zs[18]] + ')';
    let cp = await calibRcFor(8, mgConfig(18), NIST[per.zs[18]], 0.1, 2.0);
    rcByPer[per.p] = { s: cs.rc, p: cp.rc };
    crows.push([per.p, cs.rc.toFixed(3), cp.rc.toFixed(3),
                isFinite(cs.ie) ? cs.ie.toFixed(2) : '', NIST[per.zs[1]].toFixed(2),
                isFinite(cp.ie) ? cp.ie.toFixed(2) : '', NIST[per.zs[18]].toFixed(2)].join(','));
    console.log('CAL ' + crows[crows.length - 1]);
  }
  saveStrings(crows, 'realqm_maingroup_rc.csv');   // save now; phase 2 gives a time gap

  // Phase 2: solve all main-group atoms with the calibrated r_c (s vs p block).
  let rows = ['period,block,group,el,Z,Z_ker,r_c,config,IE_eV,NIST_eV,err_%'];
  for (const per of table) {
    for (const g of groups) {
      const Z2 = per.zs[g];
      const block = g <= 2 ? 's' : 'p';
      const val = (g <= 2) ? g : g - 10;
      PK_Zker = val;
      PK_rc = (block === 's') ? rcByPer[per.p].s : rcByPer[per.p].p;
      const cfg = mgConfig(g);

// Balanced fill of n electrons into ceil(n/cap) shells of capacity cap (round-robin).
// Configuration matching the observed structure, for the whole table through zinc.
//   Z <= 20  the balanced cap-4 build-up reaches it unaided: each charge goes outside what is
//            already there, so no observational input is used.
//   Z >= 21  it does not. The d charges belong to a shell INSIDE the s pair that fills before
//            them, and a build-up that adds outward never offers that position. The placement
//            here is therefore taken from observation, not derived -- the arrangement is still
//            an ordinary radial nesting, which is the point: what is missing is a filling rule,
//            not a geometry. Energies from these are conditional on the configuration supplied.
function genConfigObserved(Z) {
  if (Z <= 20) return genConfigBalanced(Z);
  const core = genConfigBalanced(18);            // [Ar] = 2+4+4+4+4
  const dCount = Math.min(10, Z - 20);           // 3d^n, inner
  const rest = Z - 18 - dCount - 2;              // 4p and beyond, outer
  let cfg = core.concat(capPack(dCount, 4)).concat([2]);
  if (rest > 0) cfg = cfg.concat(capPack(rest, 4));
  return cfg;
}
// Where a row's CONFIGURATION comes from. Not two cases but three, and the distinction is the
// paper's: the build-up is established only through carbon; from nitrogen to calcium the
// balanced cap-4 rule is extrapolated, and that rule was itself adopted because it reproduces
// the known configurations; from scandium the arrangement is taken from the ionisation order,
// since the added charge belongs inside a shell already occupied and an outward build-up has no
// move that puts it there. The capacities (2, and 8 = 4+4) are derived in every case; what
// varies is the filling.
function configSource(Z) {
  if (Z <= 6)  return 'build-up';
  if (Z <= 20) return 'balanced rule';
  return 'ionisation order';
}
function configIsDerived(Z) { return Z <= 20; }   // kept: genConfigObserved still branches on it

function capPack(n, cap) {
  let nsh = Math.max(1, Math.ceil(n / cap));
  let sh = new Array(nsh).fill(0);
  for (let e = 0; e < n; e++) sh[e % nsh]++;
  return sh;
}

// TRANSITION METALS on a noble-gas pseudo-kernel. Valence configured as [d-shell (inner)] + [s^2
// (outer)] -- the d explicitly nested INSIDE the s. Tests whether this recovers the correct
// ionisation order (outer s least-bound, removed first) that the naive (Madelung-filled) radial
// d-block cannot. Total energy is floor-carried; the structure (eigenvalue order) is the test.
async function runTransitionTest() {
  if (batchRunning) return;
  batchRunning = true; running = false;
  PK_MODE = true;  const series = [
    { period:4, core:18, rc:0.80, Z0:21, els:['Sc','Ti','V','Cr','Mn','Fe','Co','Ni','Cu','Zn'] },
    { period:5, core:36, rc:1.10, Z0:39, els:['Y','Zr','Nb','Mo','Tc','Ru','Rh','Pd','Ag','Cd'] },
  ];
  let rows = ['period,el,Z,Z_ker,r_c,config,Eval_Ha,radii_au,IE_per_shell_eV,outer_is_s,s_least_bound'];
  for (const ser of series) {
    PK_rc = ser.rc;
    for (let i = 0; i < 10; i++) {
      const Z2 = ser.Z0 + i;
      const vcount = Z2 - ser.core;          // d^n s^2 valence electrons
      const dCount = vcount - 2;
      PK_Zker = vcount;
      const cfg = capPack(dCount, 4).concat([2]);   // d-shells inner, s^2 outermost
      sweepStatus = 'TM ' + ser.els[i] + ' (Z_ker=' + vcount + ', r_c=' + ser.rc + ')';
      await new Promise(r => setTimeout(r, 0));
      let res = solveAtomPure(vcount, cfg, 4000);
      let radii = [], ies = [];
      for (let s = 0; s < NSHELLS; s++) {
        radii.push((M[s + 1] * h).toFixed(2));
        ies.push(Es[s] > 0 ? -eps[s] / Es[s] * 27.2114 : 0);
      }
      const sIdx = NSHELLS - 1;                       // s^2 shell (last in config)
      let maxR = -1, maxIdx = -1;
      for (let s = 0; s < NSHELLS; s++) { let r = M[s + 1] * h; if (r > maxR) { maxR = r; maxIdx = s; } }
      let minIE = Infinity, minIdx = -1;
      for (let s = 0; s < NSHELLS; s++) { if (ies[s] < minIE) { minIE = ies[s]; minIdx = s; } }
      rows.push([ser.period, ser.els[i], Z2, vcount, ser.rc, cfg.join('+'),
                 isFinite(res.etot) ? res.etot.toFixed(3) : 'NONFIN',
                 radii.join('|'), ies.map(x => x.toFixed(1)).join('|'),
                 (maxIdx === sIdx) ? 'yes' : 'no', (minIdx === sIdx) ? 'yes' : 'no'].join(','));
      console.log('TM ' + rows[rows.length - 1]);
    }
  }
  PK_MODE = false; PK_Zker = 8;
  saveStrings(rows, 'realqm_transition.csv');
  sweepStatus = 'transition-metal structure test done — CSV downloaded';
  batchRunning = false;
}

// Grid-refinement convergence (for tab:hconv): solve He, Ne, Ar all-electron at fixed box,
// N = 64,128,256; record total + valence energy and estimate the spatial order
// p = log2(|E_N - E_2N| / |E_2N - E_4N|).
async function runConvergenceTest() {
  if (batchRunning) return;
  batchRunning = true; running = false;
  PK_MODE = false;  const Nsave = N;
  // Per-atom grids: the inner 1s contracts as 1/Z, so heavier atoms need finer N to resolve it.
  const atoms = [
    { el: 'He', Z: 2,  cfg: [2],                 Ns: [64, 128, 256] },
    { el: 'Ne', Z: 10, cfg: genConfigBalanced(10), Ns: [128, 256, 512] },
    { el: 'Ar', Z: 18, cfg: genConfigBalanced(18), Ns: [256, 512, 1024] },
  ];
  let rows = ['atom,N,h_au,E_total_Ha,IE_valence_eV'];
  let store = {};
  for (const a of atoms) {
    store[a.el] = {};
    for (const Ng of a.Ns) {
      N = Ng;
      sweepStatus = 'convergence ' + a.el + ' N=' + Ng;
      await new Promise(r => setTimeout(r, 0));
      let res = solveAtomPure(a.Z, a.cfg, Math.min(250000, 40000 * Ng / 128));   // scale steps with grid
      store[a.el][Ng] = res.etot;
      rows.push([a.el, Ng, h.toFixed(5),
                 isFinite(res.etot) ? res.etot.toFixed(5) : 'NONFIN',
                 isFinite(res.IE_eV) ? res.IE_eV.toFixed(3) : ''].join(','));
      console.log('CONV ' + rows[rows.length - 1]);
    }
  }
  N = Nsave;
  rows.push('');
  rows.push('atom,N_lo..hi,|E_lo-E_mid|,|E_mid-E_hi|,order_p');
  for (const a of atoms) {
    let [n0, n1, n2] = a.Ns;
    let d1 = Math.abs(store[a.el][n0] - store[a.el][n1]);
    let d2 = Math.abs(store[a.el][n1] - store[a.el][n2]);
    let p = (d2 > 0) ? Math.log2(d1 / d2) : NaN;
    rows.push([a.el, n0 + '..' + n2, d1.toFixed(5), d2.toFixed(5), isFinite(p) ? p.toFixed(2) : ''].join(','));
    console.log('ORDER ' + rows[rows.length - 1]);
  }
  saveStrings(rows, 'realqm_convergence.csv');
  sweepStatus = 'grid-refinement convergence done — CSV downloaded';
  batchRunning = false;
}

function cationCfg(cfg) {
  let c = cfg.slice();
  c[c.length - 1]--;
  if (c[c.length - 1] === 0) c.pop();
  return c;
}

// Compact-core IE test: use a SINGLE 8-shell for octet cores (2+8 not 2+4+4) so the core
// is compact, then read the valence IE. A 1D proxy for the compact 3D octet core.

async function runCompactCoreTest() {

  sweepStatus = 'compact-core test done';
  batchRunning = false;
}

// ---- cap-capped packing: m electrons -> [2, cap, cap, ...] ----
// AUTO-RUN for driving from outside. AppleScript executes in an isolated world and cannot call
// page functions or read window globals, so a URL flag runs the solve here and publishes the
// result to localStorage, which it CAN read.
//   ?auto=cno   solve C, N, O at the balanced cap-4 packing and report E and IE against NIST.
// This is the comparison the file has machinery for but no recorded numbers: total energies are
// tabulated in RESULTS, ionisation energies are computed live and were never stored.
(function(){
  var MODE = /[?&]auto=rad(?:&|$)/.test(location.search) ? 'R'
           : /[?&]auto=he(?:&|$)/.test(location.search) ? 'h'
           : /[?&]auto=sr(?:&|$)/.test(location.search) ? 'z'
           : /[?&]auto=seq(?:&|$)/.test(location.search) ? 'q'
           : /[?&]auto=radii(?:&|$)/.test(location.search) ? 'r'
           : /[?&]auto=conv2(?:&|$)/.test(location.search) ? 'C'
           : /[?&]auto=conv(?:&|$)/.test(location.search) ? 'c'
           : /[?&]auto=mgpt(?:&|$)/.test(location.search) ? 'g'
           : /[?&]auto=aufbau(?:&|$)/.test(location.search) ? 'a'
           : /[?&]auto=chi(?:&|$)/.test(location.search) ? 'x'
           : /[?&]auto=scan4(?:&|$)/.test(location.search) ? 'S'
           : /[?&]auto=scan(?:&|$)/.test(location.search) ? 's'
           : /[?&]auto=kr(?:&|$)/.test(location.search) ? 'K'
           : /[?&]auto=fine(?:&|$)/.test(location.search) ? 'N'
           : /[?&]auto=trunc(?:&|$)/.test(location.search) ? 'T'
           : /[?&]auto=full(?:&|$)/.test(location.search) ? 'F'
           : /[?&]auto=ordercheck(?:&|$)/.test(location.search) ? 'O'
           : /[?&]auto=beladder(?:&|$)/.test(location.search) ? 'B'
           : /[?&]auto=cnod(?:&|$)/.test(location.search) ? 'd'
           : (/[?&]auto=cno(?:&|$)/.test(location.search) ? 'k' : null);
  if (!MODE) return;
  // dSCF: solve the neutral AND the cation, both fully relaxed, and take the difference.
  // The Koopmans eigenvalue -eps cannot contain the relaxation of the electrons left behind,
  // and that relaxation is exactly the physics being tested: nitrogen outranks oxygen because
  // removing an electron from oxygen's PAIRED 2p relieves repulsion among the remainder.
  // Even Hartree-Fock's Koopmans values come out monotonic in Z and put O above N.
  // CONFIG SCAN. Rather than imposing a packing, solve several candidates and let the LOWEST
  // energy decide. That is variational and it is what the model should be allowed to say.
  // For nitrogen the spectroscopic structure is 2+2+3 (2s2 2p3, outer shell HALF FILLED) while
  // the cap-4 balanced rule gives 2+3+2 -- more in the inner shell than the outer, which is
  // backwards, and removes the half-filled outer shell that produces the N>O anomaly.
  // FOURTH-ROW OCCUPATION SCAN (?auto=scan4). Are the As and Se partitions optimal?
  // They are the two largest errors in the fourth row (-5.3% and -6.7%) and they are also the
  // part of the table where the configuration is SUPPLIED from the ionisation order rather than
  // produced by the model, so a bad partition is a live possibility and worth testing.
  // WHY THE TEST IS CLEAN HERE, unlike beryllium. Be taught that energy is ANTI-correlated with
  // the physical configuration: the lower-energy candidate over-binds past the reference, so a
  // lower energy is not evidence. As and Se currently UNDER-bind by 5-7%, so for these two a
  // lower energy moves TOWARD the reference. A candidate that is both lower in energy and closer
  // to the reference is therefore an unambiguous improvement, with no anti-correlation to weigh.
  // All candidates run at the same mesh (N=800) and the SAME step count, since energy falls
  // monotonically with steps and an unequal comparison is worthless.
  window.__autoScan4 = function(){
    var KEY='atomsim_scan4', out=[];
    try{ localStorage.removeItem(KEY); }catch(e){}
    var NN = parseInt((location.search.match(/[?&]gridN=(\d+)/)||[])[1] || '800', 10);
    var ST = parseInt((location.search.match(/[?&]steps=(\d+)/)||[])[1] || '48000', 10);
    var AR = [2,4,4,4,4];                       // [Ar] core, 18, derived
    // Each candidate is the ROW-4 partition appended to [Ar]; the core is held fixed so the
    // comparison is over the fourth row alone.
    var cases = [
      { el:'As', Z:33, ref:-2234.240, rows:[
        { tag:'ionisation order (current)', r:[4,3,3,2,3] },
        { tag:'balanced cap-4',             r:[4,4,4,3]   },
        { tag:'d as 4+4+2',                 r:[4,4,2,2,3] },
        { tag:'pair first, 2+8+5',          r:[2,4,4,4,1] },
        { tag:'p split 2+1',                r:[4,3,3,2,2,1] },
        { tag:'d as single 10',             r:[10,2,3]    } ]},
      { el:'Se', Z:34, ref:-2399.870, rows:[
        { tag:'ionisation order (current)', r:[4,3,3,2,4] },
        { tag:'balanced cap-4',             r:[4,4,4,4]   },
        { tag:'d as 4+4+2',                 r:[4,4,2,2,4] },
        { tag:'pair first, 2+8+6',          r:[2,4,4,4,2] },
        { tag:'p split 2+2',                r:[4,3,3,2,2,2] },
        { tag:'d as single 10',             r:[10,2,4]    } ]}
    ];
    (async function(){
      PK_MODE=false; var Nsave=N;
      for (var ci=0; ci<cases.length; ci++){
        var c=cases[ci];
        for (var ri=0; ri<c.rows.length; ri++){
          var cand=c.rows[ri], cfg=AR.concat(cand.r);
          var sum=cfg.reduce(function(a,b){return a+b;},0);
          var rec={ el:c.el, Z:c.Z, tag:cand.tag, cfg:cfg.join('+'), nsh:cfg.length,
                    sum:sum, ok:(sum===c.Z), N:NN, steps:ST };
          try{ localStorage.setItem('scan4_progress', c.el+' '+cand.tag); }catch(e){}
          await new Promise(function(r){ setTimeout(r,0); });
          if (sum!==c.Z){ rec.skip='electron count '+sum+' != Z'; out.push(rec); continue; }
          try{
            N=NN;
            var r=solveAtomPure(c.Z, cfg, ST);
            rec.E = isFinite(r.etot)?Number(r.etot.toFixed(3)):'NONFIN';
            rec.iters = r.iters;
            if (isFinite(r.etot)) rec.err_pct = Number(((r.etot-c.ref)/c.ref*100).toFixed(2));
            rec.r_core = Number((M[1]*h).toFixed(4));
          }catch(e){ rec.E='ERR'; rec.msg=String(e).slice(0,70); }
          out.push(rec);
          try{ localStorage.setItem(KEY, JSON.stringify(out)); }catch(e){
            console.error('SAVE FAILED ('+KEY+'): '+e.name); document.title='SAVE FAILED'; }
        }
      }
      N=Nsave;
      try{ localStorage.setItem(KEY, JSON.stringify(out)); }catch(e){}
      document.title='SCAN4 DONE';
    })();
  };

  window.__autoScan = function(){
    var KEY = 'atomsim_scan', out = [];
    try { localStorage.removeItem(KEY); } catch(e){}
    var cases = [
      { el:'N',  Z:7, ne:7, cfgs:[[2,2,3],[2,3,2],[2,4,1],[2,5]] },
      { el:'N+', Z:7, ne:6, cfgs:[[2,2,2],[2,4],[2,3,1]] },
      { el:'O',  Z:8, ne:8, cfgs:[[2,2,4],[2,3,3],[2,4,2],[2,6]] },
      { el:'O+', Z:8, ne:7, cfgs:[[2,2,3],[2,3,2],[2,4,1]] }

    cases.forEach(function(c){
      c.cfgs.forEach(function(cfg){

                     E: isFinite(r.etot) ? Number(r.etot.toFixed(4)) : null });
        } catch(e) { out.push({ el:c.el, cfg:cfg.join('+'), err:String(e).slice(0,100) }); }
      });
    });
    try { localStorage.setItem(KEY, JSON.stringify(out)); } catch(e){ console.error('SAVE FAILED (' + KEY + '): ' + e.name); document.title = 'SAVE FAILED'; }
    document.title = 'SCAN DONE';
    return out;
  };


  // ELECTRONEGATIVITY (Allen configuration energy) ACROSS PERIOD 2.
  // chi = the AVERAGE binding energy of the valence electrons,
  //         chi = sum_s (n_s * IE_s) / sum_s n_s     over the valence shells,
  // which is Allen's spectroscopic definition (n_s eps_s + m_p eps_p)/(n+m) written in RealQM's
  // terms: the model has no s/p, only shells, and each shell already carries its own energy --
  // so chi is a NATIVE output here rather than something assembled from multiplet averages.
  // Why this and not the first ionization energy: IE is the single least-bound electron and is
  // the fragile quantity (the light p-block under-binds 35-50%, and the radial octet has a hard
  // ~13 eV ceiling that N, F and Ne sit above). chi averages over ALL valence electrons, so it
  // sits between the too-robust total energy and the too-brittle IE. And what a molecule needs
  // is the DIFFERENCE across a row, where errors within one composition cancel.
  // Per-shell ionization energy in eV is -eps[s]/Es[s]*27.2114, the same reduction the
  // transition-metal routine uses.
  window.__autoChi = function(){
    var KEY = 'atomsim_chi', out = [];
    try { localStorage.removeItem(KEY); } catch(e){}
    var els = [['Li',3],['Be',4],['B',5],['C',6],['N',7],['O',8],['F',9],['Ne',10]];
    els.forEach(function(e){
      var Z = e[1];
      try {
        var cfg = genConfigBalanced(Z);
        var r = solveAtomPure(Z, cfg, 20000);
        var ies = [], ns = [];
        for (var s = 0; s < NSHELLS; s++) {
          ies.push(Es[s] > 0 ? -eps[s] / Es[s] * 27.2114 : 0);
          ns.push(Es[s]);
        }
        // valence = every shell BEYOND the innermost (the 1s2 core)
        var num = 0, den = 0;
        for (var s2 = 1; s2 < NSHELLS; s2++) { num += ns[s2] * ies[s2]; den += ns[s2]; }
        out.push({ el:e[0], Z:Z, cfg:cfg.join('+'),
                   E: isFinite(r.etot) ? Number(r.etot.toFixed(4)) : null,
                   n_per_shell: ns.slice(0, NSHELLS),
                   IE_per_shell_eV: ies.map(function(x){return Number(x.toFixed(3));}),
                   IE_first_eV: Number(ies[NSHELLS-1].toFixed(3)),
                   chi_eV: den > 0 ? Number((num/den).toFixed(3)) : null });
      } catch(err) { out.push({ el:e[0], Z:Z, err:String(err).slice(0,90) }); }
    });
    try { localStorage.setItem(KEY, JSON.stringify(out)); } catch(e){ console.error('SAVE FAILED (' + KEY + '): ' + e.name); document.title = 'SAVE FAILED'; }
    document.title = 'CHI DONE';
    return out;
  };


  // AUFBAU, PART 1 (static): would the ENERGY put the next electron in the inner shell?
  // For Li the physical configuration is 2+1. The question is whether a single 3-shell -- all
  // three electrons at one radius, which cap-4 permits -- comes out LOWER. If it does, then the
  // physical configuration is not the energy minimum, and something other than energy selects it.
  // That is the premise of the dynamical test: an electron arriving from outside cannot reach the
  // inner region because the territory is already occupied, so 2+1 is what is REACHABLE even if
  // 3 is what is lowest. Static energy answers "which is lower", not "which is attainable".

  // C1 / C3 for the IJQC revision. Both REUSE the existing sweep functions rather than
  // reimplementing them -- a second copy of the loop would drift from the one that produced the
  // paper's tables. saveStrings is intercepted so the CSV rows land in localStorage instead of a
  // download (AppleScript can read localStorage but not window.* globals).
  //   ?auto=conv  runConvergenceTest -- He/Ne/Ar at three grids each. It ALREADY computes
  //               IE_valence_eV at every grid; Table 6 reports only He's TOTAL energy, which is
  //               R2's complaint ("the ionization energies need their own convergence checks").
  //   ?auto=mgpt  runMainGroupPT -- the calibrated main-group IE table, which is where R2's
  //               Kr -> Xe increase lives.
  function __capture(fn, key, tag) {
    return function () {
      var orig = window.saveStrings;
      window.saveStrings = function (rows, name) {
        try { localStorage.setItem(key, JSON.stringify(rows)); } catch (e) {}
        window.saveStrings = orig;
        document.title = tag + ' DONE';
      };
      try { localStorage.removeItem(key); } catch (e) {}
      fn();
    };
  }
  window.__autoConv = __capture(runConvergenceTest, 'atomsim_conv', 'CONV');

  // MESH LADDER DONE PROPERLY (?auto=conv2) -- replaces runConvergenceTest for the paper's
  // Table of grid convergence. Three faults in that function made its Ne and Ar rungs
  // meaningless, and all three were instrument faults, not solver faults:
  //   1. steps scaled as 1/h (40000*N/128) when dt = h^2/2 demands 1/h^2;
  //   2. a hard cap of 250000 steps, which bit exactly the finest rung;
  //   3. the convergence test fixed at 20 steps, i.e. a 4x shorter imaginary-time window at
  //      each refinement, so the finest rung broke earliest and came back LEAST converged.
  // Its output was Ne -126.50/-133.05/-132.47 and Ar -323.63/-520.60/-511.26: non-monotone,
  // Ne overshooting below the exact -128.94. The same signature is recorded at __autoFine --
  // "argon at -517.3 (N=800, 12k steps) against -528.0 (N=400)".
  // WHAT THIS ONE DOES. Grid ratio sqrt(2) rather than 2, so three rungs cost ~7x the coarsest
  // instead of ~21x and a heavier atom can be resolved at all; steps and the convergence window
  // both scale as (N/N0)^2, so every rung gets the SAME imaginary time and the SAME test; and
  // each rung is run twice, at T and 2T, so it carries its own step-convergence evidence rather
  // than asserting it. Order from a sqrt(2) ratio is p = 2*log2(d1/d2).
  // Rungs are chosen so the 1s (r ~ 4.32/Z) is resolved: Ne needs ~5 cells, Ar ~3-6.
  window.__autoConv2 = function(){
    var KEY='atomsim_conv2', out=[];
    var BASE = parseInt((location.search.match(/[?&]base=(\d+)/)||[])[1] || '20000', 10);
    // ?tol=0 disables the early break entirely, so the rung runs its full matched step count.
    // Needed because every rung of the first conv2 pass stopped ON the break (it_T == it_2T),
    // which makes "converged" rest on the break test rather than on the step count. ?only=
    // restricts to one element and ?rung= to one N, so the expensive check can be run alone.
    // ?tag= suffixes the storage key so a check does not clobber the full ladder.
    var TOLQ = (location.search.match(/[?&]tol=([0-9.eE-]+)/)||[])[1];
    var TOL = (TOLQ !== undefined) ? parseFloat(TOLQ) : 1e-4;
    var ONLY = (location.search.match(/[?&]only=([A-Za-z]+)/)||[])[1] || '';
    var RUNG = parseInt((location.search.match(/[?&]rung=(\d+)/)||[])[1] || '0', 10);
    var TAG  = (location.search.match(/[?&]tag=([A-Za-z0-9_]+)/)||[])[1] || '';
    if (TAG) KEY = KEY + '_' + TAG;
    try{ localStorage.removeItem(KEY); }catch(e){}   // clear AFTER the tag, or a tagged
    // check wipes the untagged ladder it is supposed to be checking against
    try{ localStorage.setItem('conv2_progress', 'starting ' + KEY); }catch(e){}
    var atoms = [
      { el:'He', Z:2,  Ns:[256, 362, 512]  },
      { el:'Ne', Z:10, Ns:[256, 362, 512]  },
      { el:'Ar', Z:18, Ns:[512, 724, 1024] }
    ];
    if (ONLY) atoms = atoms.filter(function(a){ return a.el === ONLY; });
    if (RUNG) atoms = atoms.map(function(a){ return {el:a.el, Z:a.Z, Ns:[RUNG], _N0:a.Ns[0]}; });
    (async function(){
      PK_MODE = false; var Nsave = N;
      for (var ai=0; ai<atoms.length; ai++){
        var a = atoms[ai], N0 = a._N0 || a.Ns[0];
        var cfg = genConfigBalanced(a.Z);
        for (var ni=0; ni<a.Ns.length; ni++){
          var Ng = a.Ns[ni], sc = (Ng/N0)*(Ng/N0);
          var st = Math.round(BASE*sc), ce = Math.max(20, Math.round(20*sc));
          var rec = { el:a.el, Z:a.Z, cfg:cfg.join('+'), N:Ng, steps:st, chkEvery:ce, tol:TOL };
          try{ localStorage.setItem('conv2_progress', a.el+' N='+Ng+' T'); }catch(e){}
          await new Promise(function(r){ setTimeout(r,0); });
          try{
            N = Ng;
            var r1 = solveAtomPure(a.Z, cfg, st, {chkEvery:ce, tol:TOL});
            rec.h = Number(h.toFixed(5)); rec.D = D;
            rec.cells_1s = Number((4.32/a.Z/h).toFixed(1));
            rec.E_T  = isFinite(r1.etot)?Number(r1.etot.toFixed(5)):'NONFIN';
            rec.it_T = r1.iters; rec.broke_T = (r1.iters < st);
            try{ localStorage.setItem('conv2_progress', a.el+' N='+Ng+' 2T'); }catch(e){}
            await new Promise(function(r){ setTimeout(r,0); });
            N = Ng;
            var r2 = solveAtomPure(a.Z, cfg, 2*st, {chkEvery:ce, tol:TOL});
            rec.E_2T = isFinite(r2.etot)?Number(r2.etot.toFixed(5)):'NONFIN';
            rec.it_2T = r2.iters; rec.broke_2T = (r2.iters < 2*st);
            if (isFinite(r1.etot) && isFinite(r2.etot))
              rec.step_drift = Number((r2.etot-r1.etot).toFixed(5));
          }catch(e){ rec.E_T='ERR'; rec.msg=String(e).slice(0,80); }
          out.push(rec);
          try{ localStorage.setItem(KEY, JSON.stringify(out)); }catch(e){
            console.error('SAVE FAILED ('+KEY+'): '+e.name); document.title='SAVE FAILED'; }
        }
      }
      N = Nsave;
      // order from the 2T column, which is the more relaxed of the two
      for (var ai2=0; ai2<atoms.length; ai2++){
        var el = atoms[ai2].el, rs = out.filter(function(o){ return o.el===el; });
        if (rs.length===3 && rs.every(function(o){ return typeof o.E_2T==='number'; })){
          var d1 = Math.abs(rs[0].E_2T-rs[1].E_2T), d2 = Math.abs(rs[1].E_2T-rs[2].E_2T);
          out.push({ el:el, order_note:'sqrt2 ladder', d1:Number(d1.toFixed(5)),
                     d2:Number(d2.toFixed(5)),
                     p: (d2>0)?Number((2*Math.log2(d1/d2)).toFixed(2)):null,
                     monotone: (rs[0].E_2T > rs[1].E_2T && rs[1].E_2T > rs[2].E_2T) });
        }
      }
      try{ localStorage.setItem(KEY, JSON.stringify(out)); }catch(e){}
      document.title = 'CONV2 DONE';
    })();

  window.__autoMGPT = __capture(runMainGroupPT,     'atomsim_mgpt', 'MGPT');
  window.__autoFull = __capture(runFullTable,       'atomsim_full', 'FULL');

  // TRUNCATED KERNEL WITH A DERIVED RADIUS. The innermost shell alone is absorbed into the
  // kernel, at r_c = K/Z with K = 4.32 read off this model's own converged core boundaries for
  // Z = 6..18 (+-9%, much of it grid quantisation). That constant comes from the model, not from
  // reference energies, which is the whole point: the per-period r_c in the code is bisected
  // against a NIST ionization energy, and this is not.
  //   Z_ker = Z - 2, and the configuration is the same one minus its innermost shell.
  //   E_rest is then the energy of the remaining Z-2 charges in the screened kernel; adding the
  //   analytic He-like core energy gives an estimated total, and THAT step uses an external
  //   formula, so it is reported separately and not used to judge the truncation.
  // The test: where all-electron still works (Z<=20) the two should agree; past there the
  // all-electron run degrades and goes positive by iron, and the truncated one should not.
  // ALL-ELECTRON PAST ARGON ON A FINER UNIFORM MESH. A graded (logarithmic) mesh would resolve
  // the 1s at any Z, but the radial Laplacian in x = ln r carries a 1/r^2 coefficient, so an
  // EXPLICIT step needs dt <~ delta^2 r_min^2 / 2 and the cost rises by 6 to 11 orders. Codes on

  // SHELL RADII from the 1D free boundary, for comparison with the 3D run.
  // M[s] are the shell boundary INDICES and lines ~1180-1184 move them by amplitude continuity
  // (if u[M] > u[M+1] + diff then M++), which is the same free-boundary rule the 3D front
  // implements as cm = u_self - u_other. So the radial shell radius is already an OUTPUT here,
  // found not imposed -- the 1D solver has been doing the aufbau boundary test all along.
  // Reported as M[s+1]*h, the outer radius of shell s, exactly as the transition-metal routine
  // does at :458.

  // SEQUENTIAL AUFBAU. Given the parent (Z-1) configuration, the next electron may join any
  // existing shell or open a new one. The parent's TOPOLOGY is inherited -- shell count and
  // occupancies -- but every candidate is solved fully self-consistently (all radii and
  // amplitudes relax). Nothing is frozen numerically: this is not the frozen-core approximation.
  //
  // Why the constraint matters: re-deriving the configuration from scratch lets the core DISSOLVE,
  // which is how Be reaches a single 4-shell at -18.89 (28.8% too deep) and why unconstrained
  // energy minimisation looks anti-correlated with physics. A build-up never OFFERS that option --
  // the electron arrives at an atom that already has a core. If the inherited-topology minimum is
  // the physical configuration at every step, the packing stops being an empirical input and the
  // all-electron calculation carries no adjustable parameter at all.
  //
  // Reports the winner alongside BOTH candidate "correct" answers -- the balanced cap-4 rule the
  // paper uses, and the spectroscopic configuration -- rather than pre-deciding which is right.

  // SHELL SIZE-TO-RADIUS RATIO, to test whether CAPACITY is a derived quantity.
  // Each shell has an inner and outer FREE boundary M[s], M[s+1], so define
  //     s = (R_out - R_in)/2   the electron's radial half-size
  //     R = (R_out + R_in)/2   the shell's mean radius
  //     s/R = (R_out - R_in)/(R_out + R_in)
  // The innermost shell has R_in = 0, giving s/R = 1 exactly -- the antipodal case, two electrons
  // each filling half the ball. Outer shells sit further out relative to their thickness, so s/R
  // falls and more electrons fit. Geometric ladder (electrons of radius s with centres on a
  // sphere of radius R touch when sin(alpha/2) = s/R):
  //     s/R = 1.000 -> 2 (antipodal)   0.866 -> 3   0.816 -> 4 (tetrahedral)
  //     s/R = 0.707 -> 6 (octahedral)  0.577 -> 8 (cubic)
  // THE REAL TEST IS THE PLATEAUS. The periodic table repeats capacities -- 2, 8, 8, 18, 18,
  // 32, 32 -- so a monotonically falling s/R would give 2, 8, 18, 32 once each and be wrong.
  // The ratio must come in STEPS OF TWO SHELLS, the first unpaired. That is what decides whether
  // the geometry explains the table's shape or only its capacities.

  // He on the 1D radial solver: ONE spherical shell holding two electrons (non-split).
  // The 3D counterpart with an angular split into two one-electron domains is the comparison --
  // the non-split shell needs a multi-occupancy self-repulsion correction, the split one does not.

  // ATOMIC RADII. The free boundaries give the INTERNAL shell radii directly, but the outermost
  // boundary is the grid edge, not physics, so an atomic radius needs a density criterion.
  // Three are computed, all from the converged radial density (charge = u^2 r^2 dr, so the
  // density is rho(r) = u(r)^2 / 4pi):
  //   <r>_out  mean radius of the OUTERMOST shell -- the direct analogue of Clementi's
  //            calculated atomic radii, which are <r> of the outermost orbital
  //   r90,r99  radius enclosing 90% / 99% of the total electron charge
  // Nothing here is fitted: the shell bands come from the free boundary and the density from the
  // solve. Reported in Angstrom for comparison with the tabulated values.
  window.__autoRad = function(){
    var KEY='atomsim_rad', out=[], A=0.529177210903;
    try{ localStorage.removeItem(KEY); }catch(e){}
    var els={1:'H',2:'He',3:'Li',4:'Be',5:'B',6:'C',7:'N',8:'O',9:'F',10:'Ne',
             11:'Na',12:'Mg',13:'Al',14:'Si',15:'P',16:'S',17:'Cl',18:'Ar'};
    Object.keys(els).forEach(function(k){
      var Z=parseInt(k,10);
      try{
        var cfg=genConfigBalanced(Z);
        var r=solveAtomPure(Z,cfg,30000);
        // cumulative charge and the outermost shell's mean radius
        var tot=0, acc=[], i;
        for(i=1;i<=N;i++){ var q=(u[i]*i*h)*(u[i]*i*h)*h; tot+=q; acc.push(tot); }
        function rAt(frac){
          for(var j=0;j<acc.length;j++) if(acc[j]>=frac*tot) return Number(((j+1)*h*A).toFixed(3));
          return null;
        }
        var lo=M[NSHELLS-1]+1, hi=M[NSHELLS], num=0, den=0;
        for(i=lo;i<=hi && i<=N;i++){ var w=(u[i]*i*h)*(u[i]*i*h)*h; num+=w*(i*h); den+=w; }
        out.push({el:els[k],Z:Z,cfg:cfg.join('+'),
                  E:isFinite(r.etot)?Number(r.etot.toFixed(4)):null,
                  r_mean_outer_A: den>0?Number((num/den*A).toFixed(3)):null,
                  r90_A: rAt(0.90), r99_A: rAt(0.99),
                  shell_radii_A: (function(){var a=[];for(var t=0;t<NSHELLS;t++)a.push(Number((M[t+1]*h*A).toFixed(3)));return a;})(),
                  charge: Number(tot.toFixed(4)), h:Number(h.toFixed(5))});
      }catch(e){ out.push({el:els[k],Z:Z,err:String(e).slice(0,70)}); }
    });
    try{ localStorage.setItem(KEY, JSON.stringify(out)); }catch(e){ console.error('SAVE FAILED (' + KEY + '): ' + e.name); document.title = 'SAVE FAILED'; }
    document.title='RAD DONE'; return out;

  window.__autoSeq = function(){
    var KEY='atomsim_seq', out=[];
    try{ localStorage.removeItem(KEY); }catch(e){}
    var steps=[
      {el:'Be', Z:4, parent:[2,1],   spec:[2,2]},
      {el:'B',  Z:5, parent:[2,2],   spec:[2,2,1]},
      {el:'C',  Z:6, parent:[2,2,1], spec:[2,2,2]},
      {el:'N',  Z:7, parent:[2,2,2], spec:[2,2,3]},
      {el:'O',  Z:8, parent:[2,2,3], spec:[2,2,4]}
    ];
    steps.forEach(function(st){
      // CLOSURE: a shell that is a filled packing admits no more. The close-packings of unit
      // charges on a sphere are 2 (antipodal) and 4 (tetrahedral), which is a GEOMETRIC fact the
      // paper already argues, not a fitted number -- so imposing it costs no parameter. A shell
      // holding 2 is a closed cap-2; one holding 4 is a closed cap-4; 1 or 3 has room.
      // Run BOTH ways: without closure the next electron may join any shell and energy decides
      // alone; with closure it may only join a shell with spare capacity, or open a new one.
      function closed(n){ return n === 2 || n === 4; }
      var cands=[], candsClosed=[];
      for(var i=0;i<st.parent.length;i++){
        var c=st.parent.slice(); c[i]+=1;
        cands.push(c);
        if(!closed(st.parent[i]) && i>0) candsClosed.push(c);   // i>0: never re-open the core
      }
      var fresh=st.parent.concat([1]);
      cands.push(fresh); candsClosed.push(fresh);   // open a new shell -- always allowed
      var res=[];
      cands.forEach(function(c){
        try{
          var r=solveAtomPure(st.Z, c, 20000);
          res.push({cfg:c.join('+'), E:isFinite(r.etot)?Number(r.etot.toFixed(4)):null});
        }catch(e){ res.push({cfg:c.join('+'), E:null, err:String(e).slice(0,60)}); }
      });
      var ok=res.filter(function(r){return r.E!==null;});
      var win=ok.length?ok.reduce(function(a,b){return b.E<a.E?b:a;}):null;
      // winner under the closure rule: same energies, restricted candidate set
      var allowed={}; candsClosed.forEach(function(c){ allowed[c.join('+')]=1; });
      var okC=ok.filter(function(r){ return allowed[r.cfg]; });
      var winC=okC.length?okC.reduce(function(a,b){return b.E<a.E?b:a;}):null;
      var bal=null; try{ bal=genConfigBalanced(st.Z).join('+'); }catch(e){}
      out.push({el:st.el, Z:st.Z, parent:st.parent.join('+'),
                candidates:res,
                winner_open:win?win.cfg:null, winner_open_E:win?win.E:null,
                winner_closed:winC?winC.cfg:null, winner_closed_E:winC?winC.E:null,
                allowed_closed:Object.keys(allowed),
                winner:win?win.cfg:null, winner_E:win?win.E:null,
                spectroscopic:st.spec.join('+'), balanced_rule:bal,
                matches_spec: win? (win.cfg===st.spec.join('+')) : null,
                matches_balanced: win? (win.cfg===bal) : null});
    });
    try{ localStorage.setItem(KEY, JSON.stringify(out)); }catch(e){ console.error('SAVE FAILED (' + KEY + '): ' + e.name); document.title = 'SAVE FAILED'; }
    document.title='SEQ DONE';
    return out;
  };
